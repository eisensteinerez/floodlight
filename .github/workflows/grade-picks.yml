# Grades the pick channels and posts the results in #verified-records at 12:30 AM and 8:00 AM Eastern.
# It runs here first because Discord often blocks requests from Render's shared address (Cloudflare "error 1015").
# GitHub's timer is best-effort, so if a set time isn't posted within 35 minutes the server posts it (from minute 40).
# Both share one record (pick-data branch here, /api/picks/state on the server, encrypted with a key made from the bot
# token; the newest wins), so nothing is posted twice. Runs with nothing due exit in seconds.
# Needs one repository secret (Settings > Secrets and variables > Actions): DISCORD_BOT_TOKEN, the same value as on Render.
name: Grade pick channels
on:
  schedule:
    - cron: "30,40,50 4,5 * * *"       # 12:30 AM Eastern (summer and winter time)
    - cron: "0,10,20,30 12,13 * * *"   # 8:00 AM Eastern
    - cron: "45 6,7,14,15 * * *"       # copies a record the server posted into the pick-data branch
  workflow_dispatch:
    inputs:
      now:
        description: "Grade and post right away"
        type: boolean
        default: false
      history:
        description: "Re-check the whole history: read every post since each channel began, grade it again and post the all-time records"
        type: boolean
        default: false
      reset:
        description: "Start the record over (the next scheduled run posts everything again)"
        type: boolean
        default: false
      delete:
        description: "Message ids of the bot's posts in the results channel to delete first (space separated)"
        type: string
        default: ""
      preview:
        description: "Only show what it reads and how each pick grades (posts nothing)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: grade-picks
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Load the record
        run: |
          mkdir -p data
          if git fetch --depth=1 origin pick-data 2>/dev/null; then git show FETCH_HEAD:pick-tracker.enc > data/pick-tracker.enc 2>/dev/null || rm -f data/pick-tracker.enc; fi
          if [ "${{ inputs.reset }}" = "true" ]; then rm -f data/pick-tracker.enc; echo "record reset"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cryptography>=42"
      - name: Delete posts
        if: inputs.delete != ''
        run: python3 pick_tracker.py delete ${{ inputs.delete }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PICKS_DATA_DIR: data
      - run: python3 pick_tracker.py ${{ inputs.preview && 'try' || (inputs.now || inputs.history) && 'now' || 'scheduled' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PICKS_DATA_DIR: data
          PICKS_RESET: ${{ inputs.reset && 'true' || 'false' }}
          PICKS_HISTORY: ${{ inputs.history && 'true' || 'false' }}
      - name: Save the record
        if: always() && !inputs.preview
        run: |
          [ -f data/pick-tracker.enc ] || exit 0
          cd data
          git init -q -b pick-data
          git config user.name "floodlight-bot"
          git config user.email "floodlight-bot@users.noreply.github.com"
          git add pick-tracker.enc
          git commit -qm "Pick record $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pick-data
