# Grades the pick channels and posts the results in #verified-records at 12:30 AM and 8:00 AM Eastern.
# It runs here as well as on the server because Discord often blocks requests from Render's shared address
# (Cloudflare "error 1015"). Every run checks what is due and exits in seconds when nothing is; a run that failed is
# tried again on the next one. The record is shared with the server through the database.
# Needs two repository secrets (Settings > Secrets and variables > Actions): DISCORD_BOT_TOKEN and DATABASE_URL,
# the same values as on Render.
name: Grade pick channels
on:
  schedule:
    - cron: "*/20 4,5,6,7 * * *"      # around 12:30 AM Eastern (summer and winter time)
    - cron: "*/20 12,13,14,15 * * *"  # around 8:00 AM Eastern
  workflow_dispatch:
    inputs:
      now:
        description: "Grade and post right away"
        type: boolean
        default: false
concurrency:
  group: grade-picks
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pg8000>=1.31,<2"
      - run: python3 pick_tracker.py ${{ inputs.now && 'now' || 'scheduled' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
