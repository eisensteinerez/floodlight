name: tmp predict check
on:
  push:
    branches: [claude/project-thread-21m4v1]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 tests/predict_live.py nba:Knicks nba:Lakers nba nfl:Eagles nfl soccer:Arsenal soccer:Barcelona
