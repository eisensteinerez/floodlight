/* ---------- colours ---------- */
function hex(c){ c = (c||'').replace('#',''); return /^[0-9a-f]{6}$/i.test(c) ? '#'+c : null }
function rgb(h){ const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255] }
function dist(a,b){ const x=rgb(a), y=rgb(b); return Math.hypot(x[0]-y[0], x[1]-y[1], x[2]-y[2]) }
function hsl(h){ const [r,g,b] = rgb(h).map(v=>v/255); const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn; let H = 0;
  if (d) H = mx===r ? ((g-b)/d)%6 : mx===g ? (b-r)/d+2 : (r-g)/d+4; H = (H*60+360)%360; const L = (mx+mn)/2; return [H, d ? d/(1-Math.abs(2*L-1)) : 0, L] }
function lum(h){ const [r,g,b] = rgb(h).map(v=>{v/=255; return v<=.03928? v/12.92 : ((v+.055)/1.055)**2.4}); return .2126*r+.7152*g+.0722*b }
// Pick a usable team colour: avoid near-white/near-black, and keep home and away visually apart.
function teamColors(h, a){
  const ok = c => c && lum(c) > .03 && lum(c) < .85;
  let hc = ok(hex(h.color)) ? hex(h.color) : ok(hex(h.alt)) ? hex(h.alt) : '#3D6FD9';
  let ac = ok(hex(a.color)) ? hex(a.color) : ok(hex(a.alt)) ? hex(a.alt) : '#D9563D';
  const clash = (x, y) => { const [hx, sx] = hsl(x), [hy, sy] = hsl(y); const dh = Math.min(Math.abs(hx-hy), 360-Math.abs(hx-hy));
    return dist(x, y) < 110 || (sx > .25 && sy > .25 && dh < 35) };
  if (clash(hc, ac)) { const alt = hex(a.alt); ac = ok(alt) && !clash(hc, alt) ? alt : ['#2F6FED','#F2A516','#16A085','#E04A4A'].find(c => !clash(hc, c)); }
  return [hc, ac];
}

/* ---------- data ---------- */
async function getJSON(url){ const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json() }

function norm(ev, slug){
  const c = ev.competitions?.[0]; if (!c) return null;
  const side = ha => { const x = c.competitors.find(t=>t.homeAway===ha) || {}; const t = x.team || {};
    if (t.id) teamNames.set(String(t.id), t.displayName || t.name);
    let logo = t.logo || t.logos?.[0]?.href;
    if ((!logo || /default-team-logo/.test(logo)) && (t.displayName || t.name)) logo = `/api/img/team?name=${encodeURIComponent(t.displayName || t.name)}`;
    return { id: t.id, name: t.shortDisplayName || t.displayName || t.name, full: t.displayName, abbr: t.abbreviation, logo,
      color: t.color, alt: t.alternateColor, score: (typeof x.score === 'object' && x.score ? x.score.displayValue : x.score) ?? '', winner: x.winner, form: x.form || '', shootout: x.shootoutScore } };
  const st = c.status?.type || ev.status?.type || {};
  const home = side('home'), away = side('away');
  const [hc, ac] = teamColors(home, away);
  let league = LG[slug];
  if (slug === 'all') league = { ...OTHER, name: prettySeason(ev.season?.slug) };
  return { id: ev.id, slug, league, date: new Date(ev.date), state: st.state, completed: st.completed, detail: st.shortDetail || st.detail || '', desc: st.description,
    clock: c.status?.displayClock, home, away, hc, ac, venue: c.venue?.fullName, city: c.venue?.address?.city, note: c.notes?.[0]?.headline || '',
    broadcast: c.broadcasts?.flatMap(b=>b.names||[]).join(', ') || '' };
}
function prettySeason(s){
  if (!s) return 'Other competitions';
  const t = s.replace(/^\d{4}(-\d{2,4})?-/, '').replace(/-/g,' ').trim();
  if (!t || /^(league phase|regular season|group stage|round of \d+|knockout.*|final|semifinals?|quarterfinals?)$/i.test(t)) return 'Other competitions';
  return t.replace(/\b(fifa|uefa|afc|caf|u \d+)\b/gi, m=>m.toUpperCase().replace(' ','-')).replace(/\b[a-z]/g, m=>m.toUpperCase());
}

let loadSeq = 0;
async function loadDay(slugs){
  const seq = ++loadSeq; const day = ymd(S.date);
  setSync(true);
  const list = (slugs || [...LEAGUES.map(l=>l.slug), 'all']).filter(s => !FM_SOURCE[s]);
  const fmList = Object.keys(FM_SOURCE).filter(s => !slugs || slugs.includes(s));
  const fmDone = Promise.allSettled(fmList.map(s => cjT(`/api/fm/league?id=${FM_SOURCE[s]}`, 55000)));
  const results = await Promise.allSettled(list.map(slug => getJSON(`${BASE}/${slug}/scoreboard?dates=${day}`).then(d=>({slug,d}))));
  if (seq !== loadSeq) return;
  if (!slugs) { S.events = new EvMap(); S.byLeague = {}; }
  for (const r of results) {
    if (r.status !== 'fulfilled') continue;
    const { slug, d } = r.value;
    if (slug !== 'all') { const lg = d.leagues?.[0]; if (lg && LG[slug]) { LG[slug].logo = lg.logos?.[0]?.href || LG[slug].logo; } }
    for (const ev of d.events || []) {
      if (slug === 'all' && S.events.has(ev.id) && S.events.get(ev.id).slug !== 'all') continue;
      const m = norm(ev, slug); if (!m) continue;
      S.events.set(ev.id, m);
    }
  }
  await fmDone; if (seq !== loadSeq) return;
  await Promise.allSettled(fmList.map(loadFMDay));
  detectGoals();
  S.loading = false; S.lastSync = new Date();
  setSync(false);
  render();
  loadListOdds().catch(() => {});
  if (S.sel && S.events.has(S.sel)) refreshSheetHero();
}
function detectGoals(){
  for (const e of S.events.values()) {
    const key = e.id, now = [+e.home.score||0, +e.away.score||0];
    const was = prevScores.get(key);
    if (was && e.state === 'in') {
      if (now[0] > was[0]) goal(e, 'home'); else if (now[1] > was[1]) goal(e, 'away');
    }
    prevScores.set(key, now);
  }
}
function goal(e, side){
  const t = e[side];
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<b>Goal</b><span>${esc(t.name)}<br><span class="num" style="opacity:.7">${esc(e.home.abbr)} ${esc(e.home.score)}–${esc(e.away.score)} ${esc(e.away.abbr)} · ${esc(e.clock)}</span></span>`;
  el.onclick = () => select(e.id);
  $('toasts').appendChild(el); setTimeout(()=>el.remove(), 9000);
  if (store.get('fl.alerts', true)) $('announce').textContent = `Goal for ${t.full||t.name}. ${e.home.name} ${e.home.score}, ${e.away.name} ${e.away.score}, ${e.clock}.`;
  requestAnimationFrame(()=>{ const c = document.querySelector(`[data-ev="${e.id}"]`); c && c.classList.add('goal-flash'); });
}

function card(e){

async function loadPickedEvent(id){
  const p = S.picks.find(x => String(x.id) === String(id)); if (!p) return null;
  if (p.src === 'fm' && p.fmId) { openFMMatch(p.fmId); return 'fm' }
  const d = new Date(p.date), slug = p.slug || 'all';
  for (const day of [d, new Date(+d - DAY), new Date(+d + DAY)]) {
    try {
      const j = await getJSON(`${BASE}/${slug}/scoreboard?dates=${ymd(day)}`);
      const ev = (j.events || []).find(x => String(x.id) === String(id));
      const m = ev && norm(ev, slug);

    } catch {}
  }
  return null;
}
async function select(id){

async function loadSummary(){
  const e = S.events.get(S.sel); if (!e) return; const seq = ++sumSeq;
  if (S.stack[S.stack.length-1]?.type !== 'match') return;
  if (e.src === 'fm') {
    try { const d = await fmSummary(e); if (seq === sumSeq) S.summary = d } catch { if (seq === sumSeq) S.summary = { error: true } }

function plays(s){ return (s.commentary || []).map(c=>c.play).filter(Boolean) }

function pitchPane(e, s){

    const end = x => { if (x.p.fieldPosition2X == null) return null; const X = x.p.fieldPosition2X * 1.05, Y = x.p.fieldPosition2Y * .68; return x.side === 'home' ? [X, Y] : [105 - X, 68 - Y] };

function posInfo(a){

  else if (/^(CM|LM|RM|M)/.test(a)) depth = 3;
  else if (/^(AM|LW|RW|LF|RF|SS)/.test(a)) depth = 4;
  else if (/^(F|CF|ST|FW|S)/.test(a)) depth = 5;

function preview(e, s){

/* momentum */
const W = { goal: 6, on: 3, off: 1.4, blk: 1, corner: 1.1 };
function flowPane(e, s){
  const ps = plays(s);
  const evs = ps.map(p => { let k = shotKind(p.type?.type); if (!k && p.type?.type === 'corner-awarded') k = 'corner'; return k ? { k, side: teamSide(p.team), m: (p.clock?.value||0)/60 } : null }).filter(x => x && x.side);
  if (!evs.length) return `<div class="note">${e.state==='pre' ? 'Momentum builds from shots, corners and goals once the match starts.' : 'Not enough play-by-play data for a momentum chart.'}</div>` + keyEventsList(e, s);
  const maxM = Math.max(90, Math.ceil(Math.max(...evs.map(x=>x.m)))+2);
  const Wd = 600, Hh = 200, mid = Hh/2, sx = m => m / maxM * Wd;
  const series = side => { const a = []; for (let m=0; m<=maxM; m+=.5) { let v = 0; for (const x of evs) if (x.side===side) { const d = m - x.m; if (d >= -1.5) v += W[x.k] * Math.exp(-(d*d)/(2*2.6*2.6)) } a.push([m,v]) } return a };
  const hs = series('home'), as = series('away');
  const max = Math.max(1, ...hs.map(x=>x[1]), ...as.map(x=>x[1]));
  const sy = v => v / max * (mid - 14);
  const path = (arr, dir) => `M0 ${mid} ` + arr.map(([m,v]) => `L${sx(m).toFixed(1)} ${(mid - dir*sy(v)).toFixed(1)}`).join(' ') + ` L${Wd} ${mid}Z`;
  let ticks = ''; for (let m=0; m<=maxM; m+=15) ticks += `<line x1="${sx(m)}" x2="${sx(m)}" y1="6" y2="${Hh-6}" stroke="var(--line)" stroke-width="1"/><text x="${sx(m)}" y="${Hh+14}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Inter,sans-serif">${m}'</text>`;
  const goals = (s.keyEvents||[]).filter(k=>k.scoringPlay).map(k => { const side = teamSide(k.team); const x = sx((k.clock?.value||0)/60); const y = side==='home' ? 10 : Hh-10;
    return `<g><line x1="${x}" x2="${x}" y1="${mid}" y2="${y}" stroke="var(--fg)" stroke-width="1" stroke-dasharray="2 2"/><circle cx="${x}" cy="${y}" r="7" fill="var(--surface)" stroke="var(--fg)" stroke-width="1.2"/><text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="9">⚽</text></g>` }).join('');
  const now = e.state === 'in' ? (()=>{ const m = parseInt(e.clock)||0; const x = sx(m); return `<line x1="${x}" x2="${x}" y1="0" y2="${Hh}" stroke="var(--live)" stroke-width="1.5"/><text x="${x+4}" y="12" font-size="10" fill="var(--live)" font-family="Inter,sans-serif">NOW</text>` })() : '';
  const ht = `<line x1="${sx(45)}" x2="${sx(45)}" y1="0" y2="${Hh}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`;
  return `<div class="flow"><h5>Attacking pressure · shots, corners and goals</h5>
    <svg viewBox="0 -4 ${Wd} ${Hh+24}" role="img" aria-label="Momentum chart">${ticks}${ht}
      <path d="${path(hs,1)}" fill="${e.hc}" fill-opacity=".75"/><path d="${path(as,-1)}" fill="${e.ac}" fill-opacity=".75"/>
      <line x1="0" x2="${Wd}" y1="${mid}" y2="${mid}" stroke="var(--fg)" stroke-opacity=".4"/>
      <text x="6" y="22" font-size="11" font-weight="600" fill="var(--fg)">${esc(e.home.name)}</text><text x="6" y="${Hh-10}" font-size="11" font-weight="600" fill="var(--fg)">${esc(e.away.name)}</text>
      ${goals}${now}</svg></div>` + keyEventsList(e, s);
}
function icon(t){
  t = t || '';

  if (/red/.test(t)) return '<svg class="ic" width="10" height="14"><rect width="10" height="14" rx="2" fill="#E5383B"/></svg>';
  if (/yellow/.test(t)) return '<svg class="ic" width="10" height="14"><rect width="10" height="14" rx="2" fill="#F4C542"/></svg>';
  if (/substitution/.test(t)) return '<svg class="ic" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 2v9M1.5 8.5 4 11l2.5-2.5" stroke="var(--loss)"/><path d="M10 12V3M7.5 5.5 10 3l2.5 2.5" stroke="var(--win)"/></svg>';
  if (/penalty/.test(t)) return '◎';
  if (/var/.test(t)) return '▣';

}
function keyEventsList(e, s){
  const keep = /goal|card|substitution|penalty|halftime|end-regular|var/;
  const ks = (s.keyEvents||[]).filter(k => keep.test(k.type?.type||''));
  if (!ks.length) return '';
  return `<ul class="events">` + ks.slice().reverse().map(k => {
    const t = k.type?.type || '';
    if (/halftime|end-regular/.test(t)) return `<li class="ev period">${esc(k.type.text)}</li>`;
    const side = teamSide(k.team), ps = k.participants || [];
    let who = ps[0]?.athlete?.displayName || k.shortText || '', sub = '';
    if (/substitution/.test(t)) { who = ps[0]?.athlete?.displayName || ''; sub = ps[1] ? 'off: ' + ps[1].athlete.displayName : '' }
    else if (/goal/.test(t) && ps[1]) sub = 'assist: ' + ps[1].athlete.displayName;
    else sub = k.type?.text || '';
    const body = `<div><span class="who">${side==='home'?'':icon(t)+' '}${esc(who)}${side==='home'?' '+icon(t):''}</span><small>${esc(sub)}</small></div>`;
    return `<li class="ev"><div class="h">${side==='home'?body:''}</div><span class="min">${esc(k.clock?.displayValue||'')}</span><div>${side==='away'?body:''}</div></li>`;
  }).join('') + `</ul>`;
}

/* lineups */

  const pitch = xiPitch(sorted.map(r => ({ side: r.homeAway, col: col(r.homeAway), name: r.team?.displayName, formation: r.formation, players: xiFromRoster(e, r) })), 'Starting lineups');

      return luRow({ name: nm, number: p.jersey, club, photo: ESPN_SHOT(p.athlete?.id), inn: p.subbedIn, sub: [p.position?.abbreviation, p.subbedIn ? 'came on' : p.subbedOut ? 'subbed off' : ''].filter(Boolean).join(' · '),
        ev: `${g ? '⚽'.repeat(g) : ''}${stat(p,'redCards') ? icon('red') : stat(p,'yellowCards') ? icon('yellow') : ''}${p.subbedIn ? '<span class="lu-in" aria-label="came on">↑</span>' : ''}${p.subbedOut ? '<span class="lu-out" aria-label="subbed off">↓</span>' : ''}`,
        rating: e.pstats && findMatchPlayer(e.pstats, { name: nm, number: p.jersey, side: r.homeAway })?.rating, attrs: `data-player="${esc(p.athlete?.id||'')}"` }) };

/* lineup pitch with photos */
// One pitch for every lineup: photos, shirt numbers and surnames, with ratings, goals, cards and subs on top.

const ESPN_SHOT = id => id ? `https://a.espncdn.com/i/headshots/soccer/players/full/${id}.png` : '';
const clampPct = v => Math.max(7, Math.min(93, v));

function xiPlayer(p, side, col, half){
  const d = Math.max(0, Math.min(1, p.d)), x = Math.max(0, Math.min(1, p.x));
  const depth = half ? 100 - (8 + d * 84) : 7 + d * 41;
  const pos = half ? { vx: clampPct(x * 100), vy: depth, hx: clampPct(x * 100), hy: depth }
    : side === 'home' ? { vx: clampPct((1 - x) * 100), vy: depth, hx: depth, hy: clampPct(x * 100) }

  const label = [p.number ? '#' + p.number : '', p.name, p.pos, p.rating ? 'rating ' + (+p.rating).toFixed(1) : '', g ? `${g} goal${g > 1 ? 's' : ''}` : '', p.rc ? 'sent off' : p.yc ? 'booked' : '', p.off ? 'subbed off' : '', p.note || ''].filter(Boolean).join(' · ');
  return `<button class="xp${p.low ? ' low' : ''}${p.warn ? ' warn' : ''}" style="--vx:${pos.vx}%;--vy:${pos.vy}%;--hx:${pos.hx}%;--hy:${pos.hy}%;--c:${col};--ci:${ink}" ${p.attrs || ''} data-tip="${esc(label)}" aria-label="${esc(label)}">
    <span class="xp-ph">${pface(p.name, p.club, p.photo, 'xp-img')}<span class="xp-no">${esc(p.number || '')}</span>${p.rating ? rtChip(p.rating) : ''}${badges}</span>

// teams: [{ side, col, name, formation, players }]; one team draws half a pitch, attacking upwards
function xiPitch(teams, label = 'Lineups'){
  teams = teams.filter(t => t?.players?.length); if (!teams.length) return '';
  const half = teams.length === 1;
  const head = `<div class="xi-head">${teams.map(t => `<span><i style="background:${t.col}"></i>${esc(t.name || '')}${t.formation ? ` <small>${esc(t.formation)}</small>` : ''}</span>`).join('')}</div>`;
  return `<div class="xi-box">${half ? '' : head}<div class="pitch-wrap xi${half ? ' half' : ''}" id="pitchWrap" role="group" aria-label="${esc(label)}">${xiLines(true, half)}${half ? '' : xiLines(false)}
    ${teams.map(t => t.players.map(p => xiPlayer(p, t.side, t.col, half)).join('')).join('')}</div></div>`;

// ESPN-style positions ("CD-L", "RW", "F"): rows by depth, left to right by side
function xiFromPositions(list){
  const rows = {};
  list.forEach(p => { const i = posInfo(p.pos); (rows[i.depth] ??= []).push({ p, ...i }) });
  const depths = Object.keys(rows).map(Number).sort((a, b) => a - b), outfield = depths.filter(d => d > 0);
  const dOf = { 0: 0 }; outfield.forEach((dp, i) => dOf[dp] = outfield.length === 1 ? .6 : .22 + i * (.78 / (outfield.length - 1)));
  const out = [];
  for (const dp of depths) rows[dp].sort((a, b) => a.lat - b.lat || (a.p.place || 0) - (b.p.place || 0)).forEach((o, i, row) => out.push({ ...o.p, d: dOf[dp], x: (i + 1) / (row.length + 1) }));
  return out;
}

/* table */
async function loadTable(e){
  const slug = e.summarySlug || e.slug;
  const target = () => document.getElementById('tbl');
  const season = S.tblSeason ?? seasonOf(e.date, slug), key = slug + '|' + season;
  if (target()) target().insertAdjacentHTML('beforebegin', `<div class="tc-bar">${seasonSelect('mtSeason', season, slug)}</div>`);
  let data = S.standings[key];
  if (!data) {
    try { data = await getJSON(`${BASE2}/${slug}/standings?season=${season}`); S.standings[key] = data } catch { data = null }
  }
  const el = target(); if (!el || S.tab !== 'table') return;
  const groups = data ? (data.children?.length ? data.children : data.standings ? [data] : []) : [];
  const ok = groups.filter(g => g.standings?.entries?.length);
  if (!ok.length) {
    const lite = S.summary?.standings?.groups?.filter(g=>g.standings?.entries?.length) || [];
    if (!lite.length) { el.innerHTML = `<div class="note">No league table for this competition.</div>`; return }
    el.innerHTML = lite.map(g => tableHTML(e, g.header || '', g.standings.entries, true)).join(''); return;
  }
  // show groups containing either team first when there are many groups
  const has = g => g.standings.entries.some(x => x.team?.id === e.home.id || x.team?.id === e.away.id);
  const ordered = ok.length > 2 ? [...ok.filter(has), ...ok.filter(g=>!has(g))].slice(0, Math.max(1, ok.filter(has).length)) : ok;
  el.innerHTML = ordered.map(g => tableHTML(e, ok.length > 1 ? (g.name || g.abbreviation) : '', g.standings.entries)).join('');
}
function tableHTML(e, name, entries, lite){
  const v = (x, n) => { const s = (x.stats||[]).find(s=>s.name===n || s.type===n); return s ? (s.displayValue ?? s.value) : '' };
  const notes = new Map();
  const rows = entries.slice().sort((a,b) => (+v(a,'rank')||0) - (+v(b,'rank')||0)).map((x, i) => {
    const t = x.team || {}; const id = t.id || x.id; const nm = t.shortDisplayName || t.displayName || x.team;
    if (x.note) notes.set(x.note.description, x.note.color);
    const hl = id === e.home.id || id === e.away.id;
    const logo = t.logos?.[0]?.href;
    return `<tr class="${hl?'hl':''}"><td class="r num">${x.note?`<i style="background:${esc(x.note.color)}"></i>`:''}${esc(v(x,'rank')||i+1)}</td>
      <td class="t">${logo?`<img src="${esc(logo)}" alt="" loading="lazy">`:''}${id ? `<button class="linkbtn" data-team="${esc(id)}">${esc(nm)}</button>` : esc(nm)}</td>
      <td>${esc(v(x,'gamesPlayed'))}</td><td>${esc(v(x,'wins'))}</td><td>${esc(v(x,'ties'))}</td><td>${esc(v(x,'losses'))}</td><td>${esc(v(x,'pointDifferential'))}</td><td class="pts">${esc(v(x,'points'))}</td></tr>`;
  }).join('');
  return `${name?`<div class="grp-name">${esc(name)}</div>`:''}<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${notes.size?`<div class="notes">${[...notes].map(([d,c])=>`<span><i style="background:${esc(c)}"></i>${esc(d)}</span>`).join('')}</div>`:''}`;
}

  const team = img.src.match(/teamlogos\/soccer\/500\/(\d+)\.png/);
  if (team && teamNames.has(team[1]) && !img.dataset.tried) { img.dataset.tried = 1; img.src = imgTeam(teamNames.get(team[1])); return }
  const shot = img.src.match(/headshots\/soccer\/players\/full\/(\d+)\.png/);
  if (shot && athleteNames.has(shot[1]) && !img.dataset.tried) { img.dataset.tried = 1; img.dataset.sil = 1; img.src = imgPlayer(...athleteNames.get(shot[1])); return }
  // the server answers 503 while Transfermarkt is rate-limiting us: show the silhouette, then try again later
  const api = img.src.match(/^(.*\/api\/img\/[^#]*?)(?:&r=\d+)?$/);
  if (api && (+img.dataset.retry || 0) < 3) { const n = (+img.dataset.retry || 0) + 1; img.dataset.retry = n; img.src = SIL;
    setTimeout(() => { if (img.isConnected) img.src = `${api[1]}&r=${n}` }, 25000 * n); return }
  if (img.dataset.sil) { delete img.dataset.sil; img.src = SIL; return }
  if (/\/api\/img\/team/.test(img.src) || team) img.style.visibility = 'hidden';

const logoDark = new Map();   // src -> true / false / null (couldn't be read)
const LOGO_SRC = /logo|crest|wappen|teamlogo|api\/img\/team/i;
function paintLogo(img, dark){ img.classList.toggle('lg-dark', !!dark) }
document.addEventListener('load', ev => {
  const img = ev.target; if (!(img instanceof HTMLImageElement) || !LOGO_SRC.test(img.src) || /^data:/.test(img.src)) return;
  if (logoDark.has(img.src)) return paintLogo(img, logoDark.get(img.src));
  logoDark.set(img.src, null);
  const probe = new Image(); probe.crossOrigin = 'anonymous';
  probe.onload = () => { try {
    const c = document.createElement('canvas'); c.width = c.height = 24; const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(probe, 0, 0, 24, 24);
    const d = g.getImageData(0, 0, 24, 24).data; let n = 0, sum = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 128) { n++; sum += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255 }
    const dark = n > 20 && sum / n < 0.15; logoDark.set(probe.src, dark);
    document.querySelectorAll('img').forEach(i => { if (i.src === probe.src) paintLogo(i, dark) });
  } catch {} };
  probe.src = img.src;
}, true);

const timed = new Map();
async function cjT(url, ttl){
  const hit = timed.get(url);
  if (hit && Date.now() - hit.t < ttl) return hit.p;
  const p = getJSON(url).then(d => { if (d && d.error) throw new Error(d.error); return d });
  timed.set(url, { t: Date.now(), p }); p.catch(() => timed.delete(url));
  return p;
}
const KX = {'eng.1':'EPL','esp.1':'LALIGA','ger.1':'BUNDESLIGA','ita.1':'SERIEA','fra.1':'LIGUE1','por.1':'LIGAPORTUGAL','ned.1':'EREDIVISIE','sco.1':'SCOTTISHPREM','tur.1':'SUPERLIG','eng.2':'EFLCHAMPIONSHIP',
  'uefa.champions':'UCL','uefa.europa':'UEL','uefa.europa.conf':'UECL','eng.fa':'FACUP','eng.league_cup':'EFLCUP','esp.copa_del_rey':'COPADELREY','ger.dfb_pokal':'DFBPOKAL','ita.coppa_italia':'COPPAITALIA',
  'usa.1':'MLS','mex.1':'LIGAMX','concacaf.champions':'CONCACAFCCUP','concacaf.leagues.cup':'LEAGUESCUP','conmebol.libertadores':'CONMEBOLLIB','conmebol.sudamericana':'CONMEBOLSUD','arg.1':'ARGPREMDIV',
  'bra.1':'BRASILEIRO','ksa.1':'SAUDIPL','isr.1':'ISRPL','uefa.nations':'UEFANL','concacaf.nations.league':'CONCACAFNL','fifa.friendly':'INTLFRIENDLY','caf.nations':'AFCON','fifa.world':'FIFA'};

const STOP = /\b(fc|cf|afc|sc|ac|club|de|cd|ud|sk|fk|bk|ss|as|calcio|football|futbol|the)\b/g;
const tn = s => normName(s).replace(STOP, ' ').replace(/\s+/g, ' ').trim();
function teamSim(a, b){
  a = tn(a); b = tn(b); if (!a || !b) return 0; if (a === b) return 1;
  if (a.includes(b) || b.includes(a)) return .85;
  const A = new Set(a.split(' ')), B = new Set(b.split(' ')); let n = 0; A.forEach(x => B.has(x) && n++);
  return n / new Set([...A, ...B]).size;
}
const MON = {JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
function kxDate(ticker){ const m = ticker.match(/-(\d{2})([A-Z]{3})(\d{2})/); return m ? Date.UTC(2000 + +m[1], MON[m[2]], +m[3]) : null }
const price = m => { const b = +m.yes_bid_dollars, a = +m.yes_ask_dollars, l = +m.last_price_dollars;
  return b > 0 && a > 0 ? (b + a) / 2 : l || b || a || 0 };
const prev = m => +m.previous_price_dollars || null;
async function kxSeries(prefix, kind){
  const d = await cjT(`/api/kalshi/events?series_ticker=KX${prefix}${kind}&status=open&with_nested_markets=true&limit=200`, 20000);
  S.serverOK = true; return d.events || [];
}
function kxFind(events, e){
  const day = Date.UTC(e.date.getUTCFullYear(), e.date.getUTCMonth(), e.date.getUTCDate());
  let best = null, bestScore = 0;
  for (const k of events) {
    const kd = kxDate(k.event_ticker); if (kd != null && Math.abs(kd - day) > 864e5 * 1.5) continue;
    const [A, B] = (k.title || '').split(/ vs\.? | v | at /i).map(s => (s||'').replace(/:.*$/, ''));
    const straight = Math.max(teamSim(e.home.full, A), teamSim(e.home.name, A)) + Math.max(teamSim(e.away.full, B), teamSim(e.away.name, B));
    const swapped = Math.max(teamSim(e.home.full, B), teamSim(e.home.name, B)) + Math.max(teamSim(e.away.full, A), teamSim(e.away.name, A));
    const sc = Math.max(straight, swapped);
    if (sc > bestScore) { bestScore = sc; best = k }
  }
  return bestScore >= 1.1 ? best : null;
}
function sideOf(e, label){ const h = Math.max(teamSim(e.home.full, label), teamSim(e.home.name, label)), a = Math.max(teamSim(e.away.full, label), teamSim(e.away.name, label)); return h > a ? 'home' : a > h ? 'away' : null }
function parseML(e, k){
  const out = { ticker: k.event_ticker };
  for (const m of k.markets || []) {
    const lbl = m.yes_sub_title || '';
    const side = /^(tie|draw)$/i.test(lbl) ? 'draw' : sideOf(e, lbl.replace(/ wins?$/i, ''));
    if (side) out[side] = { p: price(m), prev: prev(m), vol: +m.volume_fp || 0, ticker: m.ticker };
  }
  return out.home && out.away ? out : null;
}
async function loadListOdds(){
  const pool = [...S.events.values(), ...S.extra.values()];   // today's list plus any league "upcoming" list
  const slugs = [...new Set(pool.filter(e => e.state !== 'post' && KX[e.slug]).map(e => e.slug))];
  if (!slugs.length) return;
  const res = await Promise.allSettled(slugs.map(s => kxSeries(KX[s], 'GAME').then(evs => ({ s, evs }))));
  if (res.every(r => r.status === 'rejected')) { S.serverOK = S.serverOK || false; return }
  let changed = false;
  for (const r of res) { if (r.status !== 'fulfilled') continue;
    for (const e of pool) { if (e.slug !== r.value.s || e.state === 'post') continue;
      const k = kxFind(r.value.evs, e); if (!k) continue;
      const ml = parseML(e, k); if (!ml) continue;
      const o = S.odds.get(e.id) || {}; o.ml = ml; S.odds.set(e.id, o); changed = true } }
  if (changed) render();
}
async function loadMatchOdds(e){
  const pre = KX[e.slug]; if (!pre) return { none: true };
  const [g, sp, to] = await Promise.allSettled(['GAME','SPREAD','TOTAL'].map(k => kxSeries(pre, k)));
  if ([g, sp, to].every(r => r.status === 'rejected')) return { offline: true };
  const o = S.odds.get(e.id) || {};
  const kg = val(g) && kxFind(val(g), e); if (kg) { o.ml = parseML(e, kg); o.title = kg.title }
  const ks = val(sp) && kxFind(val(sp), e);
  if (ks) o.spread = (ks.markets||[]).map(m => ({ side: sideOf(e, (m.yes_sub_title||'').replace(/ wins by.*$/i, '')), line: +m.floor_strike, p: price(m), prev: prev(m), label: m.yes_sub_title })).filter(x => x.side).sort((a,b) => a.line - b.line);
  const kt = val(to) && kxFind(val(to), e);
  if (kt) o.total = (kt.markets||[]).map(m => ({ line: +m.floor_strike, p: price(m), prev: prev(m) })).filter(x => x.line).sort((a,b) => a.line - b.line);
  o.at = Date.now(); o.found = !!(kg || ks || kt);
  S.odds.set(e.id, o); return o;
}

const american = p => !p || p >= .995 || p <= .005 ? '–' : p >= .5 ? '−' + Math.round(100 * p / (1 - p)) : '+' + Math.round(100 * (1 - p) / p);

function tmMatch(squad, name){

  const k = normName(name), parts = k.split(' '), last = parts[parts.length - 1], first = parts[0];

/* value history chart */
function valueChart(hist, col){
  const pts = hist.filter(h => h.value && h.date).map(h => ({ t: +day(h.date), v: h.value })).sort((a,b) => a.t - b.t);
  if (pts.length < 2) return '';
  const W = 600, H = 200, pl = 48, pr = 12, pt = 16, pb = 26;
  const t0 = pts[0].t, t1 = pts[pts.length-1].t, vmax = Math.max(...pts.map(p => p.v)) * 1.1;
  const x = t => pl + (t - t0) / Math.max(1, t1 - t0) * (W - pl - pr), y = v => pt + (1 - v / vmax) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const area = `${line} L${x(t1)} ${H - pb} L${x(t0)} ${H - pb}Z`;
  const step = vmax > 1e8 ? 5e7 : vmax > 4e7 ? 2e7 : vmax > 1e7 ? 5e6 : vmax > 2e6 ? 1e6 : 2.5e5;
  let grid = ''; for (let v = 0; v <= vmax; v += step) grid += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Inter,sans-serif">${eur(v)}</text>`;
  const y0 = new Date(t0).getFullYear(), y1 = new Date(t1).getFullYear(); let years = '';
  for (let yr = y0 + 1; yr <= y1; yr++) { const tx = x(+new Date(yr, 0, 1)); years += `<text x="${tx}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Inter,sans-serif">${yr}</text>` }
  const peak = pts.reduce((a, b) => b.v > a.v ? b : a), last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Market value history, from ${eur(pts[0].v)} to ${eur(last.v)}, peak ${eur(peak.v)}">${grid}${years}
    <path d="${area}" fill="${col}" fill-opacity=".14"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>
    ${pts.map(p => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="2.6" fill="var(--surface)" stroke="${col}" stroke-width="1.6"><title>${new Date(p.t).toLocaleDateString([], {month:'short', year:'numeric'})}: ${eur(p.v)}</title></circle>`).join('')}
    <circle cx="${x(last.t)}" cy="${y(last.v)}" r="5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${Math.min(x(peak.t), W - 60)}" y="${y(peak.v) - 7}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--fg)">Peak ${eur(peak.v)}</text></svg>`;
}

      .then(d => { v.tmp = d; noteValue(v) }).catch(() => { v.tmp = { error: true } }).finally(done);

    if (club) squadFor(club).then(d => { const m = tmMatch(d, a.displayName); v.status = m ? (m.status || null) : undefined }).catch(() => {}).finally(done);
    v.fm = { loading: true };   // FotMob adds season stats, hot zones, ratings and career; matched on name + club
    cjT(v.fmId ? `/api/fm/player?id=${encodeURIComponent(v.fmId)}` : `/api/fm/player?name=${encodeURIComponent(a.displayName)}&club=${encodeURIComponent(club)}`, 30 * 60e3)
      .then(d => { v.fm = d }).catch(() => { v.fm = { error: true } }).finally(done);

    const sh = zoneShares(pts), best = sh.map((x, k) => [x, k]).sort((a, b) => b[0] - a[0]).slice(0, 3);
    const where = best.map(([x, k]) => `${ZONE_ROW[Math.floor(k / 6)]}, ${ZONE_COL[k % 6]} (${Math.round(x * 100)}%)`);
    html += `<div class="sub-h"><h5>Season heatmap</h5><small>${pts.length} touches · attacking →</small></div>
      <div class="pitch-wrap">${pitchSVG(seasonHeat(pts), `Season heatmap from ${pts.length} touches, attacking left to right. Busiest areas: ${where.join('; ')}`)}</div>
      ${HEAT_LEGEND}
      <div class="sub-h"><h5>Zone share</h5><small>Share of touches per zone</small></div>
      <div class="pitch-wrap">${pitchSVG(zoneLayer(sh), `Share of touches in 24 zones. Busiest: ${where.join('; ')}`)}</div>
      <p class="srcnote" style="margin-top:8px">Busiest: ${esc(where.join(' · '))}. Top of the pitch is the player's left as they attack.</p>`;
  }

    html += `<div class="sub-h"><h5>${gk ? 'Shots faced' : 'Season shot map'}</h5><small>${shots.length} shots · ${goals} ${gk ? 'conceded' : 'goals'}${hasXg ? ` · xG ${xg.toFixed(2)}` : ''}</small></div>
      <div class="pitch-wrap half">${pitchSVG(shotMarks(shots, col, true), `${gk ? 'Shots faced' : 'Shots'}: ${shots.length}, ${on} on target, ${goals} ${gk ? 'conceded' : 'goals'}${hasXg ? `, expected goals ${xg.toFixed(2)}` : ''}`, '52.5 0 52.5 68')}</div>${SHOT_LEGEND}`;
  }
  return html + `<p class="srcnote">Touch and shot locations from <a href="${esc(f.url)}" target="_blank" rel="noopener">FotMob</a>.</p>`;
}

/* ---------- seasons, transfer centre, predicted lineups ---------- */
const FIRST_SEASON = 2001;
// the season a date belongs to: European leagues run Aug–May and are named by their start year
function seasonOf(date, slug){ const d = new Date(date); return CAL_YEAR.test(slug||'') ? d.getFullYear() : (d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1) }
function seasonName(y, slug){ return CAL_YEAR.test(slug||'') ? String(y) : `${y}/${String(y + 1).slice(2)}` }
function seasonSelect(id, cur, slug, label = 'Season'){
  const now = seasonOf(new Date(), slug); let opts = '';
  for (let y = now; y >= FIRST_SEASON; y--) opts += `<option value="${y}" ${y === cur ? 'selected' : ''}>${seasonName(y, slug)}</option>`;
  return `<label class="season"><span>${label}</span><select id="${id}" aria-label="${label}">${opts}</select></label>`;
}
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

async function openPlayerByName(name){
  try {
    const d = await cj(`https://site.api.espn.com/apis/common/v3/search?query=${encodeURIComponent(name)}&type=player&sport=soccer&limit=3`);
    const hit = (d.items || []).find(x => teamSim(x.displayName, name) >= .85) || d.items?.[0];

// Transfermarkt down or unmatched: rebuild the club moves from FotMob's career spells (no fees or values there)
function fmTransfersFallback(v, notFound){
  const why = notFound ? `Transfermarkt has no match for ${esc(pName(v))}, so fees and market values aren't available.`
    : `Transfer history is unavailable right now because Transfermarkt isn't answering. Fees and market values will come back when it does.`;
  const C = fmOK(v)?.career, spells = [...(C?.youth?.teams || []), ...(C?.senior?.teams || [])].filter(t => t.start)
    .sort((a, b) => new Date(a.start) - new Date(b.start));
  const note = `<div class="note">${why}${spells.length ? ' Club moves below are from FotMob\'s career history.' : ''}</div>`;
  if (!spells.length) return note;
  if (spells.length === 1) return note + `<p class="srcnote">FotMob lists one club: ${esc(spells[0].team)} since ${yr(spells[0].start)}.</p>`;
  const moves = spells.slice(1).map((t, i) => ({ from: spells[i], to: t })).reverse();
  return note + `<ol class="timeline">${moves.map(({ from, to }) => `<li><span class="d">${esc(day(String(to.start).slice(0, 10)).toLocaleDateString([], {day:'numeric', month:'short', year:'numeric'}))}</span>

      <span class="fee">${esc(to.transfer?.text || to.transfer || '–')}</span></li>`).join('')}</ol>

/* predicted lineups from FotMob */
const FM_LABEL = { predicted: 'Predicted lineup', lastStarting11: 'Last starting XI', standard: 'Confirmed lineup', confirmed: 'Confirmed lineup' };
function fmLineup(home, away, date){ return cjT(`/api/fm/lineup?date=${ymd(date)}&home=${encodeURIComponent(home)}&away=${encodeURIComponent(away)}`, 5 * 60e3).then(d => { S.serverOK = true; return d }) }

function matchFMBlock(e){

    fmLineup(e.home.full || e.home.name, e.away.full || e.away.name, e.date).then(d => { e.fm = d }).catch(() => { e.fm = { error: true } })
      .finally(() => { if (S.sel === e.id && S.stack[S.stack.length-1]?.type === 'match' && ['lineups','pitch'].includes(S.tab)) renderSheet() }) }

  if (f.error || !f.home) return `<div class="note">No predicted lineup published yet. FotMob usually posts one a day or two before kick-off.</div>`;

async function loadMarket(){
  const m = S.mk, seq = (m.seq = (m.seq || 0) + 1);

      const res = await Promise.allSettled([1, 2, 3, 4].map(p => cjT(`/api/tm/transfers/top?season=${m.season}&page=${p}`, 3600e3)));
      if (seq !== m.seq) return;
      res.forEach(r => r.status === 'fulfilled' && addItems(r.value.transfers.map(t => fromRecord(t, m.season))));
      m.pages = m.loaded = 4;

    }

async function loadMorePages(upto, seq = S.mk.seq){
  const m = S.mk, want = []; for (let p = m.loaded + 1; p <= upto; p++) want.push(p);
  m.loading = true;
  while (want.length) {
    const batch = want.splice(0, 4);
    const res = await Promise.allSettled(batch.map(p => getJSON(feedUrl(p))));
    if (seq !== m.seq) return;
    res.forEach(r => r.status === 'fulfilled' && !r.value.error && addItems(r.value.transfers));
    m.loaded = batch[batch.length - 1]; renderMarket();

  m.loading = false; m.at = new Date(); renderMarket();

async function refreshMarket(){
  const m = S.mk;

  if (m.mode === 'day' && m.day !== isoDay(new Date())) return;
  try {
    const res = await Promise.allSettled([1, 2].map(p => getJSON(feedUrl(p) + `&t=${Date.now()}`)));
    let n = 0; res.forEach(r => r.status === 'fulfilled' && !r.value.error && (n += addItems(r.value.transfers, true)));

      const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<b>New</b><span>${msg}</span>`; t.onclick = () => { S.mk.sort = 'date'; renderMarket() };
      $('toasts').appendChild(t); setTimeout(() => t.remove(), 7000);

}

function normFM(f, slug){

const formPts = f => { const r = (f || '').slice(-5).split('').filter(c => 'WDL'.includes(c)); return r.length ? r.reduce((a, c) => a + (c === 'W' ? 3 : c === 'D' ? 1 : 0), 0) / (r.length * 3) : null };

  const preds = evs.map(e => ({ e, P: predict(e) })).filter(x => x.P.ready).sort((a, b) => b.P.top - a.P.top);
  const pending = evs.length - preds.length;
  const settled = S.picks.filter(p => p.result), won = settled.filter(p => p.result === 'won').length;
  const open = S.picks.filter(p => !p.result).sort((a, b) => new Date(a.date) - new Date(b.date));
  const dayLabel = sameDay(S.date, new Date()) ? 'today' : S.date.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
  // category filters (predfilter.js): region, league, confidence, kick-off, value against Kalshi, my teams
  const PF_CATS = [...new Set(LEAGUES.map(l => l.region)), 'More'].map(r => [r, r === 'More' ? 'Other competitions' : r]);
  const items = preds.map(({ e, P }) => ({ e, P, id: e.id, lg: LG[e.slug] && e.slug !== 'all' ? e.slug : 'x:' + (e.league?.name || ''), lgName: LG[e.slug] && e.slug !== 'all' ? LG[e.slug].name : (e.league?.name || 'Other'),
    cat: LG[e.slug] && e.slug !== 'all' ? LG[e.slug].region : 'More', order: LEAGUES.findIndex(l => l.slug === e.slug) + 1 || 99, date: e.date, live: e.state === 'in', conf: P.conf, top: P.top,
    edge: P.market ? P.model[P.pick] - P.market[P.pick] : null, fav: isFav(e.home.id) || isFav(e.away.id) }));
  const shown = typeof PFX === 'undefined' ? items : PFX.apply('soccer', items);
  el.innerHTML = `<div class="livebar"><h2>Predictions</h2><span class="count">${preds.length} match${preds.length === 1 ? '' : 'es'} ${esc(dayLabel)}${S.scope && LG[S.scope] ? ' · ' + esc(LG[S.scope].name) : ''}</span></div>
    <div class="tiles"><div class="tile"><b class="num">${S.picks.length}</b><span>Your picks</span></div><div class="tile"><b class="num">${settled.length ? `${won}/${settled.length}` : '–'}</b><span>Correct so far</span></div>
      <div class="tile"><b class="num">${settled.length ? Math.round(won / settled.length * 100) + '%' : '–'}</b><span>Hit rate</span></div><div class="tile"><b class="num">${open.length}</b><span>Waiting on result</span></div></div>
    ${S.picks.length ? `<div class="sub-h"><h5>Your picks</h5><small>Saved ${S.me ? 'to your profile' : 'in this browser'}</small></div>
      <div class="mypicks">${[...open, ...settled.slice(-10).reverse()].map(p => `<button class="mypick ${p.result || 'open'}" data-ev="${esc(p.id)}"><img src="${esc(p.homeLogo || '')}" alt=""><span>${esc(p.home)} v ${esc(p.away)}<small>${esc(new Date(p.date).toLocaleDateString([], { day: 'numeric', month: 'short' }))} · you picked <strong>${esc(p.pick === 'draw' ? 'Draw' : p[p.pick])}</strong></small></span>
        <em>${p.result === 'won' ? `✓ ${esc(p.final)}` : p.result === 'lost' ? `✗ ${esc(p.final)}` : 'Pending'}</em></button>`).join('')}</div>` : ''}
    <div class="sub-h"><h5>Predictions ${esc(dayLabel)}</h5><small>${pending ? `${pending} still loading` : ''}</small></div>
    ${typeof PFX === 'undefined' ? '' : PFX.bar('soccer', items, PF_CATS)}
    <div class="cards">${shown.map(({ e, P }) => `<button class="m pred-card" data-ev="${esc(e.id)}" data-tab-to="insight" style="--hc:${e.hc};--ac:${e.ac}" aria-label="${esc(`${e.home.full} versus ${e.away.full}: prediction ${pickLabel(e, P.pick)}, ${pct(P.top)} percent, ${P.conf}. Most likely score ${P.score.join(' to ')}`)}">
        <div class="st">${e.state === 'in' ? `<span class="min" style="color:var(--live)">${esc(e.clock)}</span>LIVE` : `<span class="ko">${e.date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`}</div>
        <div class="tms"><div class="tm"><img src="${esc(e.home.logo)}" alt="" loading="lazy"><span>${esc(e.home.name)}</span></div><div class="tm"><img src="${esc(e.away.logo)}" alt="" loading="lazy"><span>${esc(e.away.name)}</span></div>
          ${probBar(e, P.final)}</div>
        <div class="pc-side"><span class="conf ${P.conf === 'Strong' ? 'high' : P.conf === 'Lean' ? 'medium' : 'low'}">${P.conf}</span><b>${esc(pickLabel(e, P.pick))}</b><small class="num">${P.score.join('–')} · ${pct(P.top)}%${S.picks.find(p => p.id === e.id) ? ' · ★ picked' : ''}</small><small class="pfx-lg">${esc(LG[e.slug] && e.slug !== 'all' ? LG[e.slug].name : e.league?.name || '')}</small>${(() => { const sn = snapsOf(e).slice(-1)[0]; return sn && sn.stage !== 'early' ? `<small class="cp-tag ${sn.stage}">${sn.stage === 'final' ? 'Lineups in' : 'Day-before update'}</small>` : '' })()}</div></button>`).join('')
      || (typeof PFX !== 'undefined' && PFX.empty('soccer', items.length)) || (pending ? '<div class="skel"></div><div class="skel"></div>' : `<div class="empty-state"><strong>No upcoming matches</strong>Pick another day with the date bar on the match list, or choose a different league.</div>`)}</div>
    <p class="srcnote">The model uses each team's goals scored and conceded per game, points per game, recent form, home advantage and reported absences; where Kalshi trades a match, the prediction is 60% market, 40% model. Tap a match for the full explanation.</p>${RG}`;
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  if (!ev.target.closest('.search')) hideResults();
  if (S.dateOpen && !ev.target.closest('.datebar, #datePanel')) closeDatePanel();
  if (!ev.target.closest('.prefwrap')) closePrefs();
  if (ev.target.closest('#profileBtn')) return $('profile').hidden ? openProfile() : closeProfile();
  if (ev.target.id === 'profileScrim') return closeProfile();
  if (!$('profile').hidden && ev.target.closest('#profile [data-team], #profile [data-player]')) closeProfile();
  const t = ev.target.closest('[data-calopen],[data-fmmatch],[data-ev],[data-f],[data-date],[data-pname],[data-tab],[data-pm],[data-psentry],[data-team],[data-player],[data-act],[data-pref],#closeBtn,#themeBtn,#prefsBtn'); if (!t) return;
  if (t.id === 'prefsBtn') { $('prefsHost').innerHTML ? closePrefs() : ($('prefsHost').innerHTML = prefsPanel(), t.setAttribute('aria-expanded','true')); return }
  if (t.dataset.pref) { S.prefs.size = +t.dataset.v; store.set('fl.prefs', S.prefs); applyPrefs(); $('prefsHost').innerHTML = prefsPanel(); return }
  if (t.dataset.team) { hideResults(); return openTeam(t.dataset.team, t.dataset.lg) }
  if ((t.dataset.player || t.dataset.pname) && t.closest('#pane') && S.stack[S.stack.length-1]?.type === 'match' && ['pitch','lineups'].includes(S.tab)) {
    const e = S.events.get(S.sel); if (e && e.state !== 'pre') return openMatchPlayer(e, matchRef(t)) }
  if (t.dataset.player) { hideResults(); return openPlayer(t.dataset.player) }
  if (t.dataset.act) return act(t.dataset.act, t, ev);
  if (t.dataset.fmmatch) return openFMMatch(t.dataset.fmmatch);
  if (t.dataset.calopen != null) return openCalItem(S.stack[S.stack.length-1], +t.dataset.calopen);
  if (t.dataset.ev) { if (S.page === 'transfers') { leaveMarket(); render() }
    if (t.dataset.tabTo) { S.tab = t.dataset.tabTo; S.tabForced = true } else if (S.tabForced) { S.tab = 'pitch'; S.tabForced = false }
    return select(t.dataset.ev) }
  if (t.dataset.f) { leaveMarket(); const f = t.dataset.f, before = S.scope;
    if (QUICK.includes(f)) { S.filter = f; if (t.hasAttribute('data-global')) S.scope = null; else if (f === 'all' && S.scope) { S.lgMode = 'upcoming'; store.set('fl.lgMode', 'upcoming') } }   // the chips filter inside the chosen league
    else if (LG[f]) { S.scope = f; if (f !== before) { S.lgMode = 'upcoming'; store.set('fl.lgMode', 'upcoming') } }   // picking a league starts on its upcoming games
    store.set('fl.filter', S.filter); store.set('fl.scope', S.scope); render(); window.scrollTo({top:0});
    if (scopeLeague() && S.scope !== before) openLeague(scopeLeague());
    else if (!S.scope && S.stack[0]?.type === 'league') closeSheet();
    return }
  if (t.dataset.date) { leaveMarket(); const [y, m, d] = t.dataset.date.split('-').map(Number); return goToDate(new Date(y, m - 1, d, 12)) }
  if (t.dataset.pname) { hideResults(); return openPlayerByName(t.dataset.pname) }
  if (t.dataset.tab) { const v = S.stack[S.stack.length-1]; if (v && v.type !== 'match') v.tab = t.dataset.tab; else S.tab = t.dataset.tab; renderSheet(); return }
  if (t.dataset.psentry) { const top = S.stack[S.stack.length-1]; top.entry = t.dataset.psentry; return renderSheet() }
  if (t.dataset.pm) { S.pitchMode = t.dataset.pm; renderSheet(); return }
  if (t.id === 'closeBtn') return closeSheet();
  if (t.id === 'themeBtn') {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; store.set('fl.theme', next);
  }
});
function closePrefs(){ if ($('prefsHost')?.innerHTML) { $('prefsHost').innerHTML = ''; $('prefsBtn').setAttribute('aria-expanded','false') } }
document.addEventListener('change', ev => {
  const id = ev.target.id, top = S.stack[S.stack.length-1];
  if (id === 'datePick' && ev.target.value) { const [y, m, d] = ev.target.value.split('-').map(Number); return goToDate(new Date(y, m - 1, d, 12)) }

  if (id === 'fxSeason') { top.fxSeason = +ev.target.value; return renderSheet() }
  if (id === 'ttSeason') { top.tblSeason = +ev.target.value; return renderSheet() }
  if (id === 'mtSeason') { S.tblSeason = +ev.target.value; return renderSheet() }
  if (id === 'lgSeason') { top.season = +ev.target.value; return renderSheet() }

  const mkMap = { mkSort: 'sort', mkType: 'type', mkPos: 'pos', mkAge: 'age', mkFee: 'minFee', mkLeague: 'league' };

  if (id === 'prefContrast') S.prefs.contrast = ev.target.checked;
  else if (id === 'prefMotion') S.prefs.motion = ev.target.checked;
  else if (id === 'prefAlerts') return store.set('fl.alerts', ev.target.checked);

});
document.addEventListener('keydown', ev => {
  if (!$('profile').hidden) {
    if (ev.key === 'Escape') { closeProfile(); return }
    if (ev.key === 'Tab') { // keep keyboard focus inside the open profile panel
      const f = [...$('profile').querySelectorAll('button, input, textarea, select, a[href]')].filter(x => !x.disabled && x.offsetParent);
      if (f.length && ev.shiftKey && document.activeElement === f[0]) { f[f.length-1].focus(); ev.preventDefault() }
      else if (f.length && !ev.shiftKey && document.activeElement === f[f.length-1]) { f[0].focus(); ev.preventDefault() }

  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches?.('g[data-player],g[data-pname]')) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); return }
  if (ev.key === 'Escape' && $('prefsHost')?.innerHTML) { closePrefs(); $('prefsBtn').focus(); return }
  if (ev.key === 'Escape' && S.dateOpen && ev.target.closest?.('#datePanel')) { S.dateOpen = false; store.set('fl.dateOpen', false); renderDates(); $('dateToggle').focus(); return }
  if (ev.key === 'Escape' && S.big) { setBig(false); return }

  if (ev.target.classList?.contains('tab') && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) {
    const v = S.stack[S.stack.length-1], info = v && v.type !== 'match', list = S.curTabs || TABS, cur = info ? v.tab : S.tab;
    const i = list.findIndex(t=>t[0]===cur); const n = (i + (ev.key==='ArrowRight'?1:-1) + list.length) % list.length;
    if (info) v.tab = list[n][0]; else S.tab = list[n][0]; S.focusTab = true; renderSheet(); ev.preventDefault();
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'pfAddT') profileSearch('team', ev.target.value);

let mkT; document.addEventListener('input', ev => { if (ev.target.id !== 'mkQ') return; clearTimeout(mkT); mkT = setTimeout(() => { S.mk.q = ev.target.value; S.mk.show = 150; renderMarket() }, 200) });
let qT; $('q').addEventListener('input', ev => { clearTimeout(qT); qT = setTimeout(()=>{ S.q = ev.target.value; render(); searchAll(ev.target.value) }, 220) });
$('q').addEventListener('focus', ev => { if (ev.target.value.trim().length > 1) searchAll(ev.target.value) });
$('q').addEventListener('keydown', ev => {

$('sres').addEventListener('keydown', ev => {

  if (ev.key === 'ArrowDown' && i < bs.length-1) { bs[i+1].focus(); ev.preventDefault() }
  if (ev.key === 'ArrowUp') { (i > 0 ? bs[i-1] : $('q')).focus(); ev.preventDefault() }

// pitch tooltips
let tipEl;
function showTip(ev){
  const g = ev.target.closest?.('#sheet [data-tip]'); const wrap = g?.closest('.pitch-wrap');
  if (!g || !wrap) { tipEl?.remove(); tipEl = null; return }
  tipEl?.remove(); tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.textContent = g.dataset.tip;
  const r = g.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  tipEl.style.left = Math.min(Math.max(r.left + r.width/2 - w.left, 110), w.width - 110) + 'px'; tipEl.style.top = (r.top - w.top) + 'px';
  wrap.appendChild(tipEl);
}
document.addEventListener('pointerover', showTip); document.addEventListener('focusin', showTip);

/* ---------- refresh loop ---------- */
function liveSlugs(){ return [...new Set([...S.events.values()].filter(e => e.state === 'in' || (e.state==='pre' && Math.abs(e.date - Date.now()) < 15*60e3)).map(e=>e.slug))] }
setInterval(() => { if (document.hidden) return; const ls = liveSlugs(); if (ls.length && sameDay(S.date, new Date())) loadDay(ls) }, 20000);
setInterval(() => { if (!document.hidden) loadDay() }, 180000);
setInterval(() => { const e = S.events.get(S.sel); if (!document.hidden && e && e.state === 'in') loadSummary() }, 25000);
setInterval(() => { const e = S.events.get(S.sel); if (document.hidden || !e || S.tab !== 'odds' || S.stack[S.stack.length-1]?.type !== 'match') return;
  loadMatchOdds(e).then(() => { if (S.tab === 'odds' && S.sel === e.id) renderSheet() }).catch(() => {}) }, 20000);

// tell the viewer when a newer version of the app is on the server, instead of silently running the old one
let appVersion = null;
async function checkVersion(){
  try {
    const { v } = await fetch('/api/version', { cache: 'no-store' }).then(r => r.json());
    if (appVersion == null) { appVersion = v; return }
    if (v !== appVersion && !$('updToast')) {
      const t = document.createElement('div'); t.className = 'toast'; t.id = 'updToast';
      t.innerHTML = `<span>Floodlight was updated.</span><button class="btn" style="padding:6px 12px;font-size:12px" data-act="reload">Reload</button>`;
      $('toasts').appendChild(t);
    }
  } catch {}
}
setInterval(() => { if (!document.hidden) checkVersion() }, 30000);
(function init(){
  checkVersion();
  applyPrefs(); renderProfileBtn(); loadMe();
  const th = store.get('fl.theme', null); if (th) document.documentElement.dataset.theme = th;

<script type="module">
// Predicted lineups: Claude researches recent team news with web search, using the viewer's own API key.
import Anthropic from 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm';
window.claudePredict = async ({ apiKey, prompt }) => {
  const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
  const messages = [{ role: 'user', content: prompt }];
  const sources = [];
  let msg;
  try {
    for (let i = 0; i < 4; i++) {
      msg = await client.beta.messages.create({
        model: 'claude-opus-5-5',
        max_tokens: 16000,
        betas: ['server-side-fallback-2026-07-01'],
        fallbacks: 'default',
        output_config: { effort: 'medium' },
        tools: [{ type: 'web_search_20260209', name: 'web_search', max_uses: 8 }],
        messages,
      });
      for (const b of msg.content) if (b.type === 'web_search_tool_result' && Array.isArray(b.content))
        for (const r of b.content) if (r.url && !sources.some(s => s.url === r.url)) sources.push({ title: r.title, url: r.url, date: r.page_age || '' });
      if (msg.stop_reason !== 'pause_turn') break;
      messages.push({ role: 'assistant', content: msg.content });
    }
  } catch (err) {
    if (err instanceof Anthropic.AuthenticationError) err.friendly = 'Anthropic rejected that API key. Remove it and paste a valid key from console.anthropic.com.';
    else if (err instanceof Anthropic.PermissionDeniedError) err.friendly = "This API key can't use web search. Enable it for your organization in the Anthropic Console.";
    else if (err instanceof Anthropic.RateLimitError) err.friendly = 'Rate limited by the Anthropic API. Wait a minute and try again.';
    else if (err instanceof Anthropic.APIConnectionError) err.friendly = "Couldn't reach the Anthropic API. Check your connection.";
    else if (err instanceof Anthropic.APIError) err.friendly = `Anthropic API error (${err.status ?? 'unknown'}): ${err.message}`;
    throw err;
  }
  if (msg.stop_reason === 'refusal') { const e = new Error('Claude declined this request. Try again later.'); throw e }
  if (msg.stop_reason === 'max_tokens') throw new Error('The answer was cut off. Try again.');
  const text = msg.content.filter(b => b.type === 'text').map(b => b.text).join('');
  return { text, sources };
};
