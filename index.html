// person names: same surname and initial counts as a match ("B. Saka" = "Bukayo Saka")
function pSim(a, b){
  a = normName(a); b = normName(b); if (!a || !b) return 0; if (a === b) return 1;
  const A = a.split(/\s+/), B = b.split(/\s+/);
  if (A[A.length-1] === B[B.length-1]) return A[0][0] === B[0][0] ? .9 : .7;
  if (a.includes(b) || b.includes(a)) return .75;
  const sa = new Set(A); return B.filter(x => sa.has(x)).length / new Set([...A, ...B]).size;
}
function matchStatsFor(e){
  const url = e.src === 'fm' ? `/api/fm/matchstats?id=${e.fmId}`

  return cjT(url, e.state === 'in' ? 60e3 : 30 * 60e3).then(d => { S.serverOK = true; return d });
}

}
function findMatchPlayer(d, ref){
  const ps = d?.players || [];
  if (ref.fmId) return ps.find(p => String(p.id) === String(ref.fmId)) || null;
  let best = null, sc = 0;
  for (const p of ps) {
    let s = pSim(p.name, ref.name);
    if (ref.number && String(p.number) === String(ref.number) && (!ref.side || p.side === ref.side)) s += .5;

}

      <div class="pitch-wrap">${pitchSVG(seasonHeat(pts), `Season heatmap from ${pts.length} touches, attacking left to right. Busiest areas: ${where.join('; ')}`)}</div>
      ${HEAT_LEGEND}
      <div class="sub-h"><h5>Zone share</h5><small>Share of touches per zone</small></div>
      <div class="pitch-wrap">${pitchSVG(zoneLayer(sh), `Share of touches in 24 zones. Busiest: ${where.join('; ')}`)}</div>
      <p class="srcnote" style="margin-top:8px">Busiest: ${esc(where.join(' · '))}. Top of the pitch is the player's left as they attack.</p>`;

  }
  return html + `<p class="srcnote">Touch and shot locations from <a href="${esc(f.url)}" target="_blank" rel="noopener">FotMob</a>.</p>`;
}

/* ---------- seasons, transfer centre, predicted lineups ---------- */
const FIRST_SEASON = 2001;
// the season a date belongs to: European leagues run Aug–May and are named by their start year
function seasonOf(date, slug){ const d = new Date(date); return CAL_YEAR.test(slug||'') ? d.getFullYear() : (d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1) }
function seasonName(y, slug){ return CAL_YEAR.test(slug||'') ? String(y) : `${y}/${String(y + 1).slice(2)}` }
function seasonSelect(id, cur, slug, label = 'Season'){
  const now = seasonOf(new Date(), slug); let opts = '';
  for (let y = now; y >= FIRST_SEASON; y--) opts += `<option value="${y}" ${y === cur ? 'selected' : ''}>${seasonName(y, slug)}</option>`;
  return `<label class="season"><span>${label}</span><select id="${id}" aria-label="${label}">${opts}</select></label>`;
}
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

async function openPlayerByName(name){
  try {
    const d = await cj(`https://site.api.espn.com/apis/common/v3/search?query=${encodeURIComponent(name)}&type=player&sport=soccer&limit=3`);
    const hit = (d.items || []).find(x => teamSim(x.displayName, name) >= .85) || d.items?.[0];
    if (hit) return openPlayer(hit.id);
  } catch {}
  try { const f = await cjT(`/api/fm/player?name=${encodeURIComponent(name)}`, 30 * 60e3); if (f.id) return openPlayer('fm' + f.id) } catch {}
  $('announce').textContent = `No ESPN profile found for ${name}.`;
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<span>No ESPN profile found for ${esc(name)}.</span>`;

// Transfermarkt down or unmatched: rebuild the club moves from FotMob's career spells (no fees or values there)
function fmTransfersFallback(v, notFound){
  const why = notFound ? `Transfermarkt has no match for ${esc(pName(v))}, so fees and market values aren't available.`
    : `Transfer history is unavailable right now because Transfermarkt isn't answering. Fees and market values will come back when it does.`;
  const C = fmOK(v)?.career, spells = [...(C?.youth?.teams || []), ...(C?.senior?.teams || [])].filter(t => t.start)
    .sort((a, b) => new Date(a.start) - new Date(b.start));
  const note = `<div class="note">${why}${spells.length ? ' Club moves below are from FotMob\'s career history.' : ''}</div>`;
  if (!spells.length) return note;
  if (spells.length === 1) return note + `<p class="srcnote">FotMob lists one club: ${esc(spells[0].team)} since ${yr(spells[0].start)}.</p>`;
  const moves = spells.slice(1).map((t, i) => ({ from: spells[i], to: t })).reverse();
  return note + `<ol class="timeline">${moves.map(({ from, to }) => `<li><span class="d">${esc(day(String(to.start).slice(0, 10)).toLocaleDateString([], {day:'numeric', month:'short', year:'numeric'}))}</span>
      <div class="mv-line"><span class="cl"><img src="${esc(FM_IMGS)}/logo/teamlogo/${esc(from.teamId)}.png" alt="" onerror="this.style.visibility='hidden'">${esc(from.team || '')}</span><span aria-label="to">→</span><span class="cl"><img src="${esc(FM_IMGS)}/logo/teamlogo/${esc(to.teamId)}.png" alt="" onerror="this.style.visibility='hidden'"><strong>${esc(to.team || '')}</strong></span></div>
      <span class="fee">${esc(to.transfer?.text || to.transfer || '–')}</span></li>`).join('')}</ol>

/* predicted lineups from FotMob */
const FM_LABEL = { predicted: 'Predicted lineup', lastStarting11: 'Last starting XI', standard: 'Confirmed lineup', confirmed: 'Confirmed lineup' };
function fmLineup(home, away, date){ return cjT(`/api/fm/lineup?date=${ymd(date)}&home=${encodeURIComponent(home)}&away=${encodeURIComponent(away)}`, 5 * 60e3).then(d => { S.serverOK = true; return d }) }

  return `<small style="display:block;margin-top:6px;color:var(--muted)">Out: ${u.map(x => `${esc(x.name)}${x.expectedReturn && x.expectedReturn !== 'Unknown' ? ` (${esc(x.expectedReturn)})` : ''}`).join(', ')}</small>`;
}
function matchFMBlock(e){
  if (S.serverOK === false) return '';

      .finally(() => { if (S.sel === e.id && S.stack[S.stack.length-1]?.type === 'match' && ['lineups','pitch'].includes(S.tab)) renderSheet() }) }
  const f = e.fm;

  if (f.error || !f.home) return `<div class="note">No predicted lineup published yet. FotMob usually posts one a day or two before kick-off.</div>`;

const POS_GROUP = p => /goal/i.test(p) ? 'G' : /back|defen/i.test(p) ? 'D' : /midfield/i.test(p) ? 'M' : p ? 'F' : '';

function feedUrl(page){ const m = S.mk; return m.mode === 'day' ? `/api/tm/transfers/feed?kind=day&day=${m.day}&page=${page}` : `/api/tm/transfers/feed?kind=latest&page=${page}` }
function fromRecord(t, season){ return { id: `r${season}-${t.tmId}`, tmId: t.tmId, name: t.name, photo: t.photo, position: t.position, age: t.age, nationality: t.nationality,
  from: {}, to: { name: t.club, id: t.clubId, league: t.league }, date: '', marketValue: '', marketValueValue: null, fee: t.fee, feeValue: t.feeValue } }
function addItems(list, markNew){
  let n = 0;
  for (const t of list) { if (S.mk.ids.has(t.id)) continue; S.mk.ids.add(t.id); S.mk.items.push(t); if (markNew) { S.mk.newIds.add(t.id); n++ } }
  return n;
}
async function loadMarket(){
  const m = S.mk, seq = (m.seq = (m.seq || 0) + 1);
  Object.assign(m, { items: [], ids: new Set(), newIds: new Set(), pages: 0, loaded: 0, loading: true, err: null, show: 150 });
  renderMarket();
  try {
    if (m.mode === 'records') {
      const res = await Promise.allSettled([1, 2, 3, 4].map(p => cjT(`/api/tm/transfers/top?season=${m.season}&page=${p}`, 3600e3)));
      if (seq !== m.seq) return;
      res.forEach(r => r.status === 'fulfilled' && addItems(r.value.transfers.map(t => fromRecord(t, m.season))));
      m.pages = m.loaded = 4;
      if (!m.items.length && res.every(r => r.status === 'rejected')) throw new Error('offline');
    } else {
      const first = await getJSON(feedUrl(1)); if (first.error) throw new Error(first.error);
      if (seq !== m.seq) return;
      S.serverOK = true; m.pages = first.pages; m.loaded = 1; addItems(first.transfers);
      renderMarket();
      // the live feed is short, so load it all; a single day can run to 40+ pages, so start with 8
      await loadMorePages(m.mode === 'latest' ? m.pages : Math.min(m.pages, 8), seq);
    }
    m.at = new Date();
  } catch (err) { if (seq === m.seq) m.err = String(err.message || err) }
  if (seq !== m.seq) return;
  m.loading = false; renderMarket();
}
async function loadMorePages(upto, seq = S.mk.seq){
  const m = S.mk, want = []; for (let p = m.loaded + 1; p <= upto; p++) want.push(p);
  m.loading = true;
  while (want.length) {
    const batch = want.splice(0, 4);
    const res = await Promise.allSettled(batch.map(p => getJSON(feedUrl(p))));
    if (seq !== m.seq) return;
    res.forEach(r => r.status === 'fulfilled' && !r.value.error && addItems(r.value.transfers));
    m.loaded = batch[batch.length - 1]; renderMarket();
  }
  m.loading = false; m.at = new Date(); renderMarket();
}
// check for new transfers every two minutes while the page is open
async function refreshMarket(){
  const m = S.mk;
  if (S.page !== 'transfers' || document.hidden || m.loading || m.mode === 'records') return;
  if (m.mode === 'day' && m.day !== isoDay(new Date())) return;
  try {
    const res = await Promise.allSettled([1, 2].map(p => getJSON(feedUrl(p) + `&t=${Date.now()}`)));
    let n = 0; res.forEach(r => r.status === 'fulfilled' && !r.value.error && (n += addItems(r.value.transfers, true)));
    m.at = new Date();
    if (n) {
      const msg = `${n} new transfer${n > 1 ? 's' : ''}`;
      $('announce').textContent = msg;
      const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<b>New</b><span>${msg}</span>`; t.onclick = () => { S.mk.sort = 'date'; renderMarket() };
      $('toasts').appendChild(t); setTimeout(() => t.remove(), 7000);
    }
    renderMarket();
  } catch {}
}
setInterval(refreshMarket, 120000);

function marketSummary(list){

  const lg = new Map(); for (const t of list) if (t.feeValue && t.to?.league) lg.set(t.to.league, (lg.get(t.to.league) || 0) + t.feeValue);
  const leagues = [...lg].sort((a, b) => b[1] - a[1]).slice(0, 6), top = leagues[0]?.[1] || 1;

}

async function loadLeagueSched(slug, mode){
  const key = `${slug}|${mode}`, now = new Date();
  S.lgSched[key] = { loading: true };
  try {
    let evs = [];
    if (FM_SOURCE[slug]) {
      if (!S.fmLeague?.[slug]) await loadFMDay(slug);
      evs = (S.fmLeague[slug].fixtures || []).filter(f => f.utc && !f.tbd).map(f => normFM(f, slug));
    } else {
      // ESPN takes one whole month per request (date ranges are refused)
      const months = mode === 'upcoming' ? [0, 1, 2] : [0, -1, -2];
      const res = await Promise.allSettled(months.map(n => cj(`${BASE}/${slug}/scoreboard?dates=${ym(addMonths(now, n))}`)));
      for (const r of res) if (r.status === 'fulfilled') for (const ev of r.value.events || []) { const m = norm(ev, slug); if (m) evs.push(m) }
    }
    const seen = new Set(); evs = evs.filter(e => !seen.has(e.id) && seen.add(e.id));
    evs = mode === 'upcoming'
      ? evs.filter(e => e.state !== 'post' && e.date > now - 4 * 36e5).sort((a, b) => a.date - b.date).slice(0, 40)
      : evs.filter(e => e.state === 'post').sort((a, b) => b.date - a.date).slice(0, 40);
    evs.forEach(e => { if (!S.events.has(e.id)) S.extra.set(e.id, e) });
    S.lgSched[key] = { events: evs, at: Date.now() };
  } catch { S.lgSched[key] = { error: true } }
  if (S.scope === slug) render();
  if (mode === 'upcoming') loadListOdds().catch(() => {});
}

async function runResearch(e){
  const st = $('resStatus'), btn = $('resBtn'); if (btn) btn.disabled = true;
  if (!window.claudePredict) { st.innerHTML = `<div class="err">The Claude client didn't load. Reload the page and try again.</div>`; return }
  st.innerHTML = `<p class="note" style="text-align:left;padding:10px 0 0">Reading the news… usually 30–90 seconds.</p>`;
  const P = predict(e);
  const prompt = `Today is ${new Date().toISOString().slice(0, 10)}. Write a preview of ${e.home.full} vs ${e.away.full} (${e.league.name}), kick-off ${e.date.toUTCString()}, ${e.home.full} at home.
Search for recent credible coverage (club sites, BBC Sport, ESPN, The Athletic, Sky Sports, Reuters, AP, reputable national outlets): team news, injuries and suspensions, likely lineups, manager comments, form, head-to-head and tactical match-ups.
For context, a statistical model gives ${e.home.name} ${pct(P.model.home)}%, draw ${pct(P.model.draw)}%, ${e.away.name} ${pct(P.model.away)}%${P.market ? `, and Kalshi prices them at ${pct(P.market.home)}% / ${pct(P.market.draw)}% / ${pct(P.market.away)}%` : ''}.

Reply with one JSON object only: {"summary":"3-5 sentences","prediction":{"outcome":"e.g. Arsenal win","score":"2-1","confidence":"low|medium|high"},"factors":["..."],"risks":["..."],"sources":[{"title":"","url":""}]}`;
  try {

    const m = text.match(/```(?:json)?\s*([\s\S]*?)```/), raw = m ? m[1] : text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1);
    const r = JSON.parse(raw);
    const seen = new Set((r.sources || []).map(s => s.url));
    r.sources = [...(r.sources || []), ...sources.filter(s => !seen.has(s.url))].slice(0, 8);
    r.at = Date.now(); store.set(`fl.res.${e.id}`, r); renderSheet();

}

setInterval(() => { const e = S.events.get(S.sel); if (document.hidden || !e || S.tab !== 'odds' || S.stack[S.stack.length-1]?.type !== 'match') return;
  loadMatchOdds(e).then(() => { if (S.tab === 'odds' && S.sel === e.id) renderSheet() }).catch(() => {}) }, 20000);

// tell the viewer when a newer version of the app is on the server, instead of silently running the old one
let appVersion = null;
async function checkVersion(){
  try {
    const { v } = await fetch('/api/version', { cache: 'no-store' }).then(r => r.json());
    if (appVersion == null) { appVersion = v; return }
    if (v !== appVersion && !$('updToast')) {
      const t = document.createElement('div'); t.className = 'toast'; t.id = 'updToast';
      t.innerHTML = `<span>Floodlight was updated.</span><button class="btn" style="padding:6px 12px;font-size:12px" data-act="reload">Reload</button>`;
      $('toasts').appendChild(t);
    }
  } catch {}
}
setInterval(() => { if (!document.hidden) checkVersion() }, 30000);
(function init(){
  checkVersion();
  applyPrefs(); renderProfileBtn(); loadMe();
  S.filter = store.get('fl.filter', 'all'); S.scope = store.get('fl.scope', null);
  if (!QUICK.includes(S.filter)) { if (LG[S.filter] && S.filter !== 'all') S.scope = S.filter; S.filter = 'all' }   // older saved state kept the league in the filter
  if (S.scope && !LG[S.scope]) S.scope = null;
  S.sort = store.get('fl.sort', 'league');
  S.dateOpen = false;
  render(); loadDay();
  if (scopeLeague() && store.get('fl.sport', 'soccer') === 'soccer' && matchMedia('(min-width:821px)').matches) openLeague(scopeLeague());
})();

<script type="module">
// Predicted lineups: Claude researches recent team news with web search, using the viewer's own API key.
// The SDK is only downloaded the first time someone asks for a predicted lineup.
window.claudePredict = async ({ apiKey, prompt }) => {
  const { default: Anthropic } = await import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm');
  const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
  const messages = [{ role: 'user', content: prompt }];
  const sources = [];
  let msg;
  try {
    for (let i = 0; i < 4; i++) {
      msg = await client.beta.messages.create({
        model: 'claude-opus-5-5',
        max_tokens: 16000,
        betas: ['server-side-fallback-2026-07-01'],
        fallbacks: 'default',
        output_config: { effort: 'medium' },
        tools: [{ type: 'web_search_20260209', name: 'web_search', max_uses: 8 }],
        messages,
      });
      for (const b of msg.content) if (b.type === 'web_search_tool_result' && Array.isArray(b.content))
        for (const r of b.content) if (r.url && !sources.some(s => s.url === r.url)) sources.push({ title: r.title, url: r.url, date: r.page_age || '' });
      if (msg.stop_reason !== 'pause_turn') break;
      messages.push({ role: 'assistant', content: msg.content });
    }
  } catch (err) {
    if (err instanceof Anthropic.AuthenticationError) err.friendly = 'Anthropic rejected that API key. Remove it and paste a valid key from console.anthropic.com.';
    else if (err instanceof Anthropic.PermissionDeniedError) err.friendly = "This API key can't use web search. Enable it for your organization in the Anthropic Console.";
    else if (err instanceof Anthropic.RateLimitError) err.friendly = 'Rate limited by the Anthropic API. Wait a minute and try again.';
    else if (err instanceof Anthropic.APIConnectionError) err.friendly = "Couldn't reach the Anthropic API. Check your connection.";
    else if (err instanceof Anthropic.APIError) err.friendly = `Anthropic API error (${err.status ?? 'unknown'}): ${err.message}`;
    throw err;
  }
  if (msg.stop_reason === 'refusal') { const e = new Error('Claude declined this request. Try again later.'); throw e }
  if (msg.stop_reason === 'max_tokens') throw new Error('The answer was cut off. Try again.');
  const text = msg.content.filter(b => b.type === 'text').map(b => b.text).join('');
  return { text, sources };
};
