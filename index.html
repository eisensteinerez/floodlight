<style>
/* Layout: three-pane match centre. Competitions rail | fixtures list | match sheet (pitch, stats, flow). Collapses to chips + sheet on phones. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --line:#DCE1EA; --fg:#0E1420; --muted:#5C677D;
  --accent:#A87400; --accent-ink:#FFFFFF; --live:#E5383B; --win:#1F9D55; --draw:#8A93A6; --loss:#D64545;
  --pitch:#2F7A4C; --pitch-2:#2B7146; --chalk:rgba(255,255,255,.85);
  --shadow:0 1px 2px rgba(14,20,32,.06),0 6px 24px rgba(14,20,32,.06);
  --f-display:"Sofia Sans Extra Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Sofia Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Sofia Sans",system-ui,-apple-system,"Segoe UI",sans-serif;   /* numbers use tabular figures, set on body */
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-scheme="light"]){
  --bg:#0B111C; --surface:#121A28; --surface-2:#182234; --line:#243049; --fg:#E8ECF3; --muted:#8C98B0;
  --accent:#F4C542; --accent-ink:#1A1405; --live:#FF5A5F; --win:#3FCB7E; --draw:#8C98B0; --loss:#FF6B6B;
  --pitch:#164A2E; --pitch-2:#14432A; --chalk:rgba(255,255,255,.7);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-scheme="dark"]{
  --bg:#0B111C; --surface:#121A28; --surface-2:#182234; --line:#243049; --fg:#E8ECF3; --muted:#8C98B0;
  --accent:#F4C542; --accent-ink:#1A1405; --live:#FF5A5F; --win:#3FCB7E; --draw:#8C98B0; --loss:#FF6B6B;
  --pitch:#164A2E; --pitch-2:#14432A; --chalk:rgba(255,255,255,.7);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
/* home-screen app: keep content clear of the phone's status bar and give that strip the page colour */
body{padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:39}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-ctl)}
img{max-width:100%}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:none;border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font:900 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand svg{width:28px;height:28px}
.brand small{font:600 12px/1 var(--f-mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-left:2px}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;height:36px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px 0 34px;font:inherit}
.search svg{position:absolute;left:12px;top:10px;width:16px;height:16px;color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.sync{font:500 12px/1 var(--f-mono);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--win);display:inline-block}
.sync.busy i{background:var(--accent-fill);animation:pulse 1s infinite}

/* ---------- live ticker ---------- */
.ticker{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
.ticker::-webkit-scrollbar{display:none}
.ticker .lab{flex:none;font:600 12px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--live);display:flex;align-items:center;gap:6px}
.ticker .lab.next{color:var(--muted)}
.ticker .lab::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
.ticker .lab.next::before{animation:none}
.tk{flex:none;display:flex;align-items:center;gap:7px;min-height:36px;padding:4px 12px 4px 4px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.tk:hover{border-color:var(--fg)}
.tk .mn{font:600 12px/1 var(--f-mono);color:#fff;background:var(--live-fill,var(--live));padding:6px 7px;border-radius:var(--r-pill);min-width:34px;text-align:center}
.tk .mn.pre{background:var(--surface-2);color:var(--muted)}
.tk img{width:18px;height:18px;object-fit:contain}
.tk .s{font:800 17px/1 var(--f-display);margin:0 2px}
.tk.sel{border-color:var(--fg);background:var(--surface-2)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.group.live-group .group-h strong{color:var(--live)}
.skip{position:absolute;left:-999px;top:8px;z-index:99;background:var(--accent-fill);color:var(--accent-ink);padding:8px 12px;border-radius:var(--r-ctl);font-weight:600}
.skip:focus{left:16px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr) minmax(0,1.25fr);gap:20px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1640px;margin:0 auto;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 126px);max-height:calc(100vh - 146px);overflow:auto;padding-right:4px;scrollbar-width:thin}
.rail h4{font:600 12px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 10px 8px}
.rail h4:first-child{margin-top:0}
.lg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:var(--r-ctl);font-weight:500;color:var(--fg)}
.lg:hover{background:var(--surface)}
.lg.on{background:var(--fg);color:var(--bg)}
.lg img{width:18px;height:18px;object-fit:contain;flex:none}
.lg .dot{width:18px;height:18px;flex:none;display:grid;place-items:center}
.lg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{font:600 12px/1 var(--f-mono);padding:3px 6px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--muted)}
.lg b.live{background:var(--live-fill,var(--live));color:#fff}
.lg.on b{background:color-mix(in oklab,var(--bg) 20%,transparent);color:var(--bg)}
.lg.empty{opacity:.45}

.chips{display:none}

/* ---------- fixtures ---------- */
.dates{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:none;display:inline-flex;align-items:baseline;gap:5px;height:34px;padding:0 11px;border-radius:var(--r-pill);border:1px solid transparent;background:transparent;line-height:34px;white-space:nowrap}
.date:hover{background:var(--surface-2)}
.date small{font:600 12px/1 var(--f-body);color:var(--muted)}
.date strong{font:800 16px/1 var(--f-display)}
.date.today{border-color:var(--line)}
.date.on{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.date.on small{color:inherit;opacity:.8}

.livebar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.livebar h2{font:900 34px/1 var(--f-display);text-transform:uppercase;margin:0;letter-spacing:.01em}
.livebar .count{font:600 12px/1 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--r-pill);font:600 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.pill.live{background:color-mix(in oklab,var(--live) 14%,transparent);color:var(--live)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}

.group{margin-bottom:18px}
.group-h{display:flex;align-items:center;gap:8px;padding:0 4px 8px;font:600 12px/1.2 var(--f-body);color:var(--muted)}
.group-h img{width:18px;height:18px;object-fit:contain}
.group-h strong{color:var(--fg);font-weight:600}
.cards{display:flex;flex-direction:column;gap:6px}

.m{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px 10px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);text-align:left;width:100%;overflow:hidden;transition:transform .15s,border-color .15s}
.m:hover{border-color:color-mix(in oklab,var(--fg) 25%,var(--line))}
.m.sel{border-color:var(--fg);box-shadow:var(--shadow)}
.m::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--hc) 0 50%,var(--ac) 50% 100%)}
.m .st{font:600 12px/1.15 var(--f-mono);color:var(--muted);text-align:center}
.m .st.live{color:var(--live)}
.m .st.live .min{font-size:15px;display:block}
.m .st .ko{font-size:14px;color:var(--fg)}
.m .tms{display:grid;gap:5px;min-width:0}
.tm{display:flex;align-items:center;gap:9px;min-width:0}
.tm img{width:22px;height:22px;object-fit:contain;flex:none}
.tm span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm.lose span{color:var(--muted);font-weight:500}
.sc{display:grid;gap:5px;text-align:right;font:800 22px/22px var(--f-display);min-width:20px}
.sc .lose{color:var(--muted)}
.m.goal-flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,30%{background:color-mix(in oklab,var(--accent) 30%,var(--surface))}100%{background:var(--surface)}}
@keyframes pulse{50%{opacity:.35}}

.empty-state{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-card)}
.empty-state strong{display:block;font:800 22px/1.1 var(--f-display);text-transform:uppercase;color:var(--fg);margin-bottom:6px}
.skel{height:64px;border-radius:var(--r-card);background:var(--surface);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- match sheet ---------- */
.sheet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 126px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow);max-height:calc(100vh - 146px);display:flex;flex-direction:column}
.sheet-body{overflow:auto;scrollbar-width:thin}
.hero{position:relative;padding:18px 20px 16px;background:
  linear-gradient(105deg,color-mix(in oklab,var(--hc) 26%,var(--surface)) 0 49.6%,color-mix(in oklab,var(--ac) 26%,var(--surface)) 50.4% 100%)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font:600 12px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero-top .lgname{display:flex;align-items:center;gap:6px;min-width:0}
.hero-top .lgname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close{display:grid}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;margin-top:14px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.side img{width:68px;height:68px;object-fit:contain;filter:none}
.side strong{font:800 20px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.form{display:flex;gap:3px}
.form i{width:16px;height:16px;border-radius:4px;font:700 12px/16px var(--f-mono);font-style:normal;color:#fff;text-align:center}
.form .W{background:var(--win)}.form .D{background:var(--draw)}.form .L{background:var(--loss)}
.score{text-align:center}
.score .big{font:900 64px/0.9 var(--f-display);letter-spacing:.02em;white-space:nowrap}
.score .big em{font-style:normal;color:var(--muted);margin:0 6px;font-weight:600}
.score .status{margin-top:8px;display:inline-flex}
.score .kick{font:800 34px/1 var(--f-display)}
.score .sub{font:500 12px/1.3 var(--f-mono);color:var(--muted);margin-top:6px}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;font-size:12px;color:var(--muted)}
.scorers div:last-child{text-align:right}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:12px;font:500 12px/1.3 var(--f-mono);color:var(--muted)}

.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:var(--surface);position:sticky;top:0;z-index:2}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 12px 10px;font:600 13px/1 var(--f-body);color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-color:var(--accent)}
.pane{padding:18px 20px 24px}
.pane h5{font:600 12px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-pill);padding:2px;margin-bottom:12px}
.seg button{padding:5px 12px;border-radius:var(--r-pill);font:600 12px/1 var(--f-body);color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}

/* pitch */
.pitch-wrap{position:relative;border-radius:var(--r-card);overflow:hidden;background:var(--pitch)}
.pitch-wrap svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:var(--r-ctl);font-size:12px;max-width:240px;line-height:1.3;transform:translate(-50%,calc(-100% - 10px));z-index:3}
.bench{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.bench ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:12.5px}
.bench li{display:flex;gap:8px;align-items:baseline}
.bench li b{font:600 12px/1 var(--f-mono);color:var(--muted);width:20px;text-align:right;flex:none}
.bench li.in{color:var(--win)}
.bench .head{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.bench .head i{width:10px;height:10px;border-radius:3px}
.bench .head small{font:500 12px/1 var(--f-mono);color:var(--muted);margin-left:auto}

/* stats */
.poss{margin-bottom:22px}
.poss-n{display:flex;justify-content:space-between;font:900 40px/1 var(--f-display)}
.poss-n small{font:600 12px/1 var(--f-mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;align-self:center}
.poss-bar{display:flex;height:14px;border-radius:var(--r-pill);overflow:hidden;margin-top:8px;gap:3px}
.poss-bar div{transition:flex-grow .6s}
.stat{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px;margin-bottom:12px}
.stat .v{font:600 14px/1 var(--f-mono)}
.stat .v:last-child{text-align:right}
.stat .v.lead{color:var(--fg)}
.stat .v:not(.lead){color:var(--muted)}
.stat .lbl{font-size:12px;text-align:center;color:var(--muted);margin-bottom:5px}
.stat .bars{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stat .bars span{height:6px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;display:flex}
.stat .bars span:first-child{justify-content:flex-end}
.stat .bars i{display:block;height:100%;border-radius:var(--r-pill);transition:width .6s}

/* flow */
.flow svg{width:100%;height:auto;display:block;overflow:visible}
.events{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:2px}
.ev{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.ev .min{font:600 12px/1 var(--f-mono);text-align:center;color:var(--muted)}
.ev .h{text-align:right}
.ev .who{font-weight:600}
.ev small{display:block;color:var(--muted);font-size:12px}
.ev .ic{display:inline-block;vertical-align:-2px}
.ev.period{grid-template-columns:1fr;text-align:center;font:600 12px/1 var(--f-mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;padding:10px 0}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
th:nth-child(2){text-align:left}
td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.t{text-align:left;display:flex;align-items:center;gap:8px;white-space:nowrap}
td.t img{width:18px;height:18px;object-fit:contain}
td.r{position:relative;color:var(--muted);font-family:var(--f-mono);font-size:12px;padding-left:10px}
td.r i{position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px}
tr.hl td{background:color-mix(in oklab,var(--accent) 14%,transparent);font-weight:600}
td.pts{font-weight:700}
.notes{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.notes i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.grp-name{font:800 16px/1 var(--f-display);text-transform:uppercase;margin:18px 0 6px}
.grp-name{display:flex;align-items:center;gap:8px}.conf-logo{width:24px;height:24px;object-fit:contain;flex:none}.conf-logo.sm{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
.lg img[src*="NCAA_D"]{width:30px!important;height:18px!important;object-fit:contain;background:#fff;border-radius:4px;padding:1px 2px}

/* feed */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.feed li:first-child{border-top:0}
.feed .min{font:600 12px/1.4 var(--f-mono);color:var(--muted)}
.feed li.key{font-weight:600}
.feed li.key .min{color:var(--accent)}

.sheet-empty{padding:60px 30px;text-align:center;color:var(--muted)}
.sheet-empty svg{width:120px;margin:0 auto 14px;display:block;opacity:.8}
.sheet-empty strong{display:block;font:900 28px/1 var(--f-display);text-transform:uppercase;color:var(--fg);margin-bottom:8px}
.note{font-size:13px;color:var(--muted);padding:24px 0;text-align:center}

/* toast */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:8px;z-index:50}
.toast{position:relative;background:var(--fg);color:var(--bg);border-radius:var(--r-card);padding:10px 40px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);animation:tin .4s cubic-bezier(.2,1.4,.4,1);cursor:pointer;max-width:min(360px,calc(100vw - 32px))}
.toast-x{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--bg);opacity:.7;font-size:13px;line-height:1}
.toast-x:hover,.toast-x:focus-visible{opacity:1;background:color-mix(in oklab,var(--bg) 18%,transparent)}
.toast b{font:900 26px/1 var(--f-display);color:var(--accent);letter-spacing:.04em}
.toast span{font:600 13px/1.25 var(--f-body)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}


/* ---------- search results ---------- */
.sresults{position:absolute;top:42px;left:0;right:0;min-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:6px;z-index:30;max-height:70vh;overflow:auto}
.sr-h{font:600 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 10px 6px}
.sr{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-ctl);text-align:left}
.sr:hover,.sr:focus-visible{background:var(--surface-2)}
.sr img{width:26px;height:26px;object-fit:contain;flex:none}
.sr img.face{width:34px;height:42px;border-radius:var(--r-ctl);object-fit:cover;object-position:50% 10%;background:var(--surface-2)}
.sr div{min-width:0}.sr strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-none{padding:14px 10px;color:var(--muted);font-size:13px}

/* ---------- team & player pages ---------- */
.back{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--f-body);color:var(--fg);padding:6px 11px 6px 7px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface)}
.back svg{width:14px;height:14px}
.hero.solo{background:color-mix(in oklab,var(--tc) 30%,var(--surface))}
.thead{display:flex;gap:16px;align-items:center;margin-top:14px}
.thead .crest{width:76px;height:76px;object-fit:contain;flex:none;filter:none}
.thead .face{width:92px;height:116px;border-radius:var(--r-card);object-fit:cover;object-position:50% 8%;background:var(--surface-2);border:3px solid var(--tc);flex:none;box-shadow:none}
.thead h3{font:900 34px/0.95 var(--f-display);text-transform:uppercase;margin:0;text-wrap:balance}
.thead p{margin:6px 0 0;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.thead p img{width:18px;height:18px;object-fit:contain;vertical-align:-4px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.tile{background:color-mix(in oklab,var(--surface) 75%,transparent);border:1px solid var(--line);border-radius:var(--r-ctl);padding:10px 12px}
.tile b{display:block;font:800 26px/1 var(--f-display)}
.tile span{font:600 12px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.linkbtn{color:inherit;font:inherit;text-decoration:underline;text-decoration-color:color-mix(in oklab,var(--fg) 30%,transparent);text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:currentColor}
.prow{display:grid;grid-template-columns:28px 22px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line);width:100%;text-align:left;font-size:13px}
.prow:hover{background:var(--surface-2)}
.prow b{font:600 12px/1 var(--f-mono);color:var(--muted);text-align:right}
.prow img{width:22px;height:15px;object-fit:cover;border-radius:2px}
.prow .nm{min-width:0}.prow .nm span{font-weight:600}.prow .nm small{display:block;color:var(--muted);font-size:12px}
.prow .st2{font:500 12px/1 var(--f-mono);color:var(--muted);white-space:nowrap;text-align:right}
.fx{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.fx .d{font:600 12px/1.3 var(--f-mono);color:var(--muted)}
.fx .vs{display:flex;align-items:center;gap:8px;min-width:0}
.fx .vs img{width:18px;height:18px;object-fit:contain;flex:none}
.fx .vs span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .vs small{color:var(--muted);white-space:nowrap}
.fx .r{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--f-mono)}
.res{font:700 12px/1 var(--f-mono);padding:4px 6px;border-radius:var(--r-ctl);color:#fff;display:inline-block;min-width:20px;text-align:center}
.res.W{background:var(--win)}.res.D{background:var(--draw)}.res.L{background:var(--loss)}
.news a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:11px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none;align-items:center}
.news a:hover strong{text-decoration:underline}
.news strong{font-weight:600;display:block}
.news small{color:var(--muted);font-size:12px}
.news img{width:88px;height:50px;object-fit:cover;border-radius:var(--r-ctl)}
.bio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;margin-bottom:20px}
.bio div{background:var(--surface);padding:10px 12px;min-width:0}
.bio span{display:block;font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.bio strong{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bio strong img{width:20px;height:14px;object-fit:cover;border-radius:2px}
.bio a{color:var(--fg)}
.clubs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.club{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:var(--r-pill);font-size:12.5px;font-weight:600;background:var(--surface)}
.club img{width:24px;height:24px;object-fit:contain}
.club small{font:500 12px/1 var(--f-mono);color:var(--muted)}
.club.now{border-color:var(--fg)}
.ai{border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin-top:20px;background:var(--surface-2)}
.ai h4{margin:0 0 6px;font:800 21px/1.1 var(--f-display);text-transform:uppercase}
.ai p{margin:0 0 12px;color:var(--muted);font-size:13px;max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:var(--r-pill);background:var(--fg);color:var(--bg);font-weight:600;font-size:13px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:wait}
.keyrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.keyrow input{flex:1;min-width:200px;height:38px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.conf{font:600 12px/1 var(--f-mono);padding:3px 6px;border-radius:var(--r-pill);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.conf.high{background:color-mix(in oklab,var(--win) 18%,transparent);color:var(--win)}
.conf.medium{background:color-mix(in oklab,var(--accent) 22%,transparent);color:var(--accent)}
.conf.low{background:color-mix(in oklab,var(--loss) 16%,transparent);color:var(--loss)}
.xi-list{list-style:none;margin:12px 0 0;padding:0}
.xi-list li{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.xi-list b{font:600 12px/1 var(--f-mono);color:var(--muted);text-align:right}
.xi-list .pos{font:600 12px/1 var(--f-mono);color:var(--muted)}
.xi-list small{display:block;color:var(--muted);font-size:12px}
.srcs{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:7px;font-size:12.5px}
.srcs a{color:var(--fg)}
.srcs small{color:var(--muted)}
.callout{font-size:12.5px;color:var(--muted);border-left:3px solid var(--accent);padding:6px 0 6px 12px;margin:12px 0}
.ctable td,.ctable th{white-space:nowrap}
.ctable td.t{white-space:nowrap}
.ctable tr.season td{border-top:2px solid var(--line)}
.sub-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sub-h h5{margin:0}
.sub-h small{color:var(--muted);font-size:12px}
.err{color:var(--loss);font-size:13px;margin-top:10px}
@media (max-width:520px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .thead h3{font-size:28px} .bio{grid-template-columns:1fr 1fr} }


/* ---------- odds, values, injuries, settings ---------- */
.mv{font:700 12px/1 var(--f-mono);white-space:nowrap}
.mv.up{color:var(--win)}.mv.down{color:var(--loss)}.mv.flat{color:var(--muted)}
.mls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ml{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-card);padding:12px 12px 14px;background:var(--surface)}
.ml .lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml b{display:block;font:900 34px/1 var(--f-display);margin:6px 0 4px}
.ml .am{font:600 12px/1 var(--f-mono);color:var(--muted)}
.ml i{position:absolute;left:0;bottom:0;height:4px;background:var(--c)}
.lines{display:grid;gap:2px}
.ln{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) auto;gap:12px;align-items:center;padding:8px 6px;border-top:1px solid var(--line);font-size:13px;border-radius:var(--r-ctl)}
.ln small{color:var(--muted);font-size:12px}
.ln.main{background:color-mix(in oklab,var(--accent) 12%,transparent)}
.ln .bar{height:6px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
.ln .bar i{display:block;height:100%;border-radius:var(--r-pill)}
.ln .pv{font:600 13px/1 var(--f-mono);white-space:nowrap;text-align:right}
.tick-up{animation:tup 1.6s ease-out}.tick-down{animation:tdn 1.6s ease-out}
@keyframes tup{0%,40%{background:color-mix(in oklab,var(--win) 22%,var(--surface))}}
@keyframes tdn{0%,40%{background:color-mix(in oklab,var(--loss) 22%,var(--surface))}}
.srcnote{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5}
.srcnote a{color:var(--fg)}
.oddrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;font:600 12px/1 var(--f-mono);color:var(--muted)}
.oddrow span{padding:3px 6px;border-radius:var(--r-ctl);background:var(--surface-2)}
.oddrow span.fav{background:color-mix(in oklab,var(--accent) 18%,transparent);color:var(--fg)}
.stat-badge{display:inline-block;font:600 12px/1 var(--f-mono);padding:3px 6px;border-radius:var(--r-pill);letter-spacing:.03em;white-space:nowrap;vertical-align:1px}
.stat-badge.injured{background:color-mix(in oklab,var(--loss) 16%,transparent);color:var(--loss)}
.stat-badge.suspended{background:color-mix(in oklab,var(--accent) 22%,transparent);color:var(--accent)}
.stat-badge.absent{background:var(--surface-2);color:var(--muted)}
img.mini{width:28px;height:35px;border-radius:var(--r-ctl);object-fit:cover;object-position:50% 10%;background:var(--surface-2);flex:none}
.news-out li{align-items:center}
.news-out li small{display:block;color:var(--muted);font-size:12px}
.prow.ph{grid-template-columns:28px 36px minmax(0,1fr) auto}
.xi-list li.ph{grid-template-columns:28px 30px minmax(0,1fr) auto;align-items:center}
.face-s{width:34px;height:42px;border-radius:var(--r-ctl);object-fit:cover;object-position:50% 10%;background:var(--surface-2);display:block}
img.espn-shot{object-fit:contain;object-position:50% 100%}
.prow .val{font:700 12.5px/1.2 var(--f-mono);color:var(--fg);text-align:right;white-space:nowrap}
.prow .val small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.prow.out .nm span{color:var(--muted)}
.favbtn{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);padding:7px 12px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);margin-top:10px}
.favbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.quick{display:flex;gap:6px;margin:-4px 0 16px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qf{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.qf[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qf .dot{width:7px;height:7px;border-radius:50%;background:var(--live-fill,var(--live))}
.prefs{position:absolute;right:0;top:44px;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:14px;z-index:40}
.prefs h5{font:600 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.prefs .seg{display:flex;margin-bottom:12px}.prefs .seg button{flex:1}
.chk{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;font-weight:500;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.prefwrap{position:relative}
.bottomnav{display:none}
.chips.mk-hide{display:none!important}
code{font-family:var(--f-mono);font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
:root[data-contrast="high"]{--muted:color-mix(in oklab,var(--fg) 82%,var(--bg));--line:color-mix(in oklab,var(--fg) 45%,var(--bg));--surface-2:color-mix(in oklab,var(--fg) 10%,var(--bg))}
:root[data-contrast="high"] :focus-visible{outline-width:3px!important;outline-offset:3px!important}
:root[data-contrast="high"] .m,:root[data-contrast="high"] .tk,:root[data-contrast="high"] .qf{border-width:2px}
:root[data-motion="reduce"] *{animation:none!important;transition:none!important}
@media (max-width:820px){
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in oklab,var(--surface) 94%,transparent);backdrop-filter:none;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font:600 12px/1 var(--f-body);color:var(--muted);min-height:54px}
  .bottomnav button[aria-current="true"]{color:var(--fg)}
  .bottomnav svg{width:22px;height:22px}
  .bottomnav b{position:absolute;margin-left:22px;margin-top:-2px;font:700 12px/1 var(--f-mono);background:var(--live-fill,var(--live));color:#fff;padding:2px 4px;border-radius:var(--r-pill)}
  .shell{padding-bottom:84px}
  .mls{gap:6px}.ml b{font-size:28px}
  .prefs{position:fixed;left:16px;right:16px;width:auto;top:calc(env(safe-area-inset-top,0px) + 60px)}
}


/* ---------- dates, seasons, transfers ---------- */
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.dnav{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:700 17px/1 var(--f-body);display:grid;place-items:center}
.dtoggle{flex:1;min-width:0;display:flex;align-items:center;gap:9px;height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px}
.dtoggle > svg{width:16px;height:16px;flex:none;color:var(--muted)}
.dtoggle span{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtoggle .chev{transition:transform .2s}
.dtoggle[aria-expanded="true"]{border-color:var(--fg)}
.dtoggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.datepanel{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:4px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface)}
.datepanel .dates{flex:1;min-width:0}
.cal-pick{flex:none;position:relative;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--r-pill);background:var(--surface-2);font:600 12px/1 var(--f-body);cursor:pointer;white-space:nowrap}
.cal-pick svg{width:15px;height:15px;pointer-events:none}
.cal-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.cal-pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){ .cal-pick b{display:none} }
.season{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.season select{font:600 13px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:7px 12px;min-height:34px}
.tc-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tc-bar .season{min-width:0;max-width:100%}.tc-bar .season select{min-width:0;max-width:100%;text-overflow:ellipsis}
.trow{display:grid;grid-template-columns:36px minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 6px;border-top:1px solid var(--line);font-size:13px}
.trow:hover{background:var(--surface-2)}
.trow .nm{min-width:0}.trow .nm span{font-weight:600}.trow .nm small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.club-c{display:flex;align-items:center;gap:7px;min-width:0;font-size:12.5px}
.club-c img{width:20px;height:20px;object-fit:contain;flex:none}
.club-c span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.club-c small{display:block;color:var(--muted);font-size:12px}
.fee{font:700 12.5px/1 var(--f-mono);white-space:nowrap;text-align:right}

.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}

.pc-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}.pc-side b{font:800 15px/1.1 var(--f-display);text-transform:uppercase}.pc-side small{color:var(--muted);font-size:12px}

.fc-ai{font:600 12px/1 var(--f-mono);padding:3px 6px;border-radius:var(--r-pill);background:color-mix(in oklab,var(--accent) 16%,transparent);color:var(--accent)}

.fc-foot{margin:6px 0 14px;display:grid;gap:8px;justify-items:start}.fc-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px;font-size:12.5px}

.bk-t{width:100%;border-collapse:collapse;font-size:13px}.bk-t th{font:600 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 6px;text-align:center;white-space:nowrap}
.bk-t td{padding:7px 6px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}.bk-t td.t{text-align:left;white-space:normal;display:flex;justify-content:space-between;gap:8px}
.bk-t td.t small{color:var(--muted);font:600 12px/1.3 var(--f-mono)}.bk-t tr.sec td{font:700 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding-top:14px;border-top:0}
.bk-p{font:600 12.5px/1 var(--f-mono);padding:4px 6px;border-radius:var(--r-ctl);display:inline-block;min-width:44px}.bk-p.best{background:color-mix(in oklab,var(--win) 20%,transparent);color:var(--win)}.bk-p.none{color:var(--muted)}
.bk-ou{display:inline-flex;flex-direction:column;gap:3px;align-items:flex-end;font-size:12px;color:var(--muted)}.bk-ou>span{display:flex;gap:4px;align-items:center}.bk-alt{font:600 12px/1 var(--f-mono);color:var(--muted);opacity:.8}
.bk-val{font:700 12px/1 var(--f-mono);text-transform:uppercase;padding:3px 6px;border-radius:var(--r-pill);background:color-mix(in oklab,var(--win) 18%,transparent);color:var(--win);white-space:nowrap}
.bk-value{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface-2);margin-bottom:12px;font-size:13px}.bk-value em{font-style:normal;color:var(--win);font:600 12px/1 var(--f-mono);margin-left:4px}
.bk-tag{font:600 12px/1 var(--f-mono);color:var(--muted);margin-left:6px}
.pp{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:10px}.pp li{display:flex;gap:10px;align-items:flex-start;font-size:13px}.pp li p{margin:3px 0 0;color:var(--muted);line-height:1.45}.pp li small{color:var(--muted)}.cp em.up{color:var(--win)}.cp em.down{color:var(--loss)}
.cp-tag{font:600 12px/1 var(--f-mono)!important;padding:3px 6px;border-radius:var(--r-pill);background:var(--surface-2)}.cp-tag.final{background:color-mix(in oklab,var(--win) 18%,transparent);color:var(--win)!important}

.lg.fav .star{font-style:normal;color:var(--accent);font-size:12px;margin-left:auto}

.lg-order li{display:grid;grid-template-columns:16px 22px minmax(0,1fr) auto auto auto;gap:6px;align-items:center;padding:6px 6px 6px 8px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);cursor:grab}

/* player match card + FotMob profile */
.rt{display:inline-block;min-width:30px;padding:3px 5px;border-radius:var(--r-ctl);font:700 12px/1 var(--f-mono);text-align:center;color:#fff;background:#5C677D;vertical-align:1px}

.rt.r-top{background:#1D4ED8}.rt.r-good{background:#15803D}.rt.r-ok{background:#F0A202;color:#1A1405}.rt.r-low{background:#C53030}

/* ---------- sports-app look: profiles, stats, lineups ---------- */
/* Team-colour header band with white type (ESPN), compact stat strips, flat lists with bold section
   heads, and FotMob-style lineups and percentile pills. Everything below overrides the rules above. */
:root{
  --f-display:"Sofia Sans Extra Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Sofia Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Sofia Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body{font-feature-settings:"tnum" 1,"cv11" 1}

/* header band */
.hero.solo{--hb:color-mix(in oklab,var(--tc) 58%,#0a0f1a);position:relative;overflow:hidden;padding:10px 16px 0;color:#fff;
  background:var(--hb);
  --fg:#fff;--muted:rgba(255,255,255,.72);--line:rgba(255,255,255,.16);--surface:rgba(255,255,255,.08);--surface-2:rgba(255,255,255,.14)}
.hero.solo::before{content:"";position:absolute;inset:0 0 0 auto;width:55%;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px);-webkit-mask:linear-gradient(90deg,transparent,#000 60%);mask:linear-gradient(90deg,transparent,#000 60%)}
.hero.solo > *{position:relative}
.hero.solo .hero-top .icon-btn,.hero.solo .back{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}
.hero.solo .icon-btn{width:32px;height:32px}.hero.solo .icon-btn svg{width:16px;height:16px}
.hero.solo .thead{gap:14px;margin-top:6px;align-items:center}
.hero.solo .thead .face{width:76px;height:76px;border-radius:50%;object-position:50% 12%;border:2px solid rgba(255,255,255,.9);background:#E9EDF3;box-shadow:none}
.hero.solo .thead img.face.espn-shot{object-fit:cover;object-position:50% 20%}
.hero.solo .thead .crest{width:60px;height:60px;filter:none}
.hero.solo .thead h3{font:700 27px/1.02 var(--f-display);letter-spacing:.005em;text-transform:none}
.hero.solo .thead p{margin:5px 0 0;font-size:13px;gap:2px 0;color:rgba(255,255,255,.86)}
.hero.solo .thead p > span + span::before,.hero.solo .thead p > span.tclub::before{content:"·";margin:0 7px;opacity:.6}
.hero.solo .thead p > span:first-child::before{content:none}
.hero.solo .thead p img{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
.hero.solo .linkbtn{text-decoration-color:rgba(255,255,255,.4)}
.hero.solo .thead .form{margin-top:7px}
.tact{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.hero.solo .favbtn{margin-top:8px;padding:5px 11px;font-size:12px;background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.tact .favbtn{margin-top:0}
.hero.solo .favbtn[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.hero.solo .stat-badge{background:rgba(255,255,255,.16);color:#fff}
.hero.solo .stat-badge.injured{background:#E5383B;color:#fff}.hero.solo .stat-badge.suspended{background:#F4C542;color:#1A1405}
.hero.solo .stat-badge.ok{background:rgba(63,203,126,.22);color:#B9F5D2}
.hero.solo .mv.up{color:#7CF0AE}.hero.solo .mv.down{color:#FF9A9A}
.hero.solo .bb-bio{font-size:12px}
.hero.solo > p,.hero.solo .hcap{margin:10px 0 0;font:600 12px/1.2 var(--f-body)!important;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.66)!important}
/* quick facts */
.hfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:0;margin:12px 0 0;padding:8px 0;border-top:1px solid var(--line)}
.hfacts div{min-width:0;padding:0 8px;border-left:1px solid var(--line)}.hfacts div:first-child{border-left:0;padding-left:0}
.hfacts dt{font:600 12px/1.2 var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.62)}

/* stat strip inside the band */

<script>
const BASE = 'https://site.api.espn.com/apis/site/v2/sports/soccer';
const BASE2 = 'https://site.api.espn.com/apis/v2/sports/soccer';
const LEAGUES = [
  ['Europe','eng.1','Premier League','England'],['Europe','esp.1','LALIGA','Spain'],['Europe','ger.1','Bundesliga','Germany'],
  ['Europe','ita.1','Serie A','Italy'],['Europe','fra.1','Ligue 1','France'],['Europe','por.1','Primeira Liga','Portugal'],
  ['Europe','ned.1','Eredivisie','Netherlands'],['Europe','sco.1','Scottish Premiership','Scotland'],['Europe','tur.1','Süper Lig','Turkey'],
  ['Europe','eng.2','Championship','England'],['Europe','isr.1','Israeli Premier League','Israel'],
  ['UEFA','uefa.champions','Champions League','UEFA'],['UEFA','uefa.europa','Europa League','UEFA'],['UEFA','uefa.europa.conf','Conference League','UEFA'],
  ['Domestic cups','eng.fa','FA Cup','England'],['Domestic cups','eng.league_cup','Carabao Cup','England'],['Domestic cups','esp.copa_del_rey','Copa del Rey','Spain'],
  ['Domestic cups','ger.dfb_pokal','DFB-Pokal','Germany'],['Domestic cups','ita.coppa_italia','Coppa Italia','Italy'],
  ['Americas','usa.1','MLS','USA & Canada'],['Americas','mex.1','Liga MX','Mexico'],['Americas','usa.nwsl','NWSL','USA'],
  ['Americas','concacaf.champions','Concacaf Champions Cup','Concacaf'],['Americas','concacaf.leagues.cup','Leagues Cup','MLS & Liga MX'],
  ['South America','conmebol.libertadores','Libertadores','CONMEBOL'],['South America','conmebol.sudamericana','Sudamericana','CONMEBOL'],
  ['South America','arg.1','Liga Profesional','Argentina'],['South America','bra.1','Brasileirão','Brazil'],
  ['Asia','ksa.1','Saudi Pro League','Saudi Arabia'],
  ['International','fifa.world','World Cup','FIFA'],['International','fifa.cwc','Club World Cup','FIFA'],['International','uefa.euro','Euros','UEFA'],
  ['International','conmebol.america','Copa América','CONMEBOL'],['International','concacaf.gold','Gold Cup','Concacaf'],
  ['International','caf.nations','Africa Cup of Nations','CAF'],['International','afc.asian.cup','Asian Cup','AFC'],
  ['International','uefa.nations','UEFA Nations League','UEFA'],['International','concacaf.nations.league','Concacaf Nations League','Concacaf'],
  ['International','fifa.friendly','Friendlies','International'],
].map(([region,slug,name,area])=>({region,slug,key:slug,name,area,logo:null}));
const LG = Object.fromEntries(LEAGUES.map(l=>[l.slug,l]));
const OTHER = {region:'More',slug:'all',key:'other',name:'Other competitions',area:'Worldwide',logo:null};
LG.all = OTHER; LG.other = OTHER;

// match lookups also see matches opened from another day's fixture list (S.extra)
class EvMap extends Map { get(k){ return super.get(k) ?? S.extra?.get(k) } }
const S = {
  date: new Date(), filter: 'all', q: '', events: new EvMap(), byLeague: {}, sel: null, tab: 'pitch', pitchMode: 'shots',
  summary: null, standings: {}, loading: true, lastSync: null, stack: [], curTabs: null,
};
window.S = S;   // other files (home.js, pages.js) read the page state through window
const prevScores = new Map();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
const sameDay = (a,b) => ymd(a) === ymd(b);
const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v) }catch{ return d } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch{} } };

/* ---------- colours ---------- */
function hex(c){ c = (c||'').replace('#',''); return /^[0-9a-f]{6}$/i.test(c) ? '#'+c : null }
function rgb(h){ const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255] }
function dist(a,b){ const x=rgb(a), y=rgb(b); return Math.hypot(x[0]-y[0], x[1]-y[1], x[2]-y[2]) }
function hsl(h){ const [r,g,b] = rgb(h).map(v=>v/255); const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn; let H = 0;
  if (d) H = mx===r ? ((g-b)/d)%6 : mx===g ? (b-r)/d+2 : (r-g)/d+4; H = (H*60+360)%360; const L = (mx+mn)/2; return [H, d ? d/(1-Math.abs(2*L-1)) : 0, L] }
function lum(h){ const [r,g,b] = rgb(h).map(v=>{v/=255; return v<=.03928? v/12.92 : ((v+.055)/1.055)**2.4}); return .2126*r+.7152*g+.0722*b }
// Pick a usable team colour: avoid near-white/near-black, and keep home and away visually apart.
function teamColors(h, a){
  const ok = c => c && lum(c) > .03 && lum(c) < .85;
  let hc = ok(hex(h.color)) ? hex(h.color) : ok(hex(h.alt)) ? hex(h.alt) : '#3D6FD9';
  let ac = ok(hex(a.color)) ? hex(a.color) : ok(hex(a.alt)) ? hex(a.alt) : '#D9563D';
  const clash = (x, y) => { const [hx, sx] = hsl(x), [hy, sy] = hsl(y); const dh = Math.min(Math.abs(hx-hy), 360-Math.abs(hx-hy));
    return dist(x, y) < 110 || (sx > .25 && sy > .25 && dh < 35) };
  if (clash(hc, ac)) { const alt = hex(a.alt); ac = ok(alt) && !clash(hc, alt) ? alt : ['#2F6FED','#F2A516','#16A085','#E04A4A'].find(c => !clash(hc, c)); }
  return [hc, ac];
}

/* ---------- data ---------- */
const inFlight = new Map();   // callers asking for the same address at the same moment share one request
function getJSON(url){
  if (inFlight.has(url)) return inFlight.get(url);
  const p = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json() }).finally(() => inFlight.delete(url));
  inFlight.set(url, p); return p;
}

function norm(ev, slug){
  const c = ev.competitions?.[0]; if (!c) return null;
  const side = ha => { const x = c.competitors.find(t=>t.homeAway===ha) || {}; const t = x.team || {};
    if (t.id) teamNames.set(String(t.id), t.displayName || t.name);
    let logo = t.logo || t.logos?.[0]?.href;
    if ((!logo || /default-team-logo/.test(logo)) && (t.displayName || t.name)) logo = `/api/img/team?name=${encodeURIComponent(t.displayName || t.name)}`;
    return { id: t.id, name: t.shortDisplayName || t.displayName || t.name, full: t.displayName, abbr: t.abbreviation, logo,
      color: t.color, alt: t.alternateColor, score: (typeof x.score === 'object' && x.score ? x.score.displayValue : x.score) ?? '', winner: x.winner, form: x.form || '', shootout: x.shootoutScore } };
  const st = c.status?.type || ev.status?.type || {};
  const home = side('home'), away = side('away');
  const [hc, ac] = teamColors(home, away);
  let league = LG[slug];
  if (slug === 'all') league = { ...OTHER, name: prettySeason(ev.season?.slug) };
  return { id: ev.id, slug, league, date: new Date(ev.date), state: st.state, completed: st.completed, detail: st.shortDetail || st.detail || '', desc: st.description,
    clock: c.status?.displayClock, home, away, hc, ac, venue: c.venue?.fullName, city: c.venue?.address?.city, note: c.notes?.[0]?.headline || '',
    broadcast: c.broadcasts?.flatMap(b=>b.names||[]).join(', ') || '',
    goals: (c.details || []).filter(d => d.scoringPlay).map(d => ({ t: String(d.team?.id || ''), min: d.clock?.displayValue || '', who: d.athletesInvolved?.[0]?.shortName || d.athletesInvolved?.[0]?.displayName || '', og: !!d.ownGoal, pen: !!d.penaltyKick })) };
}
function prettySeason(s){
  if (!s) return 'Other competitions';
  const t = s.replace(/^\d{4}(-\d{2,4})?-/, '').replace(/-/g,' ').trim();
  if (!t || /^(league phase|regular season|group stage|round of \d+|knockout.*|final|semifinals?|quarterfinals?)$/i.test(t)) return 'Other competitions';
  return t.replace(/\b(fifa|uefa|afc|caf|u \d+)\b/gi, m=>m.toUpperCase().replace(' ','-')).replace(/\b[a-z]/g, m=>m.toUpperCase());
}

let loadSeq = 0;
async function loadDay(slugs){
  const seq = ++loadSeq; const day = ymd(S.date);
  setSync(true);
  const list = (slugs || [...LEAGUES.map(l=>l.slug), 'all']).filter(s => !FM_SOURCE[s]);
  const fmList = Object.keys(FM_SOURCE).filter(s => !slugs || slugs.includes(s));
  const fmDone = Promise.allSettled(fmList.map(s => cjT(`/api/fm/league?id=${FM_SOURCE[s]}`, 55000)));
  const results = await Promise.allSettled(list.map(slug => getJSON(`${BASE}/${slug}/scoreboard?dates=${day}`).then(d=>({slug,d}))));
  if (seq !== loadSeq) return;
  if (!slugs) { S.events = new EvMap(); S.byLeague = {}; }
  for (const r of results) {
    if (r.status !== 'fulfilled') continue;
    const { slug, d } = r.value;
    if (slug !== 'all') { const lg = d.leagues?.[0]; if (lg && LG[slug]) { LG[slug].logo = lg.logos?.[0]?.href || LG[slug].logo; } }
    for (const ev of d.events || []) {
      if (slug === 'all' && S.events.has(ev.id) && S.events.get(ev.id).slug !== 'all') continue;
      const m = norm(ev, slug); if (!m) continue;
      S.events.set(ev.id, m);
    }
  }
  await fmDone; if (seq !== loadSeq) return;
  await Promise.allSettled(fmList.map(loadFMDay));
  if (!slugs) flDays.mark('soccer', '', S.date, S.events.size);   // the date strip's dot for this day
  detectGoals();
  S.loading = false; S.lastSync = new Date();
  setSync(false);
  render();
  loadListOdds().catch(() => {});
  if (S.sel && S.events.has(S.sel)) refreshSheetHero();
}
function detectGoals(){
  for (const e of S.events.values()) {
    const key = e.id, now = [+e.home.score||0, +e.away.score||0];
    const was = prevScores.get(key);
    if (was && e.state === 'in') {
      if (now[0] > was[0]) goal(e, 'home'); else if (now[1] > was[1]) goal(e, 'away');
    }
    prevScores.set(key, now);
  }
}
function goal(e, side){
  const t = e[side];
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<b>Goal</b><span>${esc(t.name)}<br><span class="num" style="opacity:.7">${esc(e.home.abbr)} ${esc(e.home.score)}–${esc(e.away.score)} ${esc(e.away.abbr)} · ${esc(e.clock)}</span></span>`;
  el.onclick = () => select(e.id);
  $('toasts').appendChild(el); setTimeout(()=>el.remove(), 9000);
  if (store.get('fl.alerts', true)) $('announce').textContent = `Goal for ${t.full||t.name}. ${e.home.name} ${e.home.score}, ${e.away.name} ${e.away.score}, ${e.clock}.`;
  requestAnimationFrame(()=>{ const c = document.querySelector(`[data-ev="${e.id}"]`); c && c.classList.add('goal-flash'); });
}
function setSync(busy){
  $('sync').classList.toggle('busy', busy);
  $('syncTxt').textContent = busy ? 'Updating' : (S.lastSync ? 'Live · ' + S.lastSync.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '');
}

/* ---------- list rendering ---------- */
// S.scope is the league you picked (or null for every league); S.filter is All / Live / On TV / My teams inside it
const QUICK = ['all','live','tv','fav'];
const scopeLeague = () => S.scope && S.scope !== 'other' && LG[S.scope] ? S.scope : null;
const quickOk = e => S.filter === 'live' ? e.state === 'in' : S.filter === 'tv' ? !!e.broadcast : S.filter === 'fav' ? (isFav(e.home.id) || isFav(e.away.id)) : true;
const QUICK_LABEL = { live: 'Live', tv: 'On TV', fav: 'My teams' };
const favLeagueList = () => S.favLeagues.filter(sl => LG[sl] && sl !== 'all').map(sl => LG[sl]);
function visibleEvents(){
  const q = S.q.trim().toLowerCase();
  return [...S.events.values()].filter(e => {
    if (!quickOk(e)) return false;
    if (S.scope && LG[S.scope] && e.slug !== LG[S.scope].slug) return false;
    if (q && !(`${e.home.full} ${e.away.full} ${e.home.name} ${e.away.name} ${e.league.name}`.toLowerCase().includes(q))) return false;
    return true;
  });
}
const stateRank = s => s === 'in' ? 0 : s === 'pre' ? 1 : 2;
function render(){
  document.querySelectorAll('.sport-sw button').forEach(b => { const on = b.dataset.sport === S.sport; b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
    if (on && b.parentElement.scrollWidth > b.parentElement.clientWidth) b.parentElement.scrollLeft = Math.max(0, b.offsetLeft - b.parentElement.offsetLeft - 40) });
  if (S.sport === 'basketball') {   // basketball has its own screen (basketball.js)
    $('list').hidden = true; $('market').hidden = true; $('picks').hidden = true; $('fb').hidden = true; $('bb').hidden = false; $('chips').classList.remove('mk-hide');
    document.querySelector('.shell').classList.remove('mk-page');
    renderBasketball(); bbTicker(); return;
  }
  $('bb').hidden = true;
  if (S.sport === 'football') {   // American football has its own screen (football.js)
    $('list').hidden = true; $('market').hidden = true; $('picks').hidden = true; $('fb').hidden = false; $('chips').classList.add('mk-hide');
    document.querySelector('.shell').classList.remove('mk-page');
    renderFootball(); fbTicker(); return;
  }
  $('fb').hidden = true;
  const mk = S.page === 'transfers', pk = S.page === 'picks';
  $('list').hidden = mk || pk; $('market').hidden = !mk; $('picks').hidden = !pk; document.querySelector('.shell').classList.toggle('mk-page', mk); $('chips').classList.toggle('mk-hide', mk);
  if (mk) { renderRail(); renderTicker(); renderQuick(); renderMarket(); return }
  if (pk) { renderRail(); renderTicker(); renderQuick(); renderPicks(); return }
  renderDates(); renderRail(); renderTicker(); renderQuick();
  const evs = visibleEvents();
  const groups = new Map();
  const order = [...S.favLeagues, ...LEAGUES.map(l=>l.slug).filter(sl => !S.favLeagues.includes(sl)), 'all'];   // starred leagues first
  evs.sort((a,b) => order.indexOf(a.slug) - order.indexOf(b.slug) || stateRank(a.state) - stateRank(b.state) || a.date - b.date);
  if (S.sort === 'time') evs.sort((a,b) => stateRank(a.state) - stateRank(b.state) || a.date - b.date);
  for (const e of evs) { const k = S.sort === 'time' ? 'time' : e.slug + '|' + e.league.name; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e) }
  const live = evs.filter(e=>e.state==='in').length;
  const today = sameDay(S.date, new Date());
  $('listTitle').textContent = S.scope && LG[S.scope] ? LG[S.scope].name + (S.filter !== 'all' ? ' · ' + QUICK_LABEL[S.filter] : '') : S.filter === 'live' ? 'Live now' : S.filter === 'tv' ? 'On TV' : S.filter === 'fav' ? 'My teams' : today ? 'Today' : S.date.toLocaleDateString([], {weekday:'long', day:'numeric', month:'short', ...(S.date.getFullYear() !== new Date().getFullYear() ? {year:'numeric'} : {})});
  $('listCount').innerHTML = `${evs.length} match${evs.length===1?'':'es'}${live ? ` · <span class="pill live">${live} live</span>` : ''}`;
  $('lgInfo')?.remove();
  if (scopeLeague()) $('listCount').insertAdjacentHTML('afterend', `<button class="btn ghost lginfo" id="lgInfo" data-act="lginfo">Table, top scorers & odds</button>`);
  $('lgModes')?.remove();
  if (scopeLeague()) $('lgInfo').insertAdjacentHTML('afterend', leagueModesHTML());
  if (leagueModeOn()) return renderLeagueSched();
  if (S.loading) return;
  if (!evs.length) {
    $('groups').innerHTML = `<div class="empty-state"><strong>${S.filter==='live' ? (S.scope && LG[S.scope] ? `Nothing live in ${esc(LG[S.scope].name)}` : 'Nothing live right now') : S.filter==='fav' && S.scope ? `None of your teams play in ${esc(LG[S.scope].name)} today` : 'No matches'}</strong>${S.q ? `No matches on this day include “${esc(S.q)}”.<div style="margin-top:12px"><button class="btn ghost" data-act="clearq">Clear search and show all matches</button></div>` : S.filter==='live' ? 'Switch to All matches to see what kicks off later.' : 'Try another day or competition.'}</div>`;
    return;
  }
  const liveNow = S.filter === 'all' && !S.q && !S.scope ? evs.filter(e=>e.state==='in') : [];
  const liveHTML = liveNow.length > 0 && groups.size > 1 ? `<div class="group live-group"><div class="group-h"><span class="pill live">Live</span><strong>Live now</strong><span>· across all competitions</span></div><div class="cards">${liveNow.map(card).join('')}</div></div>` : '';
  const favNow = S.filter === 'all' && !S.q && !S.scope && S.fav.length ? evs.filter(e => isFav(e.home.id) || isFav(e.away.id)) : [];
  const favHTML = favNow.length ? `<div class="group"><div class="group-h"><strong>★ My teams</strong><span>· ${favNow.length} match${favNow.length>1?'es':''}</span></div><div class="cards">${favNow.map(card).join('')}</div></div>` : '';
  $('groups').innerHTML = spotlightHTML(evs) + dayPulseHTML(evs) + favHTML + liveHTML + [...groups.values()].map(list => {
    if (S.sort === 'time') return `<div class="group"><div class="group-h"><strong>By kick-off time</strong></div><div class="cards">${list.map(card).join('')}</div></div>`;
    const lg = list[0].league;
    return `<div class="group"><div class="group-h">${lg.logo ? `<img src="${esc(lg.logo)}" alt="">` : ''}<strong>${esc(lg.name)}</strong><span>· ${esc(lg.area)}</span></div>
      <div class="cards">${list.map(card).join('')}</div></div>`;
  }).join('');
}
function cardFacts(e){
  const hs = +e.home.score, as = +e.away.score, post = e.state === 'post', hl = post && hs < as, al = post && as < hs;
  const t = (x, lose, win) => ({ name: x.name, logo: x.logo, score: x.score, lose, win });
  return { id: e.id, attrs: `data-ev="${esc(e.id)}"`, hc: e.hc, ac: e.ac, label: spoken(e), state: e.state, a: t(e.home, hl, al), b: t(e.away, al, hl),
    clock: /half/i.test(e.detail) ? 'HT' : e.clock, final: e.detail.replace('Full Time', 'FT'), note: e.state === 'pre' && /postpon|cancel|delay/i.test(e.detail) ? e.detail : '', date: e.date, tv: (e.broadcast || '').split(',')[0] };
}
function card(e){ return flCard({ ...cardFacts(e), cls: S.sel === e.id ? 'sel' : '', extra: oddRow(e) }) }
// The marquee: the day's headline matches, big, lit in both teams' colours. A match of one of your teams first,
// then whatever is live, then the next to kick off. The first is the main stage; two more stand beside it.
const matchMinute = e => { const m = String(e.clock || '').match(/(\d+)(?:'?\s*\+\s*(\d+))?/); return /half/i.test(e.detail || '') ? 45 : m ? +m[1] + (+m[2] || 0) : null };
const kickIn = d => { const m = Math.round((d - Date.now()) / 60000); return m <= 0 || m > 20 * 60 ? '' : m < 60 ? `in ${m}m` : `in ${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` };
function spotHTML(e, mini){
  if (mini) return flCard({ ...cardFacts(e), cls: S.sel === e.id ? 'sel' : '', lg: e.league.name, extra: oddRow(e) });
  const live = e.state === 'in', ml = !e.completed && S.odds.get(e.id)?.ml, min = live ? matchMinute(e) : null, f = cardFacts(e);
  const under = (t, k) => `${t.form ? `<span class="form" aria-hidden="true">${[...t.form].slice(-5).map(c => `<i class="${esc(c)}">${esc(c)}</i>`).join('')}</span>` : ''}${(g => g.length ? `<span class="ftr-g">${g.slice(0, 4).map(x => `<span>${esc(x.who)} <b>${esc(x.min)}</b>${x.pen ? ' (pen)' : x.og ? ' (og)' : ''}</span>`).join('')}</span>` : '')((e.goals || []).filter(x => x.t === String(t.id)))}`;
  f.a.under = under(e.home); f.b.under = under(e.away);
  const prob = ml && ml.home && ml.away ? `<span class="ftr-prob" aria-label="Win chances"><i style="flex:${ml.home.p};background:var(--hc)"><b>${pct(ml.home.p)}%</b></i>${ml.draw ? `<i class="d" style="flex:${ml.draw.p}"><b>Draw ${pct(ml.draw.p)}%</b></i>` : ''}<i style="flex:${ml.away.p};background:var(--ac)"><b>${pct(ml.away.p)}%</b></i></span>` : '';
  const clock = min != null ? `<span class="ftr-clock" aria-hidden="true"><i style="width:${Math.min(100, min / 90 * 100)}%"></i>${[15, 30, 45, 60, 75].map(t => `<u style="left:${t / 90 * 100}%"></u>`).join('')}${(e.goals || []).map(g => { const gm = parseInt(g.min) || 0; return `<s class="${g.t === String(e.home.id) ? 'h' : 'a'}" style="left:${Math.min(100, gm / 90 * 100)}%"></s>` }).join('')}<em>0'</em><em>HT</em><em>90'</em></span>` : '';
  return flFeature({ ...f, cls: S.sel === e.id ? 'sel' : '', label: 'Featured match. ' + spoken(e), lg: e.league.name, lgLogo: e.league.logo, venue: e.venue, below: clock + prob, foot: 'Pitch view, live stats, momentum and lineups' });
}
function spotlightHTML(evs){
  if (S.filter !== 'all' || S.q || evs.length < 2) return '';
  const fav = e => isFav(e.home.id) || isFav(e.away.id), rank = e => (e.state === 'in' ? 0 : e.state === 'pre' ? 2 : 4) + (fav(e) ? 0 : 1);
  const top = [...evs].sort((a, b) => rank(a) - rank(b) || (a.state === 'post' ? b.date - a.date : a.date - b.date)).slice(0, evs.length >= 5 ? 3 : 1);
  return `<div class="bento${top.length > 1 ? ' trio' : ''}">${spotHTML(top[0])}${top.length > 1 ? `<div class="bento-side">${top.slice(1).map(e => spotHTML(e, true)).join('')}</div>` : ''}</div>`;
}
// The day at a glance: a few counts, then every match laid along the clock as a bar from kick-off to the final
// whistle, with a line for right now. Tap a bar to open that match.
function dayPulseHTML(evs){
  if (S.filter !== 'all' || S.q || evs.length < 2) return '';
  const now = Date.now(), live = evs.filter(e => e.state === 'in'), done = evs.filter(e => e.state === 'post'), next = evs.filter(e => e.state === 'pre' && e.date > now).sort((a, b) => a.date - b.date)[0];
  const goals = evs.reduce((n, e) => n + (e.state === 'pre' ? 0 : (+e.home.score || 0) + (+e.away.score || 0)), 0);

async function loadPickedEvent(id){
  const p = S.picks.find(x => String(x.id) === String(id)); if (!p) return null;
  if (p.src === 'fm' && p.fmId) { openFMMatch(p.fmId); return 'fm' }
  const d = new Date(p.date), slug = p.slug || 'all';
  for (const day of [d, new Date(+d - DAY), new Date(+d + DAY)]) {
    try {
      const j = await getJSON(`${BASE}/${slug}/scoreboard?dates=${ymd(day)}`);
      const ev = (j.events || []).find(x => String(x.id) === String(id));
      const m = ev && norm(ev, slug);

    } catch {}
  }

}

async function loadSummary(){

/* head-to-head: the last meetings of these two sides, with a tally on top */

    for (const m of g.events || []) { if (!m || seen.has(m.id)) continue; seen.add(m.id);

      if (hs == null && m.score) { const p = String(m.score).split('-'); hs = p[0]; as = p[1] }
      if (!hid && tid) { const home = m.atVs !== '@'; hid = home ? tid : String(m.opponent?.id || ''); aid = home ? String(m.opponent?.id || '') : tid }
      if (hs == null || as == null) continue;

/* momentum */
const W = { goal: 6, on: 3, off: 1.4, blk: 1, corner: 1.1 };
function flowPane(e, s){

  if (!evs.length) return `<div class="note">${e.state==='pre' ? 'Momentum builds from shots, corners and goals once the match starts.' : 'Not enough play-by-play data for a momentum chart.'}</div>` + keyEventsList(e, s);
  const maxM = Math.max(90, Math.ceil(Math.max(...evs.map(x=>x.m)))+2);
  const Wd = 600, Hh = 200, mid = Hh/2, sx = m => m / maxM * Wd;
  const series = side => { const a = []; for (let m=0; m<=maxM; m+=.5) { let v = 0; for (const x of evs) if (x.side===side) { const d = m - x.m; if (d >= -1.5) v += W[x.k] * Math.exp(-(d*d)/(2*2.6*2.6)) } a.push([m,v]) } return a };

  const sy = v => v / max * (mid - 14);
  const path = (arr, dir) => `M0 ${mid} ` + arr.map(([m,v]) => `L${sx(m).toFixed(1)} ${(mid - dir*sy(v)).toFixed(1)}`).join(' ') + ` L${Wd} ${mid}Z`;
  let ticks = ''; for (let m=0; m<=maxM; m+=15) ticks += `<line x1="${sx(m)}" x2="${sx(m)}" y1="6" y2="${Hh-6}" stroke="var(--line)" stroke-width="1"/><text x="${sx(m)}" y="${Hh+14}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Sofia Sans,sans-serif">${m}'</text>`;
  const goals = (s.keyEvents||[]).filter(k=>k.scoringPlay).map(k => { const side = teamSide(k.team); const x = sx((k.clock?.value||0)/60); const y = side==='home' ? 10 : Hh-10;
    return `<g><line x1="${x}" x2="${x}" y1="${mid}" y2="${y}" stroke="var(--fg)" stroke-width="1" stroke-dasharray="2 2"/><circle cx="${x}" cy="${y}" r="7" fill="var(--surface)" stroke="var(--fg)" stroke-width="1.2"/><circle cx="${x}" cy="${y}" r="2.6" fill="var(--fg)"/></g>` }).join('');

  return `<div class="flow"><h5>Attacking pressure · shots, corners and goals</h5>
    <svg viewBox="0 -4 ${Wd} ${Hh+24}" role="img" aria-label="Momentum chart">${ticks}${ht}
      <path d="${path(hs,1)}" fill="${e.hc}" fill-opacity=".75"/><path d="${path(as,-1)}" fill="${e.ac}" fill-opacity=".75"/>

      <text x="6" y="22" font-size="11" font-weight="600" fill="var(--fg)">${esc(e.home.name)}</text><text x="6" y="${Hh-10}" font-size="11" font-weight="600" fill="var(--fg)">${esc(e.away.name)}</text>

}
function icon(t){

/* table */
async function loadTable(e){

  const season = S.tblSeason ?? seasonOf(e.date, slug), key = slug + '|' + season;
  if (target()) target().insertAdjacentHTML('beforebegin', `<div class="tc-bar">${seasonSelect('mtSeason', season, slug)}</div>`);
  let data = S.standings[key];

  const ok = groups.filter(g => g.standings?.entries?.length);
  if (!ok.length) {

document.addEventListener('error', ev => {
  const img = ev.target; if (!(img instanceof HTMLImageElement)) return;
  if (img.dataset.ini != null) {   // lineup/squad photos: try each source once, then show initials (never the flickering retry loop)
    const next = (img.dataset.fb || '').split('|').filter(Boolean);
    if (next.length) { img.dataset.fb = next.slice(1).join('|'); img.src = next[0]; return }
    const ini = document.createElement('span'); ini.className = img.className.replace('xp-img', 'xp-ini') + ' ini'; ini.textContent = img.dataset.ini; ini.setAttribute('aria-hidden', 'true');
    img.replaceWith(ini); return;
  }
  const chain = (img.dataset.fb || '').split('|').filter(Boolean);
  if (chain.length) { img.dataset.fb = chain.slice(1).join('|'); img.src = chain[0]; return }
  const team = img.src.match(/teamlogos\/soccer\/500\/(\d+)\.png/);
  if (team && teamNames.has(team[1]) && !img.dataset.tried) { img.dataset.tried = 1; img.src = imgTeam(teamNames.get(team[1])); return }
  const shot = img.src.match(/headshots\/soccer\/players\/full\/(\d+)\.png/);
  if (shot && athleteNames.has(shot[1]) && !img.dataset.tried) { img.dataset.tried = 1; img.dataset.sil = 1; img.src = imgPlayer(...athleteNames.get(shot[1])); return }

  const api = img.src.match(/^(.*\/api\/img\/[^#]*?)(?:&r=\d+)?$/);
  if (api && (+img.dataset.retry || 0) < 3) { const n = (+img.dataset.retry || 0) + 1; img.dataset.retry = n; img.src = SIL;
    setTimeout(() => { if (img.isConnected) img.src = `${api[1]}&r=${n}` }, 25000 * n); return }
  if (img.dataset.sil) { delete img.dataset.sil; img.src = SIL; return }
  if (/\/api\/img\/team/.test(img.src) || team) img.style.visibility = 'hidden';
}, true);

/* dark-only logos (black league and club marks vanish on dark backgrounds): measure each logo once, and give the dark ones a light chip */
const logoDark = new Map();   // src -> true / false / null (couldn't be read)
const LOGO_SRC = /logo|crest|wappen|teamlogo|api\/img\/team/i;
function paintLogo(img, dark){ img.classList.toggle('lg-dark', !!dark) }
document.addEventListener('load', ev => {
  const img = ev.target; if (!(img instanceof HTMLImageElement) || !LOGO_SRC.test(img.src) || /^data:/.test(img.src)) return;
  if (logoDark.has(img.src)) return paintLogo(img, logoDark.get(img.src));
  logoDark.set(img.src, null);
  const probe = new Image(); probe.crossOrigin = 'anonymous';
  probe.onload = () => { try {
    const c = document.createElement('canvas'); c.width = c.height = 24; const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(probe, 0, 0, 24, 24);
    const d = g.getImageData(0, 0, 24, 24).data; let n = 0, sum = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 128) { n++; sum += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255 }
    const dark = n > 20 && sum / n < 0.15; logoDark.set(probe.src, dark);
    document.querySelectorAll('img').forEach(i => { if (i.src === probe.src) paintLogo(i, dark) });

  probe.src = img.src;

}

const STOP = /\b(fc|cf|afc|sc|ac|club|de|cd|ud|sk|fk|bk|ss|as|calcio|football|futbol|the)\b/g;

  if (a.includes(b) || b.includes(a)) return .85;
  const A = new Set(a.split(' ')), B = new Set(b.split(' ')); let n = 0; A.forEach(x => B.has(x) && n++);

function kxDate(ticker){ const m = ticker.match(/-(\d{2})([A-Z]{3})(\d{2})/); return m ? Date.UTC(2000 + +m[1], MON[m[2]], +m[3]) : null }
const price = m => { const b = +m.yes_bid_dollars, a = +m.yes_ask_dollars, l = +m.last_price_dollars;
  return b > 0 && a > 0 ? (b + a) / 2 : l || b || a || 0 };
const prev = m => +m.previous_price_dollars || null;
async function kxSeries(prefix, kind){
  const d = await cjT(`/api/kalshi/events?series_ticker=KX${prefix}${kind}&status=open&with_nested_markets=true&limit=200`, 20000);
  S.serverOK = true; return d.events || [];

function kxFind(events, e){
  const day = Date.UTC(e.date.getUTCFullYear(), e.date.getUTCMonth(), e.date.getUTCDate());
  let best = null, bestScore = 0;
  for (const k of events) {
    const kd = kxDate(k.event_ticker); if (kd != null && Math.abs(kd - day) > 864e5 * 1.5) continue;
    const [A, B] = (k.title || '').split(/ vs\.? | v | at /i).map(s => (s||'').replace(/:.*$/, ''));
    const straight = Math.max(teamSim(e.home.full, A), teamSim(e.home.name, A)) + Math.max(teamSim(e.away.full, B), teamSim(e.away.name, B));
    const swapped = Math.max(teamSim(e.home.full, B), teamSim(e.home.name, B)) + Math.max(teamSim(e.away.full, A), teamSim(e.away.name, A));
    const sc = Math.max(straight, swapped);

    const side = /^(tie|draw)$/i.test(lbl) ? 'draw' : sideOf(e, lbl.replace(/ wins?$/i, ''));
    if (side) out[side] = { p: price(m), prev: prev(m), vol: +m.volume_fp || 0, ticker: m.ticker };

async function loadListOdds(){
  const pool = [...S.events.values(), ...S.extra.values()];   // today's list plus any league "upcoming" list
  const slugs = [...new Set(pool.filter(e => e.state !== 'post' && KX[e.slug]).map(e => e.slug))];
  if (!slugs.length) return;
  const res = await Promise.allSettled(slugs.map(s => kxSeries(KX[s], 'GAME').then(evs => ({ s, evs }))));
  if (res.every(r => r.status === 'rejected')) { S.serverOK = S.serverOK || false; return }
  let changed = false;
  for (const r of res) { if (r.status !== 'fulfilled') continue;
    for (const e of pool) { if (e.slug !== r.value.s || e.state === 'post') continue;
      const k = kxFind(r.value.evs, e); if (!k) continue;
      const ml = parseML(e, k); if (!ml) continue;
      const o = S.odds.get(e.id) || {}; o.ml = ml; S.odds.set(e.id, o); changed = true } }
  if (changed) render();
}
// One request per match at a time, and a match Kalshi has no market for is asked again only after a pause.
// (Without this, a pane that rendered "no market yet" asked again, re-rendered, asked again... every 70ms: the game-click freeze.)
const oddsInFlight = new Map(), oddsTried = new Map();
function oddsDue(e, wait = 45000){ return !oddsInFlight.has(e.id) && Date.now() - (oddsTried.get(e.id) || 0) > wait }
function loadMatchOdds(e){
  if (oddsInFlight.has(e.id)) return oddsInFlight.get(e.id);
  oddsTried.set(e.id, Date.now());
  const p = loadMatchOdds_(e).finally(() => oddsInFlight.delete(e.id));

async function loadMatchOdds_(e){
  const pre = KX[e.slug]; if (!pre) return { none: true };

  if ([g, sp, to].every(r => r.status === 'rejected')) return { offline: true };
  const o = S.odds.get(e.id) || {};
  const kg = val(g) && kxFind(val(g), e); if (kg) { o.ml = parseML(e, kg); o.title = kg.title }
  const ks = val(sp) && kxFind(val(sp), e);
  if (ks) o.spread = (ks.markets||[]).map(m => ({ side: sideOf(e, (m.yes_sub_title||'').replace(/ wins by.*$/i, '')), line: +m.floor_strike, p: price(m), prev: prev(m), label: m.yes_sub_title })).filter(x => x.side).sort((a,b) => a.line - b.line);
  const kt = val(to) && kxFind(val(to), e);
  if (kt) o.total = (kt.markets||[]).map(m => ({ line: +m.floor_strike, p: price(m), prev: prev(m) })).filter(x => x.line).sort((a,b) => a.line - b.line);

/* value history chart */
function valueChart(hist, col){
  const pts = hist.filter(h => h.value && h.date).map(h => ({ t: +day(h.date), v: h.value })).sort((a,b) => a.t - b.t);
  if (pts.length < 2) return '';
  const W = 600, H = 200, pl = 48, pr = 12, pt = 16, pb = 26;
  const t0 = pts[0].t, t1 = pts[pts.length-1].t, vmax = Math.max(...pts.map(p => p.v)) * 1.1;
  const x = t => pl + (t - t0) / Math.max(1, t1 - t0) * (W - pl - pr), y = v => pt + (1 - v / vmax) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const area = `${line} L${x(t1)} ${H - pb} L${x(t0)} ${H - pb}Z`;
  const step = vmax > 1e8 ? 5e7 : vmax > 4e7 ? 2e7 : vmax > 1e7 ? 5e6 : vmax > 2e6 ? 1e6 : 2.5e5;
  let grid = ''; for (let v = 0; v <= vmax; v += step) grid += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Sofia Sans,sans-serif">${eur(v)}</text>`;
  const y0 = new Date(t0).getFullYear(), y1 = new Date(t1).getFullYear(); let years = '';
  for (let yr = y0 + 1; yr <= y1; yr++) { const tx = x(+new Date(yr, 0, 1)); years += `<text x="${tx}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Sofia Sans,sans-serif">${yr}</text>` }
  const peak = pts.reduce((a, b) => b.v > a.v ? b : a), last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Market value history, from ${eur(pts[0].v)} to ${eur(last.v)}, peak ${eur(peak.v)}">${grid}${years}
    <path d="${area}" fill="${col}" fill-opacity=".14"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>
    ${pts.map(p => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="2.6" fill="var(--surface)" stroke="${col}" stroke-width="1.6"><title>${new Date(p.t).toLocaleDateString([], {month:'short', year:'numeric'})}: ${eur(p.v)}</title></circle>`).join('')}
    <circle cx="${x(last.t)}" cy="${y(last.v)}" r="5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${Math.min(x(peak.t), W - 60)}" y="${y(peak.v) - 7}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--fg)">Peak ${eur(peak.v)}</text></svg>`;
}

// A small cache on the device itself (IndexedDB) for things that no longer change: finished games, past seasons, box
// scores. The second look at a player then needs one small request instead of dozens.
const disk = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => { const r = indexedDB.open('floodlight', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error) });
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('kv', mode), q = fn(t.objectStore('kv')); t.oncomplete = () => res(q?.result); t.onerror = t.onabort = () => rej(t.error) }));
  const get = k => tx('readonly', st => st.get(k)).catch(() => null);
  const set = (k, v, ttl) => tx('readwrite', st => st.put({ v, x: Date.now() + ttl * 1000 }, k)).catch(() => {});
  // remember(key, seconds, make, keep): the saved value while it is fresh, otherwise make() and save what it returns (unless keep(value) says no)
  const remember = (k, ttl, make, keep) => get(k).then(hit => hit && hit.x > Date.now() ? hit.v : make().then(v => { if (v != null && ttl > 0 && (!keep || keep(v))) set(k, v, ttl); return v }));
  // once per visit: drop what has expired, and the oldest entries past a few thousand
  setTimeout(() => tx('readwrite', st => { const now = Date.now(); let n = 0; st.openCursor(null, 'prev').onsuccess = e => { const c = e.target.result; if (!c) return; if (c.value.x < now || ++n > 6000) c.delete(); c.continue() } }).catch(() => {}), 20000);
  return { get, set, remember };
})();

// ESPN's displayDOB is day/month/year
function dob(s){ const m = (s||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? new Date(+m[3], +m[2]-1, +m[1]).toLocaleDateString([], {day:'numeric', month:'long', year:'numeric'}) : (s||'') }
const INTL = /^(fifa\.(world|worldq|friendly|olympics|confederations)|uefa\.(euro|nations|euroq)|conmebol\.america|concacaf\.(gold|nations)|caf\.nations|afc\.asian|.*_u\d+|.*\.u\d+|.*worldq)/;

  return opt?.displayValue || LG[slug]?.name || slug.replace(/\./g,' ').replace(/_/g,' ').replace(/\b[a-z]/g,m=>m.toUpperCase());
}
async function loadCareer(v){

const rtCls = r => { r = +r; return !r ? '' : r >= 8 ? 'r-top' : r >= 7 ? 'r-good' : r >= 6 ? 'r-ok' : 'r-low' };
