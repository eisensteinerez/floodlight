<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floodlight Lab</title>
<style>
:root{
  --bg:#07090F; --bg2:#0C1019; --card:#111726; --card2:#161E30; --line:#232D44; --line2:#2E3A56;
  --fg:#EEF2F8; --fg2:#B9C2D6; --muted:#7D89A3; --gold:#F4C542; --gold2:#FFDF7E; --goldink:#1A1405;
  --hit:#34D399; --hit2:#0F3B2C; --miss:#F87171; --miss2:#3D1719; --push:#94A3B8; --blue:#60A5FA;
  --r:14px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(900px 420px at 12% -8%,rgba(244,197,66,.13),transparent 60%),
  radial-gradient(700px 380px at 95% 0%,rgba(96,165,250,.08),transparent 60%),var(--bg)}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 60px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;padding:10px 16px;margin:-14px -16px 14px;
  background:rgba(7,9,15,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.05)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.14em;font-size:13px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(140deg,var(--gold2),var(--gold) 55%,#C58F12);
  box-shadow:0 0 22px rgba(244,197,66,.45);color:var(--goldink);font-style:normal;font-size:14px}
.brand b{color:var(--gold)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:600;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--gold);color:var(--goldink)}
.search{flex:1;min-width:220px;display:flex;gap:8px}
.search .box{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;transition:border-color .15s}
.search .box:focus-within{border-color:var(--gold)}
.search input{flex:1;border:0;background:none;outline:none;padding:9px 0;min-width:0}
.search select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 10px;cursor:pointer}
.go{border:0;background:var(--gold);color:var(--goldink);font-weight:700;border-radius:12px;padding:0 16px;cursor:pointer}
.recent{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.recent button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--fg2);cursor:pointer}
.recent button:hover{border-color:var(--gold);color:var(--fg)}

/* cards */
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
.h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.h .sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.55fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.g2,.g3{grid-template-columns:1fr}}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;overflow:hidden;padding:20px 22px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(420px 260px at 90px 40%,rgba(244,197,66,.22),transparent 70%);pointer-events:none}
.ph{width:124px;height:124px;border-radius:50%;position:relative;background:radial-gradient(circle at 50% 35%,#2A3550,#121826);border:2px solid rgba(244,197,66,.55);
  box-shadow:0 0 0 6px rgba(244,197,66,.08),0 0 40px rgba(244,197,66,.25);overflow:hidden;display:grid;place-items:center;font-size:40px;font-weight:800;color:var(--gold)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.who h1{margin:0;font-size:34px;line-height:1.05;letter-spacing:-.02em}
.who .meta{color:var(--fg2);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--fg2);background:rgba(255,255,255,.02)}
.pill.gold{border-color:rgba(244,197,66,.5);color:var(--gold)}
.form{display:flex;gap:4px;margin-top:12px;align-items:center}
.form span{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:800}
.form .W{background:var(--hit2);color:var(--hit)}.form .L{background:var(--miss2);color:var(--miss)}.form .D,.form .T{background:#1E2638;color:var(--push)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(88px,1fr));gap:10px}
.tile{background:rgba(7,9,15,.45);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--gold);transform:translateY(-1px)}
.tile .l{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.tile .t{font-size:11px;font-weight:700}
.up{color:var(--hit)}.dn{color:var(--miss)}.flat{color:var(--muted)}
@media (max-width:1100px){.hero{grid-template-columns:auto 1fr}.tiles{grid-column:1/-1}}
@media (max-width:560px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.who .meta,.form{justify-content:center}
  .tiles{grid-template-columns:repeat(3,1fr)}.who h1{font-size:28px}}

/* stat chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;margin:14px 0 2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer;color:var(--fg2);font-weight:600;font-size:13px;display:flex;gap:7px;align-items:center}
.chip:hover{color:var(--fg);border-color:var(--line2)}
.chip.on{background:linear-gradient(140deg,var(--gold2),var(--gold));color:var(--goldink);border-color:var(--gold)}
.chip .ln{font-size:11px;padding:1px 6px;border-radius:6px;background:rgba(244,197,66,.14);color:var(--gold);font-weight:700}
.chip.on .ln{background:rgba(26,20,5,.18);color:var(--goldink)}

/* controls */
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.stepper{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:none;width:36px;height:38px;font-size:18px;cursor:pointer;color:var(--fg2)}
.stepper button:hover{background:var(--card2);color:var(--gold)}
.stepper input{width:64px;text-align:center;border:0;background:none;font-size:18px;font-weight:800;outline:none;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;color:var(--muted);font-weight:700;cursor:pointer;font-size:12px}
.seg button.on{background:var(--card2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button.on.o{color:var(--hit)}.seg button.on.u{color:var(--miss)}
.books{display:flex;gap:6px;flex-wrap:wrap}
.book{font-size:12px;border-radius:8px;padding:4px 9px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;color:var(--fg2)}
.book b{color:var(--fg)}
.book:hover{border-color:var(--gold)}

/* rings */
.rings{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:6px}
.ring{text-align:center;cursor:pointer;border-radius:12px;padding:6px 2px;border:1px solid transparent}
.ring.on{border-color:var(--line2);background:rgba(255,255,255,.02)}
.ring svg{width:100%;max-width:92px;display:block;margin:0 auto}
.ring .k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.ring .f{font-size:11px;color:var(--fg2)}
@media (max-width:560px){.rings{grid-template-columns:repeat(3,1fr)}}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .bar{transition:opacity .15s}
.chart g.b:hover .bar{opacity:.8}
.tip{position:fixed;pointer-events:none;z-index:50;background:#0B0F18;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;max-width:240px}

/* insight list */
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv>div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kv .l{font-size:11px;color:var(--muted)}.kv .v{font-size:20px;font-weight:800}
.callout{margin-top:12px;border-radius:12px;padding:12px 14px;background:linear-gradient(90deg,rgba(244,197,66,.12),rgba(244,197,66,.02));border:1px solid rgba(244,197,66,.28);color:var(--fg2);font-size:13px}
.callout b{color:var(--gold)}

/* split bars */
.split{display:grid;grid-template-columns:118px 1fr 50px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.split:last-child{border-bottom:0}
.split .n{color:var(--fg2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split .track{height:9px;border-radius:9px;background:#1A2234;overflow:hidden}
.split .track i{display:block;height:100%;border-radius:9px}
.split .p{text-align:right;font-weight:800;font-size:13px}
.split .s{font-size:11px;color:var(--muted);grid-column:2/4;margin-top:-6px}

/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:right;font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card);cursor:pointer}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 8px;border-bottom:1px solid rgba(255,255,255,.05);text-align:right;white-space:nowrap}
.tbl tr:hover td{background:rgba(255,255,255,.025)}
.tbl tr.sel td{background:rgba(244,197,66,.07)}
.tbl th.fc,.tbl td.fc{background:rgba(244,197,66,.08)}
.scroll{overflow:auto;max-height:560px;border-radius:10px}
.heat{display:inline-block;min-width:44px;text-align:center;padding:2px 6px;border-radius:7px;font-weight:800;font-size:12px}
.cell-h{color:var(--hit);font-weight:800}.cell-m{color:var(--miss)}
.sub{color:var(--muted);font-size:12px}

/* team */
.ph.logo{background:radial-gradient(circle at 50% 40%,#1E2840,#0E1320)}
.ph.logo img{object-fit:contain;padding:18px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sgrid>div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sgrid .l{font-size:11px;color:var(--muted)}.sgrid .v{font-size:17px;font-weight:800}.sgrid .rk{font-size:11px;color:var(--gold);font-weight:700}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;max-height:420px;overflow:auto}
.rp{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:7px 9px;cursor:pointer}
.rp:hover{border-color:var(--gold)}
.rp .av{width:36px;height:36px;border-radius:50%;background:#1C2436;overflow:hidden;flex:none}
.rp .av img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.rp .rn{display:flex;flex-direction:column;min-width:0}.rp b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rp small{color:var(--muted);font-size:11px}
.rp i{color:var(--miss);font-style:normal}

/* board */
.brow{display:grid;grid-template-columns:34px 1.6fr 1fr 70px 70px 70px 64px;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;border-radius:10px}
.brow:hover{background:rgba(255,255,255,.03)}
.brow .rk{font-weight:800;color:var(--muted);text-align:center}
.brow.top3 .rk{color:var(--gold)}
.brow .nm{font-weight:700}
.side{font-weight:800;font-size:12px;padding:2px 7px;border-radius:6px}
.side.over{background:var(--hit2);color:var(--hit)}.side.under{background:var(--miss2);color:var(--miss)}
@media (max-width:700px){.brow{grid-template-columns:28px 1fr 64px 64px}.brow .hide-s{display:none}}

/* states */
.empty{text-align:center;padding:70px 20px;color:var(--fg2)}
.empty h2{font-size:28px;margin:12px 0 6px;letter-spacing:-.02em}
.empty .beam{width:120px;height:120px;margin:0 auto;border-radius:50%;background:radial-gradient(circle,rgba(244,197,66,.55),rgba(244,197,66,.05) 60%,transparent 70%);filter:blur(2px);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
.skel{background:linear-gradient(90deg,#141B2A 0%,#1C2538 50%,#141B2A 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.err{border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.07);color:#FECACA;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><i>◉</i><span>FLOODLIGHT <b>LAB</b></span></div>
    <div class="tabs" id="tabs"><button data-t="player" class="on">Player</button><button data-t="team">Team</button><button data-t="board">Hot props</button></div>
    <form class="search" id="sf">
      <select id="sport" aria-label="Sport"></select>
      <label class="box"><span style="color:var(--muted)">⌕</span><input id="q" placeholder="Search a player, e.g. Jayson Tatum" autocomplete="off"></label>
      <button class="go">Go</button>
    </form>
  </div>
  <div class="recent" id="recent"></div>
  <div id="msg"></div>
  <div id="view"></div>
  <div class="foot">Past results, not a guarantee. Lines from PrizePicks and Sleeper · stats from ESPN, MLB StatsAPI and FotMob · Floodlight</div>
</div>
<div class="tip" id="tip"></div>
<script>
'use strict';
const APP_ID = '__DISCORD_APP_ID__';
const QS = new URLSearchParams(location.search);
const IN_DISCORD = QS.has('frame_id');
const SPORTS = [['nba','NBA'],['wnba','WNBA'],['nfl','NFL'],['nhl','NHL'],['mlb','MLB'],['soccer','Soccer']];
const HERO = { nba:['pts','reb','ast','3pm','pra'], wnba:['pts','reb','ast','3pm','pra'], nfl:['pyd','ryd','reyd','rec','td'], nhl:['goals','ast','pts','sog','toi'],
  mlb:['h','tb','hr','rbi','pk'], soccer:['goals','assists','shots','sot','rating'] };
const HERO_T = ['pf','pa','tot','mar','win'];
const RATE_K = new Set(['win','btts','cs','dd','g1']);
const S = { tab:'player', kind:'player', sport:'nba', pass:'', p:null, k:null, line:null, side:'over', range:'l10', sort:{ col:'l10', dir:-1 }, board:{}, loading:false };
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmt = v => v == null ? '–' : Number.isInteger(v) ? String(v) : Math.abs(v) >= 1 ? (+v.toFixed(1)).toString() : (+v.toFixed(2)).toString();
const pc = x => x == null ? '–' : Math.round(x * 100) + '%';
const heatBg = x => x == null ? 'transparent' : x >= .5 ? `rgba(52,211,153,${.1 + (x - .5) * 1.1})` : `rgba(248,113,113,${.1 + (.5 - x) * 1.1})`;
const heatFg = x => x == null ? 'var(--muted)' : x >= .5 ? '#C9F7E3' : '#FFD9D9';

/* ---------- Discord: the Embedded App handshake (what @discord/embedded-app-sdk sends first) ---------- */
if (IN_DISCORD) {
  const src = window.parent.opener ?? window.parent;
  const origin = document.referrer ? document.referrer : '*';
  window.addEventListener('message', () => {});
  try { src.postMessage([0, { v: 1, encoding: 'json', client_id: APP_ID, frame_id: QS.get('frame_id') }], origin) } catch (e) { console.warn('handshake', e) }
}

/* ---------- data ---------- */
async function api(path) {
  const r = await fetch('/api/lab/' + path, { headers: S.pass ? { 'X-Lab-Pass': S.pass } : {} });
  const d = await r.json().catch(() => ({ error: 'The server sent something unexpected.' }));
  if (!r.ok) { const e = new Error(d.error || 'Something went wrong.'); e.need = d.need; throw e }
  return d;
}
async function start() {
  $('#sport').innerHTML = SPORTS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  let want = { player: QS.get('player') || '', team: QS.get('team') || '', sport: QS.get('sport') || '' };
  try {
    const q = IN_DISCORD ? `channel_id=${encodeURIComponent(QS.get('channel_id') || '')}&instance_id=${encodeURIComponent(QS.get('instance_id') || '')}`
      : (QS.get('t') ? 't=' + encodeURIComponent(QS.get('t')) : '') + (want.player ? '&player=' + encodeURIComponent(want.player) : '') + (want.team ? '&team=' + encodeURIComponent(want.team) : '') + (want.sport ? '&sport=' + want.sport : '');
    const s = await api('session?' + q); S.pass = s.token; want = { player: s.player || want.player, team: s.team || want.team, sport: s.sport || want.sport };
  } catch (e) { return gate(e.message) }
  S.sport = want.sport || store.get('lab.sport', 'nba');
  $('#sport').value = S.sport;
  drawRecent();
  if (want.team) load(want.team, 'team');
  else if (want.player) load(want.player);
  else home();
}
function gate(m) {
  $('#view').innerHTML = `<div class="empty"><div class="beam"></div><h2>The Lab is locked</h2><p>${esc(m)}</p></div>`;
  $('#sf').classList.add('hidden'); $('#tabs').classList.add('hidden');
}
function home() {
  const team = S.tab === 'team';
  $('#q').placeholder = team ? 'Search a team, e.g. Celtics or Arsenal' : 'Search a player, e.g. Jayson Tatum';
  $('#view').innerHTML = `<div class="empty"><div class="beam"></div><h2>${team ? 'Which team are we researching?' : 'Who are we researching?'}</h2>
    <p>${team ? `Search any ${esc(sportName())} team for scores, totals, spreads covered, win rates, splits, season stats, roster and the next game's lines.`
      : `Search any ${esc(sportName())} player for every stat, hit rates at any line, trends, splits and the full game log.`}</p>
    <p class="sub">Or open <b style="color:var(--gold)">Hot props</b> for today's lines ranked by how often they've hit.</p></div>`;
}
const sportName = () => (SPORTS.find(s => s[0] === S.sport) || [, ''])[1];

async function load(name, kind) {
  kind = kind || (S.tab === 'team' ? 'team' : 'player');
  S.tab = kind; tabs();
  $('#q').value = name; $('#msg').innerHTML = '';
  $('#view').innerHTML = `<div class="grid"><div class="skel" style="height:170px"></div><div class="skel" style="height:44px"></div>
    <div class="grid g2"><div class="skel" style="height:380px"></div><div class="skel" style="height:380px"></div></div></div>`;
  try {
    const p = await api(`${kind}?sport=${S.sport}&name=${encodeURIComponent(name)}`);
    p.kind = kind; S.p = p; S.k = null; S.line = null;
    const rec = store.get('lab.recent', []).filter(r => !(r.n === p.name && r.s === p.sport));
    rec.unshift({ n: p.name, s: p.sport, t: kind }); store.set('lab.recent', rec.slice(0, 8)); drawRecent();
    pickStat(defaultStat());
  } catch (e) { $('#view').innerHTML = ''; $('#msg').innerHTML = `<div class="err">${esc(e.message)}</div>`; if (!S.p) home() }
}
function drawRecent() {
  const rec = store.get('lab.recent', []);
  $('#recent').innerHTML = rec.map(r => `<button data-n="${esc(r.n)}" data-s="${r.s}" data-t="${r.t || 'player'}">${r.t === 'team' ? '🛡 ' : ''}${esc(r.n)}</button>`).join('');
}

/* ---------- the maths ---------- */
const val = (g, k) => g.v[k];
const gamesFor = k => S.p.games.filter(g => g.v[k] != null);
function inRange(gs, r) {
  if (r === 'l5') return gs.slice(0, 5); if (r === 'l10') return gs.slice(0, 10); if (r === 'l20') return gs.slice(0, 20);

  const keys = [...new Set([S.k, ...(team ? HERO_T : HERO[S.p.sport] || []), ...S.p.stats.map(s => s.k)])].filter(k => S.p.stats.some(s => s.k === k && s.n));
  const gs = S.p.games.slice(0, 40);
  const ab = k => label(k).replace(/Pts \+ Reb \+ Ast/, 'PRA').replace(/3-pointers made/, '3PM').replace(/3-pointers attempted/, '3PA').replace(/ attempted/, ' att').replace(/ made/, '');
  return `<div class="h">Game log<span class="sp"></span><span class="pill">${gs.length} most recent</span></div>
  <div class="scroll"><table class="tbl num"><thead><tr><th>Date</th><th style="text-align:left">Opponent</th><th>Result</th>${team ? '' : '<th>Min</th>'}${keys.map(k => `<th class="${k === S.k ? 'fc' : ''}" title="${esc(label(k))}">${esc(ab(k))}</th>`).join('')}</tr></thead>
  <tbody>${gs.map(g => `<tr><td>${esc(day(g.date))}</td><td style="text-align:left">${g.home === false ? '@ ' : 'vs '}${esc(g.opp)}<div class="sub">${esc(g.comp)}</div></td>
    <td><span class="${g.res === 'W' ? 'up' : g.res === 'L' ? 'dn' : 'flat'}">${esc(g.res)}</span> ${esc(g.score)}</td>${team ? '' : `<td>${fmt(g.min == null ? null : Math.round(g.min))}</td>`}
    ${keys.map(k => { const v = g.v[k]; if (k !== S.k || v == null) return `<td>${RATE_K.has(k) && v != null ? (v ? '✓' : '·') : fmt(v)}</td>`; const h = v === S.line ? '' : (S.side === 'over' ? v > S.line : v < S.line) ? 'cell-h' : 'cell-m'; return `<td class="fc ${h}">${fmt(v)}</td>` }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function teamExtras() {
  const p = S.p, cats = {};
  for (const x of p.seasonStats || []) (cats[x.cat] = cats[x.cat] || []).push(x);
  const statCard = Object.keys(cats).length ? `<div class="card"><div class="h">Season stats<span class="sp"></span><span class="sub" style="text-transform:none;letter-spacing:0;font-weight:500">league rank where known</span></div>
    <div class="scroll" style="max-height:420px">${Object.entries(cats).map(([c, xs]) => `<div class="sub" style="margin:10px 0 6px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">${esc(c)}</div>
    <div class="sgrid">${xs.slice(0, 18).map(x => `<div><div class="l">${esc(x.l)}</div><div class="v num">${esc(x.pg || x.v)}</div>${x.rank ? `<div class="rk">${esc(x.rank)}</div>` : ''}</div>`).join('')}</div>`).join('')}</div></div>` : '';
  const ros = (p.roster || []).length ? `<div class="card"><div class="h">Roster<span class="sp"></span><span class="sub" style="text-transform:none;letter-spacing:0;font-weight:500">tap a player to research them</span></div>
    <div class="roster">${p.roster.map(r => `<button class="rp" data-player="${esc(r.name)}"><span class="av">${r.photo ? `<img src="${esc(r.photo)}" alt="" onerror="this.remove()">` : ''}</span>
      <span class="rn"><b>${esc(r.name)}</b><small>${esc([r.num && '#' + r.num, r.pos].filter(Boolean).join(' · '))}${r.out ? ` · <i>${esc(r.out)}</i>` : ''}</small></span></button>`).join('')}</div></div>` : '';
  if (!statCard && !ros) return '';
  return `<div class="grid ${statCard && ros ? 'g2' : ''}" style="margin-top:14px">${ros}${statCard}</div>`;
}

/* ---------- hot props ---------- */
async function renderBoard() {
  const sp = S.sport, b = S.board[sp];
  if (!b) {
    $('#view').innerHTML = `<div class="card"><div class="h">Today's ${esc(sportName())} props by hit rate</div>${'<div class="skel" style="height:44px;margin:8px 0"></div>'.repeat(8)}</div>`;
    try { S.board[sp] = await api('board?sport=' + sp) } catch (e) { S.board[sp] = { rows: [], error: e.message } }
    if (S.tab === 'board' && S.sport === sp) renderBoard();
    return;
  }
  const rows = b.rows || [];
  $('#view').innerHTML = `<div class="card"><div class="h">Today's ${esc(sportName())} props by hit rate<span class="sp"></span>${b.checked ? `<span class="pill num">${b.checked} lines checked</span>` : ''}</div>
    ${b.error ? `<div class="err">${esc(b.error)}</div>` : !rows.length ? `<p class="sub">No ${esc(sportName())} lines posted right now.</p>` : ''}
    ${rows.map((r, i) => `<div class="brow${i < 3 ? ' top3' : ''}" data-n="${esc(r.player)}"><div class="rk">${i + 1}</div>
      <div><div class="nm">${esc(r.player)}</div><div class="sub">${esc([r.team, r.opp && 'vs ' + r.opp].filter(Boolean).join(' · '))}</div></div>
      <div><span class="side ${r.side}">${r.side === 'over' ? 'O' : 'U'} ${fmt(r.line)}</span> <span class="sub">${esc(r.label)}</span></div>
      <div class="hide-s"><span class="heat num" style="background:${heatBg(r.l5)};color:${heatFg(r.l5)}">${pc(r.l5)}</span><div class="sub">L5</div></div>
      <div><span class="heat num" style="background:${heatBg(r.l10)};color:${heatFg(r.l10)}">${pc(r.l10)}</span><div class="sub">L10</div></div>
      <div class="hide-s"><span class="heat num" style="background:${heatBg(r.l20)};color:${heatFg(r.l20)}">${pc(r.l20)}</span><div class="sub">L20</div></div>
      <div class="num" style="text-align:right"><b>${fmt(r.avg == null ? null : Math.round(r.avg * 10) / 10)}</b><div class="sub">avg</div></div></div>`).join('')}</div>`;
}
function tabs() { document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab)) }

/* ---------- events ---------- */
$('#sf').addEventListener('submit', e => { e.preventDefault(); const n = $('#q').value.trim(); if (n) load(n) });
$('#sport').addEventListener('change', e => { S.sport = e.target.value; store.set('lab.sport', S.sport); if (S.tab === 'board') renderBoard(); else if (!S.p) home() });
$('#tabs').addEventListener('click', e => { const t = e.target.closest('button'); if (!t) return; S.tab = t.dataset.t; tabs(); $('#msg').innerHTML = ''; S.tab === 'board' ? renderBoard() : render() });
$('#recent').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.sport = b.dataset.s; $('#sport').value = S.sport; load(b.dataset.n, b.dataset.t) });
document.addEventListener('click', e => {
  const t = e.target;
  const chip = t.closest('.chip,.tile,tr[data-k]'); if (chip && chip.dataset.k) return pickStat(chip.dataset.k);
  const st = t.closest('[data-step]'); if (st) { S.line = Math.max(0, Math.round((S.line + .5 * +st.dataset.step) * 10) / 10); S.lineFrom = 'custom'; return render() }
  const sd = t.closest('[data-side]'); if (sd) { S.side = sd.dataset.side; return render() }
  const rg = t.closest('[data-r]'); if (rg) { S.range = rg.dataset.r; return render() }
  const bk = t.closest('[data-line]'); if (bk) { S.line = +bk.dataset.line; return render() }
  const so = t.closest('[data-sort]'); if (so) { const c = so.dataset.sort; S.sort = { col: c, dir: S.sort.col === c ? -S.sort.dir : (c === 'l' ? 1 : -1) }; return render() }
  const br = t.closest('.brow'); if (br) return load(br.dataset.n, 'player');
  const rp = t.closest('[data-player]'); if (rp) { scrollTo({ top: 0, behavior: 'smooth' }); return load(rp.dataset.player, 'player') }
});
document.addEventListener('change', e => { if (e.target.id === 'line') { const v = parseFloat(e.target.value); if (!isNaN(v)) { S.line = v; S.lineFrom = 'custom'; render() } } });
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const g = e.target.closest && e.target.closest('#chart g.b');
  if (!g) { tip.style.display = 'none'; return }
  const x = S._cg[+g.dataset.i], v = x.v[S.k];
  tip.innerHTML = `<b>${esc(day(x.date))}</b> ${x.home === false ? '@' : 'vs'} ${esc(x.opp)}<br><span class="sub">${esc(x.comp)} · ${esc(x.res)} ${esc(x.score)}${x.min != null ? ' · ' + Math.round(x.min) + ' min' : ''}</span><br>
    ${esc(label(S.k))}: <b style="color:${(S.side === 'over' ? v > S.line : v < S.line) ? 'var(--hit)' : v === S.line ? 'var(--push)' : 'var(--miss)'}">${fmt(v)}</b>`;
  tip.style.display = 'block'; tip.style.left = Math.min(innerWidth - 250, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});
start();
</script>
</body>
</html>
