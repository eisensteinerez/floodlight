<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floodlight Lab</title>
<link rel="stylesheet" href="/api/lab/fonts.css">
<style>
/* Floodlight Lab. One page for the site's Research screen, the Discord Activity and the browser link.
   Colours and type follow theme.css ("night match"): Big Shoulders Display, Geist, Geist Mono. */
:root{
  --bg:#06080C; --surface:#0D1118; --surface-2:#151B25; --line:#1F2734; --fg:#F4F6F9; --muted:#8A94A7;
  --accent:#FFC233; --accent-2:#FF9F1A; --accent-ink:#161002; --win:#2BDB8C; --draw:#7F8AA0; --loss:#FF6272;
  --beam:rgba(255,194,51,.13); --beam-2:rgba(80,130,255,.13); --dots:rgba(255,255,255,.05); --hair:rgba(255,255,255,.055); --glass:rgba(9,12,17,.78);
  --shadow-lg:0 2px 0 rgba(0,0,0,.4),0 30px 80px -20px rgba(0,0,0,.8);
  --glow:0 0 0 1px color-mix(in oklab,var(--accent) 55%,transparent),0 8px 30px -8px color-mix(in oklab,var(--accent) 45%,transparent);
  --f-display:"Big Shoulders Display","Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.5,.5,1); --r:16px; --rc:11px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F2EE; --surface:#FFFFFF; --surface-2:#F2F0EA; --line:#E1DED6; --fg:#0C0E13; --muted:#5F6672;
  --accent:#A87400; --accent-2:#C98F00; --accent-ink:#FFFFFF; --win:#128A4B; --draw:#868D9B; --loss:#D43F4C;
  --beam:rgba(201,143,0,.13); --beam-2:rgba(60,110,255,.09); --dots:rgba(12,14,19,.07); --hair:rgba(255,255,255,.9); --glass:rgba(255,255,255,.78);
  --shadow-lg:0 2px 4px rgba(12,14,19,.05),0 24px 60px -18px rgba(12,14,19,.25); color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--fg);font:14px/1.5 var(--f-body);letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  conic-gradient(from 112deg at -4% -12%,transparent 0deg,var(--beam) 16deg,transparent 34deg),
  conic-gradient(from 214deg at 104% -12%,transparent 0deg,var(--beam-2) 16deg,transparent 34deg),
  radial-gradient(1100px 560px at 50% -260px,var(--beam),transparent 70%),
  radial-gradient(circle at 1px 1px,var(--dots) 1px,transparent 1.5px) 0 0/26px 26px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--win)}.down{color:var(--loss)}.flat{color:var(--muted)}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 70px}
.lbl{font:500 9.5px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* top */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:0 -16px;padding:10px 16px;background:var(--glass);
  backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font:900 24px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:8px;background:radial-gradient(circle at 50% 50%,#fff 0 12%,var(--accent) 14% 44%,var(--accent-2) 46%);box-shadow:0 0 22px color-mix(in oklab,var(--accent) 60%,transparent)}
.brand b{color:var(--accent)}
body.embed .brand{display:none}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);font:600 13px/1 var(--f-body);white-space:nowrap;transition:color .2s,background .2s}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.sm button{padding:6px 10px;font-size:12px}
.sports{overflow-x:auto;max-width:100%;scrollbar-width:none}
.search{flex:1 1 240px;display:flex;gap:8px;min-width:0}
.search .box{flex:1;display:flex;align-items:center;gap:8px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:0 13px;transition:border-color .2s,box-shadow .2s}
.search .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 18%,transparent)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;height:42px;font-size:15px}
.go{border:0;border-radius:13px;padding:0 18px;background:var(--accent);color:var(--accent-ink);font:800 17px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;transition:transform .2s var(--spring)}
.go:active{transform:scale(.95)}
.recent{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.recent button,.qf{border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);padding:7px 12px;color:var(--muted);font:600 13px/1 var(--f-body);white-space:nowrap;transition:border-color .18s,color .18s,background .18s,transform .18s var(--spring)}
.recent button{font-size:12px;padding:6px 10px}
.recent button:hover,.qf:hover{color:var(--fg);border-color:color-mix(in oklab,var(--fg) 30%,var(--line))}
.qf:active{transform:scale(.96)}
.qf.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qf .qv{font:600 10.5px/1 var(--f-mono);margin-left:7px;padding:2px 5px;border-radius:5px;background:color-mix(in oklab,var(--accent) 16%,transparent);color:var(--accent)}
.qf.on .qv{background:rgba(0,0,0,.16);color:inherit}
.err{border:1px solid color-mix(in oklab,var(--loss) 45%,transparent);background:color-mix(in oklab,var(--loss) 9%,transparent);border-radius:12px;padding:12px 14px;margin-top:14px}

/* hero */
.hero{--fg:#F4F6F9;--muted:#A9B2C3;--line:rgba(255,255,255,.13);--surface:#0A0D13;--surface-2:#171D28;--win:#2BDB8C;--loss:#FF6272;--draw:#8792A6;--accent:#FFC233;color:var(--fg);
  position:relative;isolation:isolate;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;border-radius:28px;margin:16px 0 14px;padding:24px 26px;
  background:#080A0F;border:1px solid rgba(255,255,255,.1);box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,.08)}
.hero-bg{position:absolute;inset:0;z-index:-3;background:radial-gradient(60% 120% at 0% 50%,color-mix(in oklab,var(--accent) 18%,transparent),transparent 70%)}
.hero-bg img{position:absolute;left:-120px;top:50%;width:560px;height:560px;object-fit:contain;transform:translateY(-50%);filter:blur(84px) saturate(2.6);opacity:.85}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(90deg,transparent 30%,rgba(8,10,15,.82) 78%),radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 1.5px) 0 0/22px 22px}
.ghost{position:absolute;right:-8px;bottom:-.17em;z-index:-1;font:900 210px/.8 var(--f-display);text-transform:uppercase;white-space:nowrap;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.09);pointer-events:none}
.ph{display:flex;align-items:center;gap:20px;flex:1 1 340px;min-width:0}
.face{position:relative;flex:none;width:116px;height:116px;border-radius:50%;padding:4px}
.face::before{content:"";position:absolute;inset:0;border-radius:inherit;background:conic-gradient(from 0deg,var(--accent),transparent 28%,rgba(255,255,255,.75) 50%,transparent 72%,var(--accent));animation:spin 7s linear infinite}
.face::after{content:"";position:absolute;inset:-14px;border-radius:inherit;background:radial-gradient(circle,color-mix(in oklab,var(--accent) 38%,transparent),transparent 68%);z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.face>span{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:inherit;overflow:hidden;border:3px solid #080A0F;background:radial-gradient(circle at 50% 25%,#2A3344,#11161F 75%);font:900 40px/1 var(--f-display);color:var(--accent)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.hero.team .face{border-radius:26px}.hero.team .face img{object-fit:contain;padding:14px}
.ph h1{margin:0;font:900 66px/.84 var(--f-display);letter-spacing:.012em;text-transform:uppercase;text-shadow:0 4px 30px rgba(0,0,0,.5);text-wrap:balance}
.ph p{margin:10px 0 0;font-size:13.5px;color:rgba(255,255,255,.76);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ph p img{width:18px;height:18px;object-fit:contain}
.ph .next b{color:var(--accent)}
.form{display:flex;gap:3px;margin-top:10px}
.form i{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font:700 10px/1 var(--f-mono);font-style:normal;background:rgba(255,255,255,.08);color:var(--draw)}
.form .W{background:color-mix(in oklab,var(--win) 22%,transparent);color:var(--win)}.form .L{background:color-mix(in oklab,var(--loss) 22%,transparent);color:var(--loss)}
.side{display:flex;align-items:center;gap:18px;flex:1 1 420px;min-width:0;flex-wrap:wrap}
.meter{position:relative;flex:none;width:150px;text-align:center}
.meter svg{display:block;width:100%}
.meter path{fill:none;stroke-linecap:round}.meter .t{stroke:rgba(255,255,255,.1);stroke-width:9}.meter .v{stroke-width:9;transition:stroke-dasharray .8s var(--ease)}
.meter .k{stroke:rgba(255,255,255,.35);stroke-width:1.5}.meter .n{stroke:#fff;stroke-width:2.5}.meter .h{fill:#fff}
.meter g{transition:transform .8s var(--ease)}
.meter b{display:block;margin-top:-4px;font:900 34px/1 var(--f-display)}
.meter span{display:block;font:500 9px/1.4 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.meter small{font-weight:700;font-size:12px}
.strip{flex:1 1 260px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.strip>div{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:9px 12px;min-width:0;backdrop-filter:blur(6px)}
.strip span{display:block;font:500 9px/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.strip b{display:block;font:900 30px/1 var(--f-display);margin-top:3px}
.strip small{font-size:11px;color:var(--muted)}.strip small.up{color:var(--win)}.strip small.down{color:var(--loss)}
.spark{grid-column:1/-1}
.spark .sb{position:relative;display:flex;align-items:flex-end;gap:3px;height:38px;margin-top:6px}
.spark .sb i{flex:1;border-radius:3px 3px 1px 1px;background:var(--loss);min-height:3px}.spark .sb i.hit{background:var(--win)}.spark .sb i.push{background:var(--draw)}
.spark .sb u{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(255,255,255,.7)}
@media (max-width:640px){.hero{padding:18px 16px;border-radius:22px}.ph{gap:14px}.face{width:84px;height:84px}.ph h1{font-size:44px}.ghost{font-size:120px}.meter{width:120px;margin:0 auto}}

/* controls */
.stats{position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.linebar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:8px 0 12px}
.lc{display:flex;align-items:center;gap:6px}
.lc button{width:38px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);font-size:18px;color:var(--muted);transition:border-color .2s,color .2s,transform .2s var(--spring)}
.lc button:hover{color:var(--accent);border-color:var(--accent)}.lc button:active{transform:scale(.92)}
.lc input{width:84px;height:40px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);font:800 22px/1 var(--f-display);letter-spacing:.02em;-moz-appearance:textfield}
.lc input::-webkit-inner-spin-button{-webkit-appearance:none}
.lc input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 18%,transparent)}
.ou button.on.o{background:var(--win);color:#04130B}.ou button.on.u{background:var(--loss);color:#1B0508}
.lines{display:flex;gap:6px;flex-wrap:wrap}
.lchip{border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);padding:7px 9px;font:500 12px/1 var(--f-body);color:var(--muted);transition:border-color .18s,box-shadow .18s}
.lchip b{font:600 9.5px/1 var(--f-mono);letter-spacing:.06em;margin-right:5px}.lchip span{color:var(--fg);font-weight:700}
.lchip:hover{border-color:var(--fg)}
.lchip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 4px 16px -6px color-mix(in oklab,var(--accent) 60%,transparent)}
.sum{flex-basis:100%;margin:0;color:var(--muted);font-size:13px}.sum b{color:var(--fg)}

/* tiles and dials */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--line);border-radius:var(--r);padding:14px 8px 12px;
  background:linear-gradient(180deg,color-mix(in oklab,var(--fg) 2.5%,var(--surface)),var(--surface));box-shadow:inset 0 1px 0 var(--hair);transition:transform .22s var(--ease),border-color .2s,box-shadow .25s}
.tile:hover{transform:translateY(-2px);border-color:color-mix(in oklab,var(--fg) 26%,var(--line))}
.tile.on{border-color:var(--accent);box-shadow:var(--glow),inset 0 1px 0 var(--hair)}
.tile.hi{background:linear-gradient(180deg,color-mix(in oklab,var(--win) 14%,var(--surface)),color-mix(in oklab,var(--win) 4%,var(--surface)))}
.tile.lo{background:linear-gradient(180deg,color-mix(in oklab,var(--loss) 13%,var(--surface)),color-mix(in oklab,var(--loss) 4%,var(--surface)))}
.tile>span:first-child{font:500 9.5px/1.2 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{position:relative;width:86px;height:86px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring circle{fill:none;stroke-width:7;stroke-linecap:butt;stroke:var(--loss)}
.ring circle.hit{stroke:var(--win)}.ring circle.push{stroke:var(--draw)}
.ring circle.trk{stroke:color-mix(in oklab,var(--fg) 9%,transparent)}.ring circle.arc{stroke:var(--accent);stroke-linecap:round}
.tile.hi .ring circle.arc{stroke:var(--win)}.tile.lo .ring circle.arc{stroke:var(--loss)}
.ring b{position:relative;font:900 30px/.95 var(--f-display)}
.tile small{font:500 11px/1 var(--f-mono);color:var(--muted)}

/* cards */
.card{position:relative;border-radius:20px;padding:16px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in oklab,var(--fg) 2.5%,var(--surface)),var(--surface));box-shadow:inset 0 1px 0 var(--hair)}
.chh{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;min-height:26px}
.chh>b{font:800 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.chh>span{color:var(--muted);font-size:12px}
.key{margin-left:auto;display:flex;align-items:center;gap:6px;font:500 11px/1 var(--f-body);color:var(--muted)}
.key i{width:9px;height:9px;border-radius:3px;margin-left:8px;background:var(--loss)}
.key i.hit{background:var(--win)}.key i.avg{width:16px;height:2px;background:var(--accent)}
.key em{font-style:normal}
.hint{margin:10px 0 0;color:var(--muted);font-size:11.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}

/* chart */
.chart{margin-top:14px}
.bars{position:relative;display:flex;gap:clamp(2px,.8vw,10px);height:240px;margin:30px 0 44px;padding:0 50px 0 30px}
.zn{position:absolute;left:0;right:0;pointer-events:none}
.zn.hit{background:linear-gradient(0deg,color-mix(in oklab,var(--win) 9%,transparent),transparent 70%)}
.zn.miss{background:linear-gradient(180deg,color-mix(in oklab,var(--loss) 8%,transparent),transparent 70%)}
.gl{position:absolute;left:0;right:0;border-top:1px solid color-mix(in oklab,var(--line) 70%,transparent);pointer-events:none}
.gl span{position:absolute;left:0;bottom:3px;font:500 9.5px/1 var(--f-mono);color:var(--muted)}
.gl.zero{border-top-color:color-mix(in oklab,var(--fg) 30%,transparent)}
.b{position:relative;flex:1;min-width:0;outline:0}
.b::before{content:"";position:absolute;inset:-22px -3px -40px;border-radius:10px;background:color-mix(in oklab,var(--fg) 6%,transparent);opacity:0;transition:opacity .15s}
.b:hover::before{opacity:1}
.b i{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:46px;border-radius:5px 5px 1px 1px;background:linear-gradient(180deg,var(--loss),color-mix(in oklab,var(--loss) 62%,var(--surface)));transition:opacity .15s,filter .15s}
.b.neg i{border-radius:1px 1px 5px 5px}
.b.hit i{background:linear-gradient(180deg,var(--win),color-mix(in oklab,var(--win) 58%,var(--surface)));box-shadow:0 0 22px -6px color-mix(in oklab,var(--win) 70%,transparent)}
.b.push i{background:linear-gradient(180deg,var(--draw),color-mix(in oklab,var(--draw) 60%,var(--surface)))}
.b em{position:absolute;left:50%;transform:translateX(-50%);z-index:3;font:600 11px/1 var(--f-mono);font-style:normal;white-space:nowrap;text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 6px var(--surface)}
.bars:hover .b:not(:hover) i{opacity:.38}.b:hover i{filter:brightness(1.12)}
.bl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:7px;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 9.5px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.bl small{font-size:8.5px;opacity:.8}
.bl b{font-size:8.5px}.bl b.W{color:var(--win)}.bl b.L{color:var(--loss)}
.chart.fresh .b i{transform-origin:50% 100%;animation:grow .7s var(--ease) both;animation-delay:calc(var(--i)*24ms)}
.chart.fresh .b em{animation:fade .4s ease both;animation-delay:calc(var(--i)*24ms + .35s)}
@keyframes grow{from{transform:translateX(-50%) scaleY(0)}}@keyframes fade{from{opacity:0}}
.roll{position:absolute;left:30px;top:0;width:calc(100% - 80px);height:100%;overflow:visible;pointer-events:none}
.roll polyline{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.ln{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--fg);z-index:4;cursor:ns-resize;touch-action:none}
.ln::before{content:"";position:absolute;left:0;right:0;top:-14px;height:28px}
.ln span{position:absolute;right:0;top:-13px;display:flex;align-items:center;gap:5px;background:var(--fg);color:var(--bg);font:700 12px/1 var(--f-mono);padding:6px 7px 6px 9px;border-radius:8px;box-shadow:0 6px 18px -6px rgba(0,0,0,.6);transition:transform .15s var(--spring),background .15s}
.ln span svg{width:8px;height:11px;opacity:.6}
.ln.fixed{cursor:default}
.ln:not(.fixed):hover span,html.dragging .ln span{transform:scale(1.1);background:var(--accent);color:var(--accent-ink)}
html.dragging,html.dragging *{cursor:ns-resize!important;user-select:none;-webkit-user-select:none}
.chart.dense .b em,.chart.dense .bl small{display:none}
@media (max-width:640px){.bars{height:190px;padding:0 44px 0 22px}.roll{left:22px;width:calc(100% - 66px)}.key{margin-left:0;flex-basis:100%}.key i:first-child{margin-left:0}.chart.mid .b em{display:none}}

/* the read */
.read{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px 26px;margin-top:12px;overflow:hidden}
.read::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(70% 120% at 0% 0%,color-mix(in oklab,var(--muted) 12%,transparent),transparent 70%)}
.read.pos::before{background:radial-gradient(70% 120% at 0% 0%,color-mix(in oklab,var(--win) 20%,transparent),transparent 70%)}
.read.neg::before{background:radial-gradient(70% 120% at 0% 0%,color-mix(in oklab,var(--loss) 18%,transparent),transparent 70%)}
.read>*{position:relative}
.read-v>span{font:500 9.5px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.read-v strong{display:block;font:900 44px/.9 var(--f-display);text-transform:uppercase;letter-spacing:.015em;margin:8px 0 14px}
.read.pos strong{color:var(--win)}.read.neg strong{color:var(--loss)}
.read-n{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.read-n div{border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:color-mix(in oklab,var(--bg) 50%,transparent)}
.read-n b{display:block;font:900 26px/1 var(--f-display)}.read-n small{font-size:10.5px;color:var(--muted)}
.read-v p{margin:12px 0 0;color:var(--muted);font-size:12px}
.read-l{list-style:none;margin:0;padding:0;display:grid;gap:9px;align-content:center}
.read-l li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:color-mix(in oklab,var(--fg) 82%,var(--muted))}
.read-l li b{color:var(--fg)}
.read-l i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--draw)}
.read-l .up i{background:var(--win);box-shadow:0 0 10px var(--win)}.read-l .down i{background:var(--loss);box-shadow:0 0 10px var(--loss)}
@media (max-width:820px){.read{grid-template-columns:1fr}.read-v strong{font-size:36px}}

/* ladder and distribution */
.ladr{margin-left:auto}.ladr b{font:800 22px/1 var(--f-display);color:var(--fg)}
.ladp{position:relative;height:150px;margin-top:12px;cursor:crosshair;border-bottom:1px solid var(--line);touch-action:none}
.ladp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ladl{fill:none;stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.lad50{position:absolute;left:0;right:0;top:50%;border-top:1px dashed color-mix(in oklab,var(--muted) 55%,transparent);pointer-events:none}
.lad50 span{position:absolute;right:0;bottom:3px;font:500 9.5px/1 var(--f-mono);color:var(--muted)}
.ladc,.ladh{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--fg);pointer-events:none}
.ladc i,.ladh i{position:absolute;left:-6.5px;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 3px var(--surface)}
.ladh{border-left:1.5px dashed var(--accent)}.ladh i{background:var(--accent);box-shadow:0 0 0 3px var(--surface),0 0 16px var(--accent)}
.ladm{position:absolute;bottom:-1px;width:1px;height:12px;background:var(--muted);padding:0;border:0}
.ladm span{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font:600 8.5px/1 var(--f-mono);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:3px 4px}
.ladx{display:flex;justify-content:space-between;margin-top:6px;font:500 10px/1 var(--f-mono);color:var(--muted)}
.distp{position:relative;height:150px;margin-top:12px;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;align-items:end;border-bottom:1px solid var(--line)}
.db{position:relative;height:100%;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;outline:0}
.db>i{display:block;width:100%;max-width:30px;flex:none;border-radius:4px 4px 1px 1px;background:var(--loss);transition:opacity .15s}
.db.hit>i{background:var(--win)}.db.push>i{background:var(--draw)}
.distp.units .db>i{height:17px;border-radius:4px;background:var(--loss)}.distp.units .db>i.hit{background:var(--win)}.distp.units .db>i.push{background:var(--draw)}
.distp:hover .db:not(:hover)>i{opacity:.4}
.distl{position:absolute;top:-4px;bottom:0;width:0;border-left:2px dashed var(--fg);pointer-events:none}
.distl span{position:absolute;top:0;left:50%;transform:translate(-50%,-60%);background:var(--fg);color:var(--bg);font:700 10.5px/1 var(--f-mono);padding:4px 6px;border-radius:6px}

/* season map and duels */
.map{margin-top:12px}
.mapg{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:4px;margin-top:14px}
.mapg.few{grid-template-columns:repeat(auto-fill,minmax(34px,1fr))}
@media (max-width:820px){.mapg{grid-template-columns:repeat(15,minmax(0,1fr))}}
.mc{position:relative;aspect-ratio:1;border-radius:6px;display:grid;place-items:center;background:color-mix(in oklab,var(--loss) calc(var(--a)*100%),var(--surface-2));outline:0;transition:transform .15s var(--spring)}
.mc.hit{background:color-mix(in oklab,var(--win) calc(var(--a)*100%),var(--surface-2))}.mc.push{background:var(--draw)}
.mc:hover{transform:scale(1.25);z-index:2}
.mc em{font:600 9px/1 var(--f-mono);font-style:normal;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.mapg:not(.few) .mc em{display:none}
.scale i{background:color-mix(in oklab,var(--loss) calc(var(--a)*100%),var(--surface-2))!important;margin-left:2px}
.scale i.hit{background:color-mix(in oklab,var(--win) calc(var(--a)*100%),var(--surface-2))!important}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.du span{font:500 9.5px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.du b{display:block;font:900 44px/1 var(--f-display);margin:4px 0}
.du.hi b{color:var(--win)}.du.lo b{color:var(--loss)}
.du small{font:500 11px/1 var(--f-mono);color:var(--muted)}
.du.r{text-align:right}
.dvs{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:90px}
.dvs i{font:800 14px/1 var(--f-display);font-style:normal;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.dbar{display:flex;width:100%;height:7px;border-radius:9px;overflow:hidden;gap:2px}
.dbar u{background:var(--draw)}.dbar u.hi{background:var(--win)}.dbar u.lo{background:var(--loss)}
.dvs em{font:500 10px/1 var(--f-mono);font-style:normal;color:var(--muted)}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.filters label{display:grid;gap:5px;font:500 9.5px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.filters select{height:36px;border:1px solid var(--line);border-radius:var(--rc);background:var(--surface);padding:0 10px;font:500 13px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--fg);max-width:210px}
.filters select:hover{border-color:color-mix(in oklab,var(--fg) 30%,var(--line))}

/* splits */
.split{display:grid;grid-template-columns:118px 1fr 50px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed color-mix(in oklab,var(--line) 80%,transparent)}
.split:last-child{border-bottom:0}
.split .n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split .track{height:8px;border-radius:9px;background:color-mix(in oklab,var(--fg) 8%,transparent);overflow:hidden}
.split .track i{display:block;height:100%;border-radius:9px}
.split .p{text-align:right;font:800 18px/1 var(--f-display)}
.split .s{font:500 10.5px/1 var(--f-mono);color:var(--muted);grid-column:2/4;margin-top:-5px}

/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--surface);font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th[data-sort]{cursor:pointer}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px;border-bottom:1px solid color-mix(in oklab,var(--line) 60%,transparent);text-align:right;white-space:nowrap}
.tbl tbody tr:hover td{background:color-mix(in oklab,var(--accent) 7%,transparent)}
.tbl tr.sel td{background:color-mix(in oklab,var(--accent) 10%,transparent)}
.tbl th.fc,.tbl td.fc{background:color-mix(in oklab,var(--accent) 9%,var(--surface))}
.scroll{overflow:auto;max-height:560px;border-radius:10px;margin-top:10px}
.heat{display:inline-block;min-width:46px;text-align:center;padding:3px 6px;border-radius:7px;font:600 12px/1 var(--f-mono)}
.cell-h{color:var(--win);font-weight:700}.cell-m{color:var(--loss)}
.sub{color:var(--muted);font-size:12px}

/* team extras */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sgrid>div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sgrid .l{font-size:11px;color:var(--muted)}.sgrid .v{font:800 22px/1.1 var(--f-display)}.sgrid .rk{font:600 10.5px/1 var(--f-mono);color:var(--accent)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;max-height:420px;overflow:auto;margin-top:10px}
.rp{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:7px 9px;transition:border-color .18s,transform .18s var(--spring)}
.rp:hover{border-color:var(--accent);transform:translateY(-1px)}
.rp .av{width:36px;height:36px;border-radius:50%;background:color-mix(in oklab,var(--fg) 10%,transparent);overflow:hidden;flex:none}
.rp .av img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.rp .rn{display:flex;flex-direction:column;min-width:0}.rp b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rp small{color:var(--muted);font-size:11px}
.rp em{color:var(--loss);font-style:normal}

/* board */
.brow{display:grid;grid-template-columns:38px 1.6fr 1fr 70px 70px 70px 64px;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid color-mix(in oklab,var(--line) 60%,transparent);border-radius:10px;cursor:pointer;transition:background .15s}
.brow:hover{background:color-mix(in oklab,var(--accent) 7%,transparent)}
.brow .rk{font:900 24px/1 var(--f-display);color:var(--muted);text-align:center}.brow.top3 .rk{color:var(--accent)}
.brow .nm{font-weight:700}
.sidec{font:700 11px/1 var(--f-mono);padding:4px 7px;border-radius:6px}
.sidec.over{background:color-mix(in oklab,var(--win) 18%,transparent);color:var(--win)}.sidec.under{background:color-mix(in oklab,var(--loss) 18%,transparent);color:var(--loss)}
@media (max-width:700px){.brow{grid-template-columns:30px 1fr 64px 60px}.brow .hide-s{display:none}}

/* states */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty h2{font:900 44px/.95 var(--f-display);text-transform:uppercase;color:var(--fg);margin:14px 0 8px}
.beam{width:120px;height:120px;margin:0 auto;border-radius:50%;background:radial-gradient(circle,color-mix(in oklab,var(--accent) 60%,transparent),color-mix(in oklab,var(--accent) 6%,transparent) 60%,transparent 70%);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
.skel{border-radius:20px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:26px}
.tip{position:fixed;z-index:60;pointer-events:none;display:none;min-width:170px;max-width:260px;padding:10px 12px;border-radius:12px;background:color-mix(in oklab,var(--surface) 94%,transparent);border:1px solid color-mix(in oklab,var(--fg) 18%,var(--line));
  box-shadow:var(--shadow-lg);backdrop-filter:blur(14px);font-size:12.5px}
.tip small{display:block;color:var(--muted);font:500 10.5px/1.3 var(--f-mono)}.tip strong{display:block;font-size:13px}
.tip .tv b{font:800 26px/1 var(--f-display);margin-right:3px}.tip .tv{color:var(--muted)}
.tip .hit{color:var(--win);font-weight:600}.tip .miss{color:var(--loss);font-weight:600}.tip .push{color:var(--muted)}
html.dragging .tip{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><i></i><span>Floodlight <b>Lab</b></span></div>
    <div class="seg" id="tabs"><button data-t="player" class="on">Player</button><button data-t="team">Team</button><button data-t="board">Hot props</button></div>
    <div class="seg sm sports" id="sports"></div>
    <form class="search" id="sf">
      <label class="box"><span style="color:var(--muted)">⌕</span><input id="q" placeholder="Search a player, e.g. Jayson Tatum" autocomplete="off"></label>
      <button class="go">Go</button>
    </form>
  </div>
  <div class="recent" id="recent"></div>
  <div id="msg"></div>
  <div id="view"></div>
  <div class="foot">Hit rates describe the past, not the next game. Bet only what you can afford to lose.<br>Lines from PrizePicks, Sleeper and DraftKings · stats from ESPN, MLB StatsAPI and FotMob</div>
</div>
<div class="tip" id="tip"></div>
<script>
'use strict';
const APP_ID = '__DISCORD_APP_ID__';
const QS = new URLSearchParams(location.search);
const IN_DISCORD = QS.has('frame_id');
if (QS.get('theme') === 'light') document.documentElement.dataset.theme = 'light';
if (QS.get('embed')) document.body.classList.add('embed');
const SPORTS = [['nba','NBA'],['wnba','WNBA'],['nfl','NFL'],['nhl','NHL'],['mlb','MLB'],['soccer','Soccer']];
const HERO = { nba:['pts','reb','ast','3pm','pra'], wnba:['pts','reb','ast','3pm','pra'], nfl:['pyd','ryd','reyd','rec','td'], nhl:['goals','ast','pts','sog','toi'],
  mlb:['h','tb','hr','rbi','pk'], soccer:['goals','assists','shots','sot','rating'] };
const HERO_T = ['pf','pa','tot','mar','win'];
const YES = new Set(['win','btts','cs','dd','g1']);
const BK = { prizepicks:'PP', sleeper:'SL', DraftKings:'DK' }, BOOK = { prizepicks:'PrizePicks', sleeper:'Sleeper' };
const S = { tab:'player', sport:'nba', pass:'', p:null, k:null, line:null, side:'over', range:'l10', opp:'', venue:'all', comp:'all', res:'all', minMin:0,
  sort:{ col:'l10', dir:-1 }, board:{}, drag:null, chartKey:'' };
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) } catch { return d } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const norm = s => String(s || '').normalize('NFKD').replace(/[^\w ]/g, '').toLowerCase().trim();
const fmt = v => v == null ? '–' : Number.isInteger(v) ? String(v) : Math.abs(v) >= 1 ? (+v.toFixed(1)).toString() : (+v.toFixed(2)).toString();
const f1 = v => v == null ? '–' : fmt(Math.round(v * 10) / 10);
const pc = x => x == null ? '–' : Math.round(x * 100) + '%';
const avg = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
const pcls = x => x == null ? '' : x >= .6 ? 'hi' : x <= .4 ? 'lo' : '';
const hitCls = (v, line, side) => v === line ? 'push' : (side === 'over' ? v > line : v < line) ? 'hit' : 'miss';
const heatBg = x => x == null ? 'transparent' : x >= .5 ? `color-mix(in oklab,var(--win) ${Math.round(12 + (x - .5) * 110)}%,transparent)` : `color-mix(in oklab,var(--loss) ${Math.round(12 + (.5 - x) * 110)}%,transparent)`;
const american = p => p == null || p <= 0 || p >= 1 ? '–' : p >= .5 ? '−' + Math.round(100 * p / (1 - p)) : '+' + Math.round(100 * (1 - p) / p);
const quant = (xs, q) => { if (!xs.length) return null; const a = [...xs].sort((x, y) => x - y), i = (a.length - 1) * q, lo = Math.floor(i); return a[lo] + (a[Math.min(a.length - 1, lo + 1)] - a[lo]) * (i - lo) };
const nice = x => { const p = 10 ** Math.floor(Math.log10(x || 1)), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p };
const when = iso => new Date(iso).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const day = iso => new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const dayLong = iso => new Date(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
const tipAttr = html => ` data-tip="${esc(html)}" tabindex="0"`;

/* ---------- Discord: the Embedded App handshake (what @discord/embedded-app-sdk sends first) ---------- */
if (IN_DISCORD) {
  const src = window.parent.opener ?? window.parent;
  try { src.postMessage([0, { v: 1, encoding: 'json', client_id: APP_ID, frame_id: QS.get('frame_id') }], document.referrer || '*') } catch (e) { console.warn('handshake', e) }
}

/* ---------- data ---------- */
async function api(path) {
  const r = await fetch('/api/lab/' + path, { headers: S.pass ? { 'X-Lab-Pass': S.pass } : {} });
  const d = await r.json().catch(() => ({ error: 'The server sent something unexpected.' }));
  if (!r.ok) { const e = new Error(d.error || 'Something went wrong.'); e.need = d.need; throw e }
  return d;
}
async function start() {
  let want = { player: QS.get('player') || '', team: QS.get('team') || '', sport: QS.get('sport') || '' };
  try {
    const q = IN_DISCORD ? `channel_id=${encodeURIComponent(QS.get('channel_id') || '')}&instance_id=${encodeURIComponent(QS.get('instance_id') || '')}`
      : (QS.get('t') ? 't=' + encodeURIComponent(QS.get('t')) : '') + (want.player ? '&player=' + encodeURIComponent(want.player) : '') + (want.team ? '&team=' + encodeURIComponent(want.team) : '') + (want.sport ? '&sport=' + want.sport : '');
    const s = await api('session?' + q); S.pass = s.token; want = { player: s.player || want.player, team: s.team || want.team, sport: s.sport || want.sport };
  } catch (e) { return gate(e.message) }
  S.sport = SPORTS.some(x => x[0] === want.sport) ? want.sport : store.get('lab.sport', 'nba');
  if (['board', 'team'].includes(QS.get('tab'))) S.tab = QS.get('tab');
  drawSports(); drawRecent(); tabs();
  if (want.team) load(want.team, 'team');
  else if (want.player) load(want.player, 'player', { stat: QS.get('stat') || '', line: QS.get('line') });
  else render();
}
function gate(m) {
  $('#view').innerHTML = `<div class="empty"><div class="beam"></div><h2>The Lab is locked</h2><p>${esc(m)}</p></div>`;
  for (const id of ['#sf', '#tabs', '#sports']) $(id).classList.add('hidden');
}
const sportName = () => (SPORTS.find(s => s[0] === S.sport) || [, ''])[1];
function drawSports() { $('#sports').innerHTML = SPORTS.map(([k, l]) => `<button data-sp="${k}" class="${k === S.sport ? 'on' : ''}">${l}</button>`).join('') }
function home() {
  const team = S.tab === 'team';
  $('#q').placeholder = team ? 'Search a team, e.g. Celtics or Arsenal' : 'Search a player, e.g. Jayson Tatum';
  $('#view').innerHTML = `<div class="empty"><div class="beam"></div><h2>${team ? 'Which team?' : 'Who are we researching?'}</h2>
    <p>${team ? `Search any ${esc(sportName())} team for scores, totals, spreads covered, win rates, splits, season stats, roster and the next game's lines.`
      : `Search any ${esc(sportName())} player for every stat, hit rates at any line, the read, trends, splits and the full game log.`}</p>
    <p>Or open <b style="color:var(--accent)">Hot props</b> for today's lines ranked by how often they've hit.</p></div>`;
}
let loadSeq = 0;
async function load(name, kind, o = {}) {
  kind = kind || (S.tab === 'team' ? 'team' : 'player');
  const seq = ++loadSeq;
  S.tab = kind; tabs(); drawSports();
  $('#q').value = name; $('#msg').innerHTML = '';
  $('#view').innerHTML = `<div class="skel" style="height:190px;margin-top:16px"></div><div class="skel" style="height:44px;margin-top:12px"></div><div class="tiles" style="margin-top:12px">${'<div class="skel" style="height:150px"></div>'.repeat(6)}</div><div class="skel" style="height:340px;margin-top:12px"></div>`;
  try {
    const p = await api(`${kind}?sport=${S.sport}&name=${encodeURIComponent(name)}${o.stat ? '&stat=' + encodeURIComponent(o.stat) : ''}`);
    if (seq !== loadSeq) return;
    p.kind = kind; S.p = p; S.venue = 'all'; S.comp = 'all'; S.res = 'all'; S.minMin = 0; S.range = 'l10';
    const nx = p.next?.opp; S.opp = nx ? (p.games.find(g => sameOpp(g, nx))?.opp || nx) : '';
    const rec = store.get('lab.recent', []).filter(r => !(r.n === p.name && r.s === p.sport));
    rec.unshift({ n: p.name, s: p.sport, t: kind }); store.set('lab.recent', rec.slice(0, 8)); drawRecent();

  const rows = b.rows || [], heat = x => `<span class="heat num" style="background:${heatBg(x)}">${pc(x)}</span>`;
  $('#view').innerHTML = `<div class="card" style="margin-top:16px"><div class="chh"><b>Today's ${esc(sportName())} props by hit rate</b>${b.checked ? `<span class="num">${b.checked} lines checked · PrizePicks and Sleeper</span>` : ''}</div>
    ${b.error ? `<div class="err">${esc(b.error)}</div>` : !rows.length ? `<p class="sub">No ${esc(sportName())} lines posted right now.</p>` : ''}
    ${rows.map((r, i) => `<div class="brow${i < 3 ? ' top3' : ''}" data-n="${esc(r.player)}" data-k="${r.k}" data-l="${r.line}"><div class="rk">${i + 1}</div>
      <div><div class="nm">${esc(r.player)}</div><div class="sub">${esc([r.team, r.opp && 'vs ' + r.opp].filter(Boolean).join(' · '))}</div></div>
      <div><span class="sidec ${r.side}">${r.side === 'over' ? 'O' : 'U'} ${fmt(r.line)}</span> <span class="sub">${esc(r.label)}</span></div>
      <div class="hide-s">${heat(r.l5)}<div class="sub">L5</div></div><div>${heat(r.l10)}<div class="sub">L10</div></div><div class="hide-s">${heat(r.l20)}<div class="sub">L20</div></div>
      <div class="num" style="text-align:right"><b>${f1(r.avg)}</b><div class="sub">avg</div></div></div>`).join('')}</div>`;
}
function tabs() { document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab)) }

/* ---------- events ---------- */
$('#sf').addEventListener('submit', e => { e.preventDefault(); const n = $('#q').value.trim(); if (n) load(n, S.tab === 'team' ? 'team' : 'player') });
$('#sports').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.sport = b.dataset.sp; store.set('lab.sport', S.sport); drawSports(); if (S.tab !== 'board') { S.p = null } render() });
$('#tabs').addEventListener('click', e => { const t = e.target.closest('button'); if (!t) return; S.tab = t.dataset.t; tabs(); $('#msg').innerHTML = ''; render() });
$('#recent').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.sport = b.dataset.s; load(b.dataset.n, b.dataset.t) });
const setLine = v => { S.line = Math.round(v * 100) / 100; S.lineFrom = 'custom'; render() };
document.addEventListener('click', e => {
  const t = e.target;
  const br = t.closest('.brow'); if (br) return load(br.dataset.n, 'player', { stat: br.dataset.k, line: br.dataset.l });
  const rp = t.closest('[data-player]'); if (rp) { scrollTo({ top: 0, behavior: 'smooth' }); return load(rp.dataset.player, 'player') }
  const kk = t.closest('[data-k]'); if (kk) return pickStat(kk.dataset.k);
  const st = t.closest('[data-step]'); if (st) return setLine(S.line + .5 * +st.dataset.step);
  const sd = t.closest('[data-side]'); if (sd) { S.side = sd.dataset.side; return render() }
  const rg = t.closest('[data-r]'); if (rg) { S.range = rg.dataset.r; render(); if (S.range === 'h2h' && !S.opp) document.querySelector('[data-f="opp"]')?.focus(); return }
  const bk = t.closest('[data-line]'); if (bk) return setLine(+bk.dataset.line);
  const so = t.closest('[data-sort]'); if (so) { const c = so.dataset.sort; S.sort = { col: c, dir: S.sort.col === c ? -S.sort.dir : (c === 'l' ? 1 : -1) }; return render() }
  const lp = t.closest('#ladp'); if (lp && S.ladder) { const L = ladAt(e, lp); if (L) setLine(L[0]) }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'line') { const v = parseFloat(t.value); if (!isNaN(v)) setLine(v); return }
  if (t.dataset.f) { const f = t.dataset.f; S[f] = f === 'minMin' ? +t.value : t.value; if (f === 'opp') S.range = t.value ? 'h2h' : (S.range === 'h2h' ? 'l10' : S.range); render() }
});
// hover cards
const tip = $('#tip');
function showTip(el, x, y) { tip.innerHTML = el.dataset.tip; tip.style.display = 'block'; const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + 'px'; tip.style.top = (y + h + 24 > innerHeight ? Math.max(8, y - h - 14) : y + 16) + 'px' }
document.addEventListener('pointermove', e => {
  if (S.drag) return;
  const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.style.display = 'none';
  const lp = e.target.closest && e.target.closest('#ladp'), h = $('#ladh');
  if (lp && S.ladder) { const L = ladAt(e, lp); if (L && h) { const { x0, x1, side } = S.ladder; h.hidden = false; h.style.left = (L[0] - x0) / (x1 - x0) * 100 + '%'; h.firstChild.style.top = (1 - L[1]) * 100 + '%';
    $('#ladr').innerHTML = `<b class="num">${pc(L[1])}</b> ${side.toLowerCase()} ${lineTxt(L[0])} · ${L[2]} of ${L[3]}` } }
  else if (h && !h.hidden) { h.hidden = true; const cur = rate(inRange(pool(S.k), S.range), S.k, S.line, S.side); $('#ladr').innerHTML = `<b class="num">${pc(cur.pct)}</b> ${S.side} ${lineTxt(S.line)} · ${cur.hit} of ${cur.n - cur.push}` }
});
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top) } });
document.addEventListener('focusout', () => { tip.style.display = 'none' });
function ladAt(e, lp) { const r = lp.getBoundingClientRect(), { pts, x0, x1 } = S.ladder, L = x0 + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (x1 - x0); return pts.reduce((a, b) => Math.abs(b[0] - L) < Math.abs(a[0] - L) ? b : a) }
// drag the line on the chart: the bars, dials, the read and the tables follow as it moves
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('[data-drag]'); if (!h) return;
  const bars = h.parentElement; S.drag = { max: +bars.dataset.max, min: +bars.dataset.min, raf: 0, y: e.clientY };
  document.documentElement.classList.add('dragging'); tip.style.display = 'none'; e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!S.drag) return; S.drag.y = e.clientY;
  if (S.drag.raf) return;
  S.drag.raf = requestAnimationFrame(() => { if (!S.drag) return; S.drag.raf = 0;
    const bars = document.querySelector('.bars'); if (!bars) return; const r = bars.getBoundingClientRect();
    const v = S.drag.min + (1 - Math.max(0, Math.min(1, (S.drag.y - r.top) / r.height))) * (S.drag.max - S.drag.min), snapped = Math.floor(v) + .5;
    if (snapped !== S.line) { S.line = snapped; S.lineFrom = 'custom'; const y = scrollY; render(); scrollTo(0, y) } });
});
const endDrag = () => { if (!S.drag) return; cancelAnimationFrame(S.drag.raf); S.drag = null; document.documentElement.classList.remove('dragging'); render() };
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
start();
</script>
</body>
