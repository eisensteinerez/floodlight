<!doctype html>
<html lang="en" data-scheme="dark" data-theme="night-match">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floodlight Lab</title>
<script>
/* The saved theme, set before anything is drawn. Unknown or missing: Night Match. */
(function(){var T={'night-match':'dark','team-colors':'light','members-club':'dark','aurora-glass':'dark','chrono':'light','stadium-gold':'dark'},t=new URLSearchParams(location.search).get('theme');
try{if(!T[t])t=localStorage.getItem('floodlight-theme')}catch(e){}if(!T[t])t='night-match';var r=document.documentElement;r.dataset.theme=t;r.dataset.scheme=T[t];
document.write('<link rel="stylesheet" id="flFonts" href="/api/lab/fonts.css?theme='+t+'">')})();
</script>
<style>
/* Floodlight Lab. One page for the site's Lab, the Discord Activity and the browser link.
   Layout and behaviour live here. Colours, type, corners and shadows come from the theme: tokens.css, heat.css and labskin.css, loaded after this block. */
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--fg);font:14px/1.5 var(--f-body);letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 1px 1px,var(--dots) 1px,transparent 1.5px) 0 0/26px 26px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-ctl)}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--win)}.down{color:var(--loss)}.flat{color:var(--muted)}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 70px}
.lbl{font:500 12px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* top */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:0 -16px;padding:10px 16px;background:var(--glass);
  backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font:900 24px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent-fill)}
.brand b{color:var(--accent)}
body.embed .brand{display:none}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:var(--r-ctl);color:var(--muted);font:600 13px/1 var(--f-body);white-space:nowrap;transition:color .2s,background .2s}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--accent-fill);color:var(--accent-ink)}
.seg.sm button{padding:6px 10px;font-size:12px}
.sports{overflow-x:auto;max-width:100%;scrollbar-width:none}
.search{flex:1 1 240px;display:flex;gap:8px;min-width:0}
.search .box{flex:1;display:flex;align-items:center;gap:8px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:0 13px;transition:border-color .2s,box-shadow .2s}
.search .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 18%,transparent)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;height:42px;font-size:15px}
.go{border:0;border-radius:var(--r-card);padding:0 18px;background:var(--accent-fill);color:var(--accent-ink);font:800 17px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;transition:transform .2s var(--spring)}
.go:active{transform:scale(.95)}
.recent{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.recent button,.qf{border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);padding:7px 12px;color:var(--muted);font:600 13px/1 var(--f-body);white-space:nowrap;transition:border-color .18s,color .18s,background .18s,transform .18s var(--spring)}
.recent button{font-size:12px;padding:6px 10px}
.recent button:hover,.qf:hover{color:var(--fg);border-color:color-mix(in oklab,var(--fg) 30%,var(--line))}
.qf:active{transform:scale(.96)}
.qf.on{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.qf .qv{font:600 12px/1 var(--f-mono);margin-left:7px;padding:2px 5px;border-radius:var(--r-ctl);background:color-mix(in oklab,var(--accent) 16%,transparent);color:var(--accent)}
.qf.on .qv{background:rgba(0,0,0,.16);color:inherit}
.err{border:1px solid color-mix(in oklab,var(--loss) 45%,transparent);background:color-mix(in oklab,var(--loss) 9%,transparent);border-radius:var(--r-card);padding:12px 14px;margin-top:14px}

/* hero */
.hero{color:var(--fg);
  position:relative;isolation:isolate;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;border-radius:var(--r-card);margin:16px 0 14px;padding:24px 26px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-card)}
.hero-bg{position:absolute;inset:0;z-index:-3;background:none}
.hero-bg img{position:absolute;left:-120px;top:50%;width:560px;height:560px;object-fit:contain;transform:translateY(-50%);filter:blur(84px) saturate(2.6);opacity:.85}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 1.5px) 0 0/22px 22px}
.ghost{position:absolute;right:-8px;bottom:-.17em;z-index:-1;font:900 210px/.8 var(--f-display);text-transform:uppercase;white-space:nowrap;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.09);pointer-events:none}
.ph{display:flex;align-items:center;gap:20px;flex:1 1 340px;min-width:0}
.face{position:relative;flex:none;width:116px;height:116px;border-radius:50%;padding:4px}
.face::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--accent);animation:spin 7s linear infinite}
.face::after{content:"";position:absolute;inset:-14px;border-radius:inherit;background:none;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.face>span{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:inherit;overflow:hidden;border:3px solid var(--bg);background:var(--surface-2);font:900 40px/1 var(--f-display);color:var(--accent)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.hero.team .face{border-radius:var(--r-card)}.hero.team .face img{object-fit:contain;padding:14px}
.ph h1{margin:0;font:900 66px/.84 var(--f-display);letter-spacing:.012em;text-transform:uppercase;text-shadow:none;text-wrap:balance}
.ph p{margin:10px 0 0;font-size:13.5px;color:rgba(255,255,255,.76);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ph p img{width:18px;height:18px;object-fit:contain}
.ph p.tcheck{display:block;max-width:60ch;padding:8px 12px;border-radius:var(--r-ctl);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);color:#fff;line-height:1.4}
.tflag{color:var(--warn,#f0b43c)}
.ph .next b{color:var(--accent)}
.form{display:flex;gap:3px;margin-top:10px}
.form i{width:19px;height:19px;border-radius:var(--r-ctl);display:grid;place-items:center;font:700 12px/1 var(--f-mono);font-style:normal;background:rgba(255,255,255,.08);color:var(--draw)}
.form .W{background:color-mix(in oklab,var(--win) 22%,transparent);color:var(--win)}.form .L{background:color-mix(in oklab,var(--loss) 22%,transparent);color:var(--loss)}
.side{display:flex;align-items:center;gap:18px;flex:1 1 420px;min-width:0;flex-wrap:wrap}
.strip{flex:1 1 260px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.strip>div{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:var(--r-card);padding:9px 12px;min-width:0;backdrop-filter:none}
.strip span{display:block;font:500 12px/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.strip b{display:block;font:900 30px/1 var(--f-display);margin-top:3px}
.strip small{font-size:12px;color:var(--muted)}.strip small.up{color:var(--win)}.strip small.down{color:var(--loss)}
.spark{grid-column:1/-1}
.spark .sb{position:relative;display:flex;align-items:flex-end;gap:3px;height:38px;margin-top:6px}
.spark .sb i{flex:1;border-radius:3px 3px 1px 1px;background:var(--loss);min-height:3px}.spark .sb i.hit{background:var(--win)}.spark .sb i.push{background:var(--draw)}
.spark .sb u{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(255,255,255,.7)}
@media (max-width:640px){.hero{padding:18px 16px;border-radius:var(--r-card)}.ph{gap:14px}.face{width:84px;height:84px}.ph h1{font-size:44px}.ghost{font-size:120px}}

/* controls */
.stats{position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.linebar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:8px 0 12px}
.lc{display:flex;align-items:center;gap:6px}
.lc button{width:38px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);font-size:18px;color:var(--muted);transition:border-color .2s,color .2s,transform .2s var(--spring)}
.lc button:hover{color:var(--accent);border-color:var(--accent)}.lc button:active{transform:scale(.92)}
.lc input{width:84px;height:40px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);font:800 22px/1 var(--f-display);letter-spacing:.02em;-moz-appearance:textfield}
.lc input::-webkit-inner-spin-button{-webkit-appearance:none}
.lc input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 18%,transparent)}
.lines{display:flex;gap:6px;flex-wrap:wrap}
.lchip{border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);padding:7px 9px;font:500 12px/1 var(--f-body);color:var(--muted);transition:border-color .18s,box-shadow .18s}
.lchip b{font:600 12px/1 var(--f-mono);letter-spacing:.06em;margin-right:5px}.lchip span{color:var(--fg);font-weight:700}
.lchip:hover{border-color:var(--fg)}
.lchip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sum{flex-basis:100%;margin:0;color:var(--muted);font-size:13px}.sum b{color:var(--fg)}

/* tiles and dials */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--line);border-radius:var(--r);padding:14px 8px 12px;
  background:var(--surface);box-shadow:inset 0 1px 0 var(--hair);transition:transform .22s var(--ease),border-color .2s,box-shadow .25s}
.tile:hover{transform:translateY(-2px);border-color:color-mix(in oklab,var(--fg) 26%,var(--line))}
.tile.on{border-color:var(--accent);box-shadow:var(--glow),inset 0 1px 0 var(--hair)}
.tile.hi{background:color-mix(in oklab,var(--win) 14%,var(--surface))}
.tile.lo{background:color-mix(in oklab,var(--loss) 13%,var(--surface))}
.tile>span:first-child{font:500 12px/1.2 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{position:relative;width:86px;height:86px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring circle{fill:none;stroke-width:7;stroke-linecap:butt;stroke:var(--loss)}
.ring circle.hit{stroke:var(--win)}.ring circle.push{stroke:var(--draw)}
.ring circle.trk{stroke:color-mix(in oklab,var(--fg) 9%,transparent)}.ring circle.arc{stroke:var(--accent);stroke-linecap:round}
.tile.hi .ring circle.arc{stroke:var(--win)}.tile.lo .ring circle.arc{stroke:var(--loss)}
.ring b{position:relative;font:900 30px/.95 var(--f-display)}
.tile small{font:500 12px/1 var(--f-mono);color:var(--muted)}

/* cards */
.card{position:relative;border-radius:var(--r-card);padding:16px;border:1px solid var(--line);background:var(--surface);box-shadow:inset 0 1px 0 var(--hair)}
.chh{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;min-height:26px}
.chh>b{font:800 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.chh>span{color:var(--muted);font-size:12px}
.key{margin-left:auto;display:flex;align-items:center;gap:6px;font:500 12px/1 var(--f-body);color:var(--muted)}
.key i{width:9px;height:9px;border-radius:3px;margin-left:8px;background:var(--loss)}
.key i.hit{background:var(--win)}.key i.avg{width:16px;height:2px;background:var(--accent-fill)}
.key em{font-style:normal}
.hint{margin:10px 0 0;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}

/* chart */
.chart{margin-top:14px}
.bars{position:relative;display:flex;gap:min(10px,max(1px,calc(28% / var(--n,10))));height:240px;margin:30px 0 44px;padding:0 50px 0 30px}
.zn{position:absolute;left:0;right:0;pointer-events:none}
.zn.hit{background:none}
.zn.miss{background:none}
.gl{position:absolute;left:0;right:0;border-top:1px solid color-mix(in oklab,var(--line) 70%,transparent);pointer-events:none}
.gl span{position:absolute;left:0;bottom:3px;font:500 12px/1 var(--f-mono);color:var(--muted)}
.gl.zero{border-top-color:color-mix(in oklab,var(--fg) 30%,transparent)}
.b{position:relative;flex:1;min-width:0;outline:0}
.b::before{content:"";position:absolute;inset:-22px -3px -40px;border-radius:var(--r-ctl);background:color-mix(in oklab,var(--fg) 6%,transparent);opacity:0;transition:opacity .15s}
.b:hover::before{opacity:1}
.b i{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:46px;border-radius:var(--r-ctl) var(--r-ctl) 1px 1px;background:var(--loss);transition:opacity .15s,filter .15s}
.b.neg i{border-radius:1px 1px var(--r-ctl) var(--r-ctl)}
.b.hit i{background:var(--win);box-shadow:none}
.b.push i{background:var(--draw)}
.b em{position:absolute;left:50%;transform:translateX(-50%);z-index:3;font:600 12px/1 var(--f-mono);font-style:normal;white-space:nowrap;text-shadow:none}
.bars:hover .b:not(:hover) i{opacity:.38}.b:hover i{filter:brightness(1.12)}
.bl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:7px;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 12px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.bl small{font-size:12px;opacity:.8}
.bl b{font-size:12px}.bl b.W{color:var(--win)}.bl b.L{color:var(--loss)}
.chart.fresh .b i{transform-origin:50% 100%;animation:grow .7s var(--ease) both;animation-delay:calc(var(--i)*24ms)}
.chart.fresh .b em{animation:fade .4s ease both;animation-delay:calc(var(--i)*24ms + .35s)}
@keyframes grow{from{transform:translateX(-50%) scaleY(0)}}@keyframes fade{from{opacity:0}}
.roll{position:absolute;left:30px;top:0;width:calc(100% - 80px);height:100%;overflow:visible;pointer-events:none}
.roll polyline{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;filter:none}
.ln{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--fg);z-index:4;cursor:ns-resize;touch-action:none}
.ln::before{content:"";position:absolute;left:0;right:0;top:-14px;height:28px}
.ln span{position:absolute;right:0;top:-13px;display:flex;align-items:center;gap:5px;background:var(--fg);color:var(--bg);font:700 12px/1 var(--f-mono);padding:6px 7px 6px 9px;border-radius:var(--r-ctl);box-shadow:none;transition:transform .15s var(--spring),background .15s}
.ln span svg{width:8px;height:11px;opacity:.6}
.ln.fixed{cursor:default}
.ln:not(.fixed):hover span,html.dragging .ln span{transform:scale(1.1);background:var(--accent-fill);color:var(--accent-ink)}
html.dragging,html.dragging *{cursor:ns-resize!important;user-select:none;-webkit-user-select:none}
.chart.dense .b em,.chart.dense .bl small{display:none}
/* with many games the opponent labels would sit on top of each other: keep every few, newest first */
.b:not(.lbk) .bl{display:none}
@media (max-width:640px){.b:not(.lbs) .bl{display:none}}
@media (max-width:640px){.bars{height:190px;padding:0 44px 0 22px}.roll{left:22px;width:calc(100% - 66px)}.key{margin-left:0;flex-basis:100%}.key i:first-child{margin-left:0}.chart.mid .b em{display:none}}

.back{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-top:12px}
.back input[type=range]{flex:1 1 140px;max-width:260px;accent-color:var(--accent);height:26px}
.back b{font:800 20px/1 var(--f-display);min-width:28px}
.avgl{position:absolute;left:0;right:0;border-top:1px dotted color-mix(in oklab,var(--accent) 70%,transparent);pointer-events:none;z-index:2}
.avgl span{position:absolute;left:0;top:3px;font:600 12px/1 var(--f-mono);color:var(--accent);background:var(--surface);padding:1px 3px;border-radius:4px}
.b u{display:none;position:absolute;left:50%;width:10px;height:10px;margin:0 0 -5px -5px;border-radius:50%;background:var(--loss);box-shadow:0 0 0 2px var(--surface);z-index:3;transition:transform .15s var(--spring)}
.b.hit u{background:var(--win);box-shadow:0 0 0 2px var(--surface)}.b.push u{background:var(--draw);box-shadow:0 0 0 2px var(--surface)}
.chart.trend .b i{display:none}.chart.trend .b u{display:block}.chart.trend .b:hover u{transform:scale(1.5)}
.chart.trend.dense .b u{width:7px;height:7px;margin:0 0 -3.5px -3.5px}
.roll.tl polyline.raw{stroke:color-mix(in oklab,var(--fg) 75%,transparent);stroke-width:1.5}
.chart.trend .roll:not(.tl) polyline{stroke-dasharray:4 4;opacity:.8}
/* premium layer: cursor light on cards, section eyebrows, sticky mini bar, profile strip, table view, colour-blind palette */
.card,.tile{--mx:-999px;--my:-999px}
.card::after,.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
  background:none}
.card:hover::after,.tile:hover::after{opacity:1}
.card{transition:border-color .25s,box-shadow .3s}
.card:hover{border-color:color-mix(in oklab,var(--fg) 16%,var(--line));box-shadow:inset 0 1px 0 var(--hair)}
.card>*{position:relative;z-index:1}
.sec{display:flex;align-items:center;gap:10px;margin:26px 2px 10px;scroll-margin-top:120px}
.sec i{font:600 12px/1 var(--f-mono);font-style:normal;color:var(--accent);border:1px solid color-mix(in oklab,var(--accent) 45%,transparent);border-radius:var(--r-ctl);padding:4px 6px;letter-spacing:.08em}
.sec b{font:800 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec+.card,.sec+.grid2,.sec+.grid3,.sec+div>.card:first-child,.sec+.tiles{margin-top:0}
.mini{position:fixed;left:0;right:0;z-index:29;transform:translateY(-110%);opacity:0;transition:transform .35s var(--ease),opacity .25s;pointer-events:none;
  background:var(--glass);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid var(--line)}
.mini.on{transform:none;opacity:1;pointer-events:auto}
.mini nav a[aria-current="true"]{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.mini-in{max-width:1180px;margin:0 auto;padding:7px 16px;display:flex;align-items:center;gap:8px 14px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.mini .who{display:flex;align-items:center;gap:9px;font:800 19px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.mini .who span{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;font-size:12px;color:var(--accent);position:relative;flex:none}
.mini .who img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.mini .pick{font:600 12px/1 var(--f-mono);color:var(--muted);white-space:nowrap}.mini .pick b{color:var(--fg)}
.mini .mp{font:900 22px/1 var(--f-display);white-space:nowrap}
.mini nav{margin-left:auto;display:flex;gap:2px}
.mini nav a{font:600 12px/1 var(--f-body);color:var(--muted);text-decoration:none;padding:7px 9px;border-radius:var(--r-ctl);white-space:nowrap}
.mini nav a:hover{color:var(--fg);background:color-mix(in oklab,var(--fg) 7%,transparent)}
.mini .lc button{width:28px;height:28px;font-size:15px}
.prof{margin-top:12px}
.rangep{position:relative;height:64px;margin:34px 6px 26px}
.rangep .trk{position:absolute;left:0;right:0;top:26px;height:12px;border-radius:var(--r-ctl);background:color-mix(in oklab,var(--fg) 8%,transparent)}
.rangep .mid{position:absolute;top:26px;height:12px;border-radius:var(--r-ctl);background:color-mix(in oklab,var(--accent) 35%,transparent)}
.rangep .pt{position:absolute;top:18px;width:2px;height:28px;background:var(--fg);border-radius:2px}
.rangep .pt span{position:absolute;top:32px;left:50%;transform:translateX(-50%);font:500 12px/1.2 var(--f-mono);color:var(--muted);white-space:nowrap;text-align:center}
.rangep .pt b{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font:800 17px/1 var(--f-display);white-space:nowrap}
.rangep .pt.ln2{background:none;border-left:2px dashed var(--fg);top:8px;height:48px}
.rangep .pt.ln2 b{bottom:52px;background:var(--fg);color:var(--bg);font:700 12px/1 var(--f-mono);padding:4px 6px;border-radius:var(--r-ctl)}
.rangep .dot{position:absolute;top:29px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--loss);opacity:.75}.rangep .dot.hit{background:var(--win)}.rangep .dot.push{background:var(--draw)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.kpis>div{border:1px solid var(--line);border-radius:var(--r-card);padding:10px 12px;background:color-mix(in oklab,var(--bg) 45%,transparent)}
.kpis span{display:block;font:500 12px/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kpis b{display:block;font:900 28px/1 var(--f-display);margin:4px 0 2px}.kpis small{font-size:12px;color:var(--muted)}
.kpis .bar{height:4px;border-radius:4px;background:color-mix(in oklab,var(--fg) 9%,transparent);margin-top:7px;overflow:hidden}.kpis .bar i{display:block;height:100%;border-radius:4px;background:var(--accent-fill)}
.b.miss i{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.2) 0 4px,transparent 4px 8px),var(--loss)}
.spark .sb i:not(.hit):not(.push),.db:not(.hit):not(.push)>i{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.2) 0 3px,transparent 3px 6px)}
.ln:focus-visible{outline:0}.ln:focus-visible span{box-shadow:0 0 0 3px var(--accent)}
.ico{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);color:var(--muted);font-size:16px;flex:none;transition:color .2s,border-color .2s}
.ico:hover,.ico[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
@media (max-width:820px){.mini nav{display:none}.sec{margin-top:20px}}
.bars[hidden]{display:none}
/* the read */
.read{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px 26px;margin-top:12px;overflow:hidden}
.read::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:none}
.read.pos::before{background:none}
.read.neg::before{background:none}
.read>*{position:relative}
.read-v>span{font:500 12px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.read-v strong{display:block;font:900 44px/.9 var(--f-display);text-transform:uppercase;letter-spacing:.015em;margin:8px 0 14px}
.read.pos strong{color:var(--win)}.read.neg strong{color:var(--loss)}
.read-n{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.read-v>span em{font-style:normal;color:var(--fg)}.read-v>span em.up{color:var(--win)}.read-v>span em.down{color:var(--loss)}
.read-n div{border:1px solid var(--line);border-radius:var(--r-card);padding:9px 10px;background:color-mix(in oklab,var(--bg) 50%,transparent)}
.read-n b{display:block;font:900 26px/1 var(--f-display)}.read-n small{font-size:12px;color:var(--muted)}
.read-v p{margin:12px 0 0;color:var(--muted);font-size:12px}
.read-l{list-style:none;margin:0;padding:0;display:grid;gap:9px;align-content:center}
.read-l li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:color-mix(in oklab,var(--fg) 82%,var(--muted))}
.read-l li b{color:var(--fg)}
.read-l i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--draw)}
.read-l .up i{background:var(--win);box-shadow:none}.read-l .down i{background:var(--loss);box-shadow:none}
@media (max-width:820px){.read{grid-template-columns:1fr}.read-v strong{font-size:36px}}

/* ladder and distribution */
.ladr{margin-left:auto}.ladr b{font:800 22px/1 var(--f-display);color:var(--fg)}
.ladp{position:relative;height:150px;margin-top:12px;cursor:crosshair;border-bottom:1px solid var(--line);touch-action:none}
.ladp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ladl{fill:none;stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.lad50{position:absolute;left:0;right:0;top:50%;border-top:1px dashed color-mix(in oklab,var(--muted) 55%,transparent);pointer-events:none}
.lad50 span{position:absolute;right:0;bottom:3px;font:500 12px/1 var(--f-mono);color:var(--muted)}
.ladc,.ladh{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--fg);pointer-events:none}
.ladc i,.ladh i{position:absolute;left:-6.5px;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 3px var(--surface)}
.ladh{border-left:1.5px dashed var(--accent)}.ladh i{background:var(--accent-fill);box-shadow:0 0 0 3px var(--surface)}
.ladm{position:absolute;bottom:-1px;width:1px;height:12px;background:var(--muted);padding:0;border:0}
.ladm span{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font:600 12px/1 var(--f-mono);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:3px 4px}
.ladx{display:flex;justify-content:space-between;margin-top:6px;font:500 12px/1 var(--f-mono);color:var(--muted)}
.distp{position:relative;height:150px;margin-top:12px;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;align-items:end;border-bottom:1px solid var(--line)}
.db{position:relative;height:100%;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;outline:0}
.db>i{display:block;width:100%;max-width:30px;flex:none;border-radius:4px 4px 1px 1px;background:var(--loss);transition:opacity .15s}
.db.hit>i{background:var(--win)}.db.push>i{background:var(--draw)}
.distp.units .db>i{height:17px;border-radius:4px;background:var(--loss)}.distp.units .db>i.hit{background:var(--win)}.distp.units .db>i.push{background:var(--draw)}
.distp:hover .db:not(:hover)>i{opacity:.4}
.distl{position:absolute;top:-4px;bottom:0;width:0;border-left:2px dashed var(--fg);pointer-events:none}
.distl span{position:absolute;top:0;left:50%;transform:translate(-50%,-60%);background:var(--fg);color:var(--bg);font:700 12px/1 var(--f-mono);padding:4px 6px;border-radius:var(--r-ctl)}

/* season map and duels */
.map{margin-top:12px}
.mapg{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:4px;margin-top:14px}
.mapg.few{grid-template-columns:repeat(auto-fill,minmax(34px,1fr))}
@media (max-width:820px){.mapg{grid-template-columns:repeat(15,minmax(0,1fr))}}
.mc{position:relative;aspect-ratio:1;border-radius:var(--r-ctl);display:grid;place-items:center;background:color-mix(in oklab,var(--loss) calc(var(--a)*100%),var(--surface-2));outline:0;transition:transform .15s var(--spring)}
.mc.hit{background:color-mix(in oklab,var(--win) calc(var(--a)*100%),var(--surface-2))}.mc.push{background:var(--draw)}
.mc:hover{transform:scale(1.25);z-index:2}
.mc em{font:600 12px/1 var(--f-mono);font-style:normal;color:var(--fg);text-shadow:none}
.mapg:not(.few) .mc em{display:none}
.scale i{background:color-mix(in oklab,var(--loss) calc(var(--a)*100%),var(--surface-2))!important;margin-left:2px}
.scale i.hit{background:color-mix(in oklab,var(--win) calc(var(--a)*100%),var(--surface-2))!important}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.du span{font:500 12px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.du b{display:block;font:900 44px/1 var(--f-display);margin:4px 0}
.du.hi b{color:var(--win)}.du.lo b{color:var(--loss)}
.du small{font:500 12px/1 var(--f-mono);color:var(--muted)}
.du.r{text-align:right}
.dvs{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:90px}
.dvs i{font:800 14px/1 var(--f-display);font-style:normal;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.dbar{display:flex;width:100%;height:7px;border-radius:var(--r-ctl);overflow:hidden;gap:2px}
.dbar u{background:var(--draw)}.dbar u.hi{background:var(--win)}.dbar u.lo{background:var(--loss)}
.dvs em{font:500 12px/1 var(--f-mono);font-style:normal;color:var(--muted)}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.filters label{display:grid;gap:5px;font:500 12px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.filters select{height:36px;border:1px solid var(--line);border-radius:var(--rc);background:var(--surface);padding:0 10px;font:500 13px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--fg);max-width:210px}
.filters select:hover{border-color:color-mix(in oklab,var(--fg) 30%,var(--line))}

/* splits */
.split{display:grid;grid-template-columns:118px 1fr 50px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed color-mix(in oklab,var(--line) 80%,transparent)}
.split:last-child{border-bottom:0}
.split .n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split .track{height:8px;border-radius:var(--r-ctl);background:color-mix(in oklab,var(--fg) 8%,transparent);overflow:hidden}
.split .track i{display:block;height:100%;border-radius:var(--r-ctl)}
.split .p{text-align:right;font:800 18px/1 var(--f-display)}
.split .s{font:500 12px/1 var(--f-mono);color:var(--muted);grid-column:2/4;margin-top:-5px}

/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--surface);font:500 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th[data-sort]{cursor:pointer}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px;border-bottom:1px solid color-mix(in oklab,var(--line) 60%,transparent);text-align:right;white-space:nowrap}
.tbl tbody tr:hover td{background:color-mix(in oklab,var(--accent) 7%,transparent)}
.tbl tr.sel td{background:color-mix(in oklab,var(--accent) 10%,transparent)}
.tbl th.fc,.tbl td.fc{background:color-mix(in oklab,var(--accent) 9%,var(--surface))}
.scroll{overflow:auto;max-height:560px;border-radius:var(--r-ctl);margin-top:10px}
.heat{display:inline-block;min-width:46px;text-align:center;padding:3px 6px;border-radius:var(--r-ctl);font:600 12px/1 var(--f-mono)}
.cell-h{color:var(--win);font-weight:700}.cell-m{color:var(--loss)}
.sub{color:var(--muted);font-size:12px}

/* team extras */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sgrid>div{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-card);padding:8px 10px}
.sgrid .l{font-size:12px;color:var(--muted)}.sgrid .v{font:800 22px/1.1 var(--f-display)}.sgrid .rk{font:600 12px/1 var(--f-mono);color:var(--accent)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;max-height:420px;overflow:auto;margin-top:10px}
.rp{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-card);padding:7px 9px;transition:border-color .18s,transform .18s var(--spring)}
.rp:hover{border-color:var(--accent);transform:translateY(-1px)}
.rp .av{width:36px;height:36px;border-radius:50%;background:color-mix(in oklab,var(--fg) 10%,transparent);overflow:hidden;flex:none}
.rp .av img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.rp .rn{display:flex;flex-direction:column;min-width:0}.rp b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rp small{color:var(--muted);font-size:12px}
.rp em{color:var(--loss);font-style:normal}

/* board */
.brow{display:grid;grid-template-columns:38px 1.6fr 1fr 70px 70px 70px 64px;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid color-mix(in oklab,var(--line) 60%,transparent);border-radius:var(--r-ctl);cursor:pointer;transition:background .15s}
.brow:hover{background:color-mix(in oklab,var(--accent) 7%,transparent)}
.brow .rk{font:900 24px/1 var(--f-display);color:var(--muted);text-align:center}.brow.top3 .rk{color:var(--accent)}
.brow .nm{font-weight:700}
.bday{font:700 12px/1.2 var(--f-body,inherit);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 6px 4px}
.hotc{display:inline-block;font:700 11px/1 var(--f-body,inherit);padding:3px 6px;border-radius:999px;background:color-mix(in oklab,var(--accent) 22%,transparent);color:var(--ink,inherit);vertical-align:1px}
.boff{margin-top:12px}
.sidec{font:700 12px/1 var(--f-mono);padding:4px 7px;border-radius:var(--r-ctl)}
.sidec.over{background:color-mix(in oklab,var(--win) 18%,transparent);color:var(--win)}.sidec.under{background:color-mix(in oklab,var(--loss) 18%,transparent);color:var(--loss)}
@media (max-width:700px){.brow{grid-template-columns:30px 1fr 64px 60px}.brow .hide-s{display:none}}

/* states */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty h2{font:900 44px/.95 var(--f-display);text-transform:uppercase;color:var(--fg);margin:14px 0 8px}
.beam{width:120px;height:120px;margin:0 auto;border-radius:50%;background:none;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
.skel{border-radius:var(--r-card);background:var(--surface);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:26px}
.tip{position:fixed;z-index:60;pointer-events:none;display:none;min-width:170px;max-width:260px;padding:10px 12px;border-radius:var(--r-card);background:color-mix(in oklab,var(--surface) 94%,transparent);border:1px solid color-mix(in oklab,var(--fg) 18%,var(--line));
  box-shadow:var(--shadow-lg);backdrop-filter:none;font-size:12.5px}
.tip small{display:block;color:var(--muted);font:500 12px/1.3 var(--f-mono)}.tip strong{display:block;font-size:13px}
.tip .tv b{font:800 26px/1 var(--f-display);margin-right:3px}.tip .tv{color:var(--muted)}
.tip .hit{color:var(--win);font-weight:600}.tip .miss{color:var(--loss);font-weight:600}.tip .push{color:var(--muted)}
html.dragging .tip{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- Lab home, not-found state ---------- */
.lh{display:grid;gap:18px;margin-top:20px}
.lh-hero{padding:28px;border-radius:var(--r-card);border:1px solid var(--line);background:color-mix(in oklab,var(--accent) 5%,var(--surface))}
.lh-hero h1{margin:0 0 8px;font:700 clamp(34px,4.6vw,56px)/.95 var(--f-display);text-transform:uppercase;letter-spacing:-.005em;text-wrap:balance}
.lh-hero p{margin:0 0 16px;max-width:60ch;color:var(--muted);font-size:15px}
.lh-ex{display:flex;flex-wrap:wrap;gap:8px}
.ex{min-height:40px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:600;font-size:13.5px;transition:border-color .15s,background .15s}
.ex:hover{border-color:color-mix(in oklab,var(--accent) 50%,var(--line))}.ex.primary{background:var(--accent-fill);color:var(--accent-ink);border-color:transparent}
.lh-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:s}
.lh-steps li{counter-increment:s;display:grid;gap:4px;padding:16px;border-radius:var(--r-card);border:1px solid var(--line);background:var(--surface)}
.lh-steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--accent);font:700 15px/1 var(--f-display)}
.lh-steps b{font-size:15px}.lh-steps span{color:var(--muted);font-size:13px}
.lh-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lh-card{padding:16px;border-radius:var(--r-card);border:1px solid var(--line);background:var(--surface)}
.lh-card h3{margin:0 0 10px;font-size:14px;font-weight:600}
.lh-hot{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lh-hot button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:6px 10px;border-radius:var(--r-ctl);border:0;background:none;text-align:left}
.lh-hot button:hover{background:var(--surface-2)}.lh-hot b{display:block;font-size:14px}.lh-hot small{color:var(--muted);font-size:12px}.lh-hot em{font:700 18px/1 var(--f-display);font-style:normal;color:var(--accent)}
.lh-small{margin:8px 0 0;color:var(--muted);font-size:12px}
@media (max-width:700px){.lh-steps{grid-template-columns:1fr}.lh-hero{padding:20px}}

.filters input[type=number]{width:84px;min-height:40px;padding:0 10px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-variant-numeric:tabular-nums}
.backt{width:70px;min-height:36px;padding:0 8px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:700 16px/1 var(--f-display);text-align:center}

<script>

const APP_ID = '__DISCORD_APP_ID__';

const IN_DISCORD = QS.has('frame_id');
const THEME_SCHEME = { 'night-match': 'dark', 'team-colors': 'light', 'members-club': 'dark', 'aurora-glass': 'dark', chrono: 'light', 'stadium-gold': 'dark' };
{ let t = QS.get('theme'); if (!THEME_SCHEME[t]) { try { t = localStorage.getItem('floodlight-theme') } catch (e) {} } if (!THEME_SCHEME[t]) t = 'night-match';
  document.documentElement.dataset.theme = t; document.documentElement.dataset.scheme = THEME_SCHEME[t] }
// each theme's own faces, served through this server so they also load inside Discord
function labTheme(t) { if (!THEME_SCHEME[t]) return; const r = document.documentElement; r.dataset.theme = t; r.dataset.scheme = THEME_SCHEME[t];
  let l = document.getElementById('flFonts'); if (!l) { l = document.createElement('link'); l.rel = 'stylesheet'; l.id = 'flFonts'; document.head.appendChild(l) }
  const href = '/api/lab/fonts.css?theme=' + t; if (l.getAttribute('href') !== href) l.setAttribute('href', href) }

document.addEventListener('keydown', e => { const t = e.target.closest?.('[data-ttab]'); if (!t || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return; e.preventDefault();
  const i = TTABS.findIndex(x => x[0] === t.dataset.ttab), j = e.key === 'Home' ? 0 : e.key === 'End' ? TTABS.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + TTABS.length) % TTABS.length; document.getElementById('tt-' + TTABS[j][0])?.click() });
$('#tabs').addEventListener('click', e => { const t = e.target.closest('button'); if (!t) return; S.tab = t.dataset.t; tabs(); $('#msg').innerHTML = ''; render() });
$('#recent').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.sport = b.dataset.s; load(b.dataset.n, b.dataset.t) });
function setBack(nn) { const tot = pool(S.k).length; S.back = Math.max(1, Math.min(tot, nn)); S.range = S.back >= tot ? 'all' : S.back === 5 ? 'l5' : S.back === 10 ? 'l10' : S.back === 20 ? 'l20' : 'n'; const y = scrollY; render(); scrollTo(0, y) }
document.addEventListener('input', e => { if (e.target.id === 'backR') { const o = $('#backT'); if (o) o.value = e.target.value } });
const setLine = v => { S.line = Math.round(v * 100) / 100; S.lineFrom = 'custom'; render() };
document.addEventListener('click', e => {
  const t = e.target;
  const br = t.closest('.brow'); if (br) return load(br.dataset.n, 'player', { stat: br.dataset.k, line: br.dataset.l });
  const rp = t.closest('[data-player]'); if (rp) { scrollTo({ top: 0, behavior: 'smooth' }); return load(rp.dataset.player, 'player') }
  const kk = t.closest('[data-k]'); if (kk) return pickStat(kk.dataset.k);
  const st = t.closest('[data-step]'); if (st) return setLine(S.line + .5 * +st.dataset.step);
  const sd = t.closest('[data-side]'); if (sd) { S.side = sd.dataset.side; return render() }
  const bb = t.closest('[data-back]'); if (bb) return setBack(+bb.dataset.back);
  const md = t.closest('[data-mode]'); if (md) { S.mode = md.dataset.mode; store.set('lab.mode', S.mode); return render() }
  const rg = t.closest('[data-r]'); if (rg) { S.range = rg.dataset.r; render(); if (S.range === 'h2h' && !S.opp) document.querySelector('[data-f="opp"]')?.focus(); return }
  const bk = t.closest('[data-line]'); if (bk) return setLine(+bk.dataset.line);
  const so = t.closest('[data-sort]'); if (so) { const c = so.dataset.sort; S.sort = { col: c, dir: S.sort.col === c ? -S.sort.dir : (c === 'l' ? 1 : -1) }; return render() }
  const lp = t.closest('#ladp'); if (lp && S.ladder) { const L = ladAt(e, lp); if (L) setLine(L[0]) }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'backR' || t.id === 'backT') return setBack(+t.value || 1);
  if (t.id === 'line') { const v = parseFloat(t.value); if (!isNaN(v)) setLine(v); return }
  if (t.dataset.f) { const f = t.dataset.f; S[f] = f === 'minMin' || f === 'maxMin' ? (+t.value || 0) : t.value; if (f === 'opp') S.range = t.value ? 'h2h' : (S.range === 'h2h' ? 'l10' : S.range); render() }
});
// hover cards
const tip = $('#tip');
function showTip(el, x, y) { tip.innerHTML = el.dataset.tip; tip.style.display = 'block'; const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + 'px'; tip.style.top = (y + h + 24 > innerHeight ? Math.max(8, y - h - 14) : y + 16) + 'px' }
document.addEventListener('pointermove', e => {
  if (S.drag) return;
  const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.style.display = 'none';
  const lp = e.target.closest && e.target.closest('#ladp'), h = $('#ladh');
  if (lp && S.ladder) { const L = ladAt(e, lp); if (L && h) { const { x0, x1, side } = S.ladder; h.hidden = false; h.style.left = (L[0] - x0) / (x1 - x0) * 100 + '%'; h.firstChild.style.top = (1 - L[1]) * 100 + '%';
    $('#ladr').innerHTML = `<b class="num">${pc(L[1])}</b> ${side.toLowerCase()} ${lineTxt(L[0])} · ${L[2]} of ${L[3]}` } }
  else if (h && !h.hidden) { h.hidden = true; const cur = rate(inRange(pool(S.k), S.range), S.k, S.line, S.side); $('#ladr').innerHTML = `<b class="num">${pc(cur.pct)}</b> ${S.side} ${lineTxt(S.line)} · ${cur.hit} of ${cur.n - cur.push}` }
});
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top) } });
document.addEventListener('focusout', () => { tip.style.display = 'none' });
function ladAt(e, lp) { const r = lp.getBoundingClientRect(), { pts, x0, x1 } = S.ladder, L = x0 + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (x1 - x0); return pts.reduce((a, b) => Math.abs(b[0] - L) < Math.abs(a[0] - L) ? b : a) }
// drag the line on the chart: the bars, dials, the read and the tables follow as it moves
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('[data-drag]'); if (!h) return;
  const bars = h.parentElement; S.drag = { max: +bars.dataset.max, min: +bars.dataset.min, raf: 0, y: e.clientY };
  document.documentElement.classList.add('dragging'); tip.style.display = 'none'; e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!S.drag) return; S.drag.y = e.clientY;
  if (S.drag.raf) return;
  S.drag.raf = requestAnimationFrame(() => { if (!S.drag) return; S.drag.raf = 0;
    const bars = document.querySelector('.bars'); if (!bars) return; const r = bars.getBoundingClientRect();
    const v = S.drag.min + (1 - Math.max(0, Math.min(1, (S.drag.y - r.top) / r.height))) * (S.drag.max - S.drag.min), snapped = Math.floor(v) + .5;
    if (snapped !== S.line) { S.line = snapped; S.lineFrom = 'custom'; const y = scrollY; render(); scrollTo(0, y) } });
});
const endDrag = () => { if (!S.drag) return; cancelAnimationFrame(S.drag.raf); S.drag = null; document.documentElement.classList.remove('dragging'); render() };
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
S.mode = store.get('lab.mode', 'bars');
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.brow')) { e.preventDefault(); e.target.click() } });
document.addEventListener('keydown', e => { if (!e.target.matches || !e.target.matches('.ln[data-drag]')) return; const d = e.key === 'ArrowUp' || e.key === 'ArrowRight' ? 1 : e.key === 'ArrowDown' || e.key === 'ArrowLeft' ? -1 : 0; if (!d) return; e.preventDefault(); const y = scrollY; setLine(S.line + .5 * d); scrollTo(0, y); document.querySelector('.ln[data-drag]')?.focus() });
const setCb = on => { document.documentElement.toggleAttribute('data-cb', on); $('#cb').setAttribute('aria-pressed', on); store.set('lab.cb', on) };
$('#cb').addEventListener('click', () => setCb(!document.documentElement.hasAttribute('data-cb'))); setCb(store.get('lab.cb', false));
document.addEventListener('pointermove', e => { const c = e.target.closest && e.target.closest('.card,.tile'); if (!c) return; const r = c.getBoundingClientRect(); c.style.setProperty('--mx', e.clientX - r.left + 'px'); c.style.setProperty('--my', e.clientY - r.top + 'px') }, { passive: true });
document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('.mini nav a'); if (!a) return; e.preventDefault(); const el = document.getElementById(a.getAttribute('href').slice(1)); if (!el) return;
  const bar = $('#mini').offsetHeight + 8;
  // inside the site, the site page scrolls: ask it to bring this point of the frame under the bar
  if (VIS != null && window.parent !== window) { try { window.parent.postMessage({ lab: 'scrollTo', y: el.getBoundingClientRect().top - bar }, location.origin) } catch (x) {} }
  else scrollTo({ top: el.getBoundingClientRect().top + scrollY - ($('.top').offsetHeight + bar), behavior: 'smooth' });
  el.setAttribute('tabindex', '-1'); el.focus({ preventScroll: true }) });
start();
</script>
