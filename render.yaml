services:
  - type: web
    name: floodlight
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLOODLIGHT_ADMIN
        sync: false
      - key: FLOODLIGHT_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_APP_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_DIGEST_HOURS
        value: "14"
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_MEMBER_ROLES
        sync: false
