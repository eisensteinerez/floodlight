services:
  - type: web
    name: floodlight
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLOODLIGHT_ADMIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
